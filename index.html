  // ----- Firebase: autenticación y base de datos en la nube -----
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyAdDsvcGtkIUVHhX5o-VIivgKd_nnoqUws",
    authDomain: "viet-pottery.firebaseapp.com",
    projectId: "viet-pottery",
    storageBucket: "viet-pottery.firebasestorage.app",
    messagingSenderId: "451880236267",
    appId: "1:451880236267:web:51c93138c0061a46f53aae"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const DREF = doc(db, 'app', 'data');
  window.FB = {
    signIn:(e,p)=>signInWithEmailAndPassword(auth,e,p),
    signOutNow:()=>signOut(auth),
    onAuth:(cb)=>onAuthStateChanged(auth,cb),
    getData: async ()=>{ const s=await getDoc(DREF); return s.exists()?(s.data().db||null):null; },
    setData:(obj)=>setDoc(DREF,{db:obj}),
    watch:(cb)=>onSnapshot(DREF,(s)=>{ if(s.exists()&&s.data().db) cb(s.data().db); })
  };
  if(window.bootFirebaseApp) window.bootFirebaseApp();
</script>

/* ---- Actualización de la plataforma ---- */
// Recarga la página saltando la caché (clave cuando está fijada como ícono en el inicio del celular).
function actualizarPlataforma(){
  const btn=document.getElementById('btnActualizarTxt'); if(btn) btn.textContent='Actualizando…';
  const base=location.href.split('?')[0].split('#')[0];
  location.replace(base+'?v='+Date.now());
}
// Revisa si hay una versión más nueva publicada y, si la hay, avisa con un banner.
async function checkForUpdate(silent){
  try{
    const url=location.href.split('?')[0].split('#')[0]+'?check='+Date.now();
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok) return;
    const txt=await res.text();
    const m=txt.match(/APP_VERSION\s*=\s*'([^']+)'/);
    const remote=m?m[1]:null;
    if(remote && remote!==APP_VERSION){ mostrarBannerActualizacion(remote); }
    else if(!silent){ toastInfo('Ya tienes la última versión ('+APP_VERSION+').'); }
  }catch(e){ /* sin conexión: ignorar */ }
}
function mostrarBannerActualizacion(remote){
  if(document.getElementById('updBanner')) return;
  const b=document.createElement('div');
  b.id='updBanner';
  b.style.cssText='position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;max-width:92vw;';

  </div>`;
  document.body.appendChild(b);
}
function toastInfo(msg){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;background:#23332a;color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;box-shadow:0 8px 28px rgba(0,0,0,.25);';
  t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .4s'; t.style.opacity='0'; setTimeout(()=>t.remove(),400); }, 2600);
}
// Guarda/comparte un PDF de jsPDF. En celular usa el menú nativo "Compartir" (evita el bug del enlace blob: en iOS).
async function savePdfDoc(doc, filename){
  if(isMobileDevice()){
    try{
      const blob = doc.output('blob');
      const file = new File([blob], filename, {type:'application/pdf'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:filename});
        return;
      }
    }catch(e){ if(e && e.name==='AbortError') return; /* si falla, baja por descarga normal */ }
  }
  try{ doc.save(filename); }
  catch(e){ try{ window.open(doc.output('bloburl'),'_blank'); }catch(_){ alert('No se pudo generar el PDF en este dispositivo.'); } }
}
// Guarda/comparte una imagen (canvas). En celular usa el menú nativo "Compartir".
async function saveCanvasImage(canvas, filename){
  const dataUrl = canvas.toDataURL('image/png');
  if(isMobileDevice()){
    try{
      const blob = await (await fetch(dataUrl)).blob();
      const file = new File([blob], filename, {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:filename});
        return;
      }
    }catch(e){ if(e && e.name==='AbortError') return; }
  }
  const a=document.createElement('a'); a.download=filename; a.href=dataUrl; document.body.appendChild(a); a.click(); a.remove();
}

function save(){ if(window.FB && DB) FB.setData(DB); }

async function bootData(){
  let data = window.FB ? await FB.getData() : null;
  if(!data){
    // Primera vez: catálogo real de productos, sin datos de demo.
    data = seed();
    data.clients=[]; data.sales=[]; data.purchases=[]; data.orders=[]; data.adjustments=[]; data.users=[]; data.quotes=[];
    data.counter={boleta:92, factura:12, oc:0, pres:0};
    if(window.FB) await FB.setData(data);
  }
  DB = data;
  if(!DB.orders) DB.orders=[];
  if(!DB.users) DB.users=[];
  if(!DB.adjustments) DB.adjustments=[];
  if(!DB.quotes) DB.quotes=[];
  if(!DB.counter) DB.counter={boleta:0,factura:0,oc:0,pres:0};
  if(typeof DB.counter.oc!=='number') DB.counter.oc=0;
  if(typeof DB.counter.pres!=='number') DB.counter.pres=0;
}

/* ---------- Helpers de negocio ---------- */
const productById = id => DB.products.find(p=>p.id===id);
const clientById = id => DB.clients.find(c=>c.id===id);
const productName = p => `${p.modelo} ${p.tamano!=='Único'?p.tamano:''} ${p.color!=='Natural'?'· '+p.color:''}`.replace(/\s+/g,' ').trim();
const lineTotal = i => i.cantidad*i.precio*(1-(i.descuento||0)/100);
const saleSubtotal = s => s.items.reduce((a,i)=>a+lineTotal(i),0);   // solo productos (con descuentos)
const saleTotal = s => saleSubtotal(s) + (s.costoEnvio||0);          // total que paga el cliente: productos + envío
const saleCost  = s => s.items.reduce((a,i)=>{const p=productById(i.productId);return a+(p?p.costo:0)*i.cantidad;},0);
// Nombre limpio de un item: usa el catálogo y, si no, limpia la descripción (quita "xN" duplicado).
const itemLabel = i => { const p=productById(i.productId); return p?productName(p):String(i.descripcion||'').replace(/\s*x\s*\d+\s*$/i,'').trim(); };
// Lista de productos de una venta en líneas alineadas (cantidad × nombre).
const saleItemsHtml = s => s.items.map(i=>`<div class="flex items-baseline gap-1.5 whitespace-nowrap"><span class="text-clay-400 tabular-nums font-medium">${i.cantidad}×</span><span>${itemLabel(i)}</span></div>`).join('');

function stockOf(productId){
  const p = productById(productId); if(!p) return 0;
  let s = p.stockInicial;
  DB.sales.forEach(v=>v.items.forEach(i=>{ if(i.productId===productId) s-=i.cantidad; }));
  DB.purchases.forEach(c=>c.items.forEach(i=>{ if(i.productId===productId) s+=i.cantidad; }));
  DB.adjustments.forEach(a=>{ if(a.productId===productId) s+=a.cantidad; });
  return s;
}
function clientBalance(clientId){
  return DB.sales.filter(s=>s.clienteId===clientId && !s.pagado).reduce((a,s)=>a+saleTotal(s),0);
}

// Arranca cuando Firebase está listo (lo llama el script de módulo).
function bootFirebaseApp(){
  if(window.__vpBooted) return; window.__vpBooted=true;
  FB.onAuth(async (user)=>{
    if(!user){ SESSION=null; showLogin(); return; }
    try{ await bootData(); }
    catch(e){ console.error(e); alert('No se pudieron cargar los datos. Revisa tu conexión e intenta de nuevo.'); showLogin(); return; }
    const email=(user.email||'').toLowerCase();
    let u=(DB.users||[]).find(x=>(x.email||'').toLowerCase()===email);
    if(!u){
      if(!DB.users || DB.users.length===0){ u={email:user.email, nombre:emailNombre(user.email), rol:'admin'}; DB.users.push(u); save(); }
      else { alert('Tu usuario ('+user.email+') aún no tiene permisos en la plataforma. Pídele al administrador que te agregue en el módulo Usuarios.'); FB.signOutNow(); showLogin(); return; }
    }
    SESSION={email:u.email, nombre:u.nombre, rol:u.rol};
    FB.watch((data)=>{ DB=data; if(!DB.orders)DB.orders=[]; if(!DB.users)DB.users=[]; if(!DB.quotes)DB.quotes=[]; rerender(); });
    showApp();
  });
}

/* ---------- Logo (carga logo.png, recorta y le quita el fondo blanco en el navegador) ---------- */
let LOGO_DATAURL=null, LOGO_W=0, LOGO_H=0;
function prepareLogo(){
  const img=new Image(); img.crossOrigin='anonymous';
  img.onload=function(){
    try{
      const cv=document.createElement('canvas'); cv.width=img.naturalWidth; cv.height=img.naturalHeight;
      const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0);
      const id=ctx.getImageData(0,0,cv.width,cv.height); const d=id.data;
      let minX=cv.width,minY=cv.height,maxX=0,maxY=0,found=false;
      for(let i=0;i<d.length;i+=4){
        const wmin=Math.min(d[i],d[i+1],d[i+2]);
        let a; if(wmin>=245)a=0; else if(wmin<=225)a=255; else a=Math.round((245-wmin)/20*255);
        d[i+3]=a;
        if(a>20){ found=true; const idx=i/4, px=idx%cv.width, py=(idx/cv.width)|0; if(px<minX)minX=px; if(px>maxX)maxX=px; if(py<minY)minY=py; if(py>maxY)maxY=py; }
      }
      ctx.putImageData(id,0,0);
      let sx=0,sy=0,sw=cv.width,sh=cv.height;
      if(found){ const pad=Math.round(Math.max(cv.width,cv.height)*0.02); sx=Math.max(0,minX-pad); sy=Math.max(0,minY-pad); sw=Math.min(cv.width-sx,maxX-minX+1+2*pad); sh=Math.min(cv.height-sy,maxY-minY+1+2*pad); }
      const out=document.createElement('canvas'); out.width=sw; out.height=sh;
      out.getContext('2d').drawImage(cv,sx,sy,sw,sh,0,0,sw,sh);
      LOGO_DATAURL=out.toDataURL('image/png'); LOGO_W=sw; LOGO_H=sh;
    }catch(e){ LOGO_DATAURL=img.src; LOGO_W=img.naturalWidth; LOGO_H=img.naturalHeight; }
    applyLogo();
  };
  img.onerror=function(){ /* sin logo.png: se mantiene el diseño con "VP" */ };
  img.src='logo.png?v=1';
}
function applyLogo(){
  if(!LOGO_DATAURL) return;
  const lb=document.getElementById('loginBrand');
  if(lb) lb.innerHTML='<img src="'+LOGO_DATAURL+'" alt="Viet Pottery" class="mx-auto h-24 object-contain mb-2"><p class="text-clay-500 text-sm">Plataforma de gestión · Stock · Ventas · Despachos</p>';
}

/* ===================== REPORTES ===================== */
let REP={preset:'mes', from:'', to:'', sort:'cantidad', dir:'desc', cat:'todas', geo:'region', tab:'resumen'};
function repIso(d){const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const da=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${da}`;}
function repRange(){
  const t=new Date(); t.setHours(0,0,0,0); const today=repIso(t);
  if(REP.preset==='hoy') return [today,today];
  if(REP.preset==='semana'){ const day=(t.getDay()+6)%7; const mon=new Date(t); mon.setDate(t.getDate()-day); return [repIso(mon),today]; }
  if(REP.preset==='mes') return [repIso(new Date(t.getFullYear(),t.getMonth(),1)),today];
  if(REP.preset==='anio') return [repIso(new Date(t.getFullYear(),0,1)),today];
  if(REP.preset==='personalizado') return [REP.from||today, REP.to||today];
  return ['0000-01-01','9999-12-31'];
}
function setRepPreset(p){ REP.preset=p; REP.cat='todas'; if(p==='personalizado' && (!REP.from||!REP.to)){ const t=new Date(); REP.from=repIso(new Date(t.getFullYear(),t.getMonth(),1)); REP.to=repIso(t); } renderReportes(); }
function setRepFrom(v){ REP.from=v; REP.cat='todas'; renderReportes(); }
function setRepTo(v){ REP.to=v; REP.cat='todas'; renderReportes(); }
function setRepSort(v){ if(REP.sort===v){ REP.dir=REP.dir==='asc'?'desc':'asc'; } else { REP.sort=v; REP.dir='desc'; } renderReportes(); }
function setRepCat(c){ REP.cat=c; renderReportes(); }
function setRepGeo(g){ REP.geo=g; renderReportes(); }
function setRepTab(t){ REP.tab=t; renderReportes(); }
function geoAgg(sales, level){
  const g={};
  sales.forEach(s=>{
    let label, ctx='', key;
    if(level==='region'){ label=regionOf(s.ciudad); key=label.toLowerCase(); }
    else if(level==='ciudad'){ label=titleCase(s.ciudad)||'Sin ciudad'; ctx=regionOf(s.ciudad); key=label.toLowerCase(); }
    else { label=titleCase(s.comuna)||'Sin comuna'; ctx=titleCase(s.ciudad)||''; key=(label+'|'+ctx).toLowerCase(); }
    if(!g[key]) g[key]={label,ctx,nVentas:0,unidades:0,monto:0,clientes:new Set()};
    const o=g[key];
    o.nVentas++; o.unidades+=s.items.reduce((x,i)=>x+i.cantidad,0); o.monto+=saleSubtotal(s);
    o.clientes.add(s.clienteId||s.clienteNombre||'');
  });
  const arr=Object.values(g).map(o=>({label:o.label,ctx:o.ctx,nVentas:o.nVentas,unidades:o.unidades,monto:o.monto,nClientes:o.clientes.size,ticket:o.nVentas?Math.round(o.monto/o.nVentas):0}));
  arr.sort((a,b)=>b.monto-a.monto);
  return arr;
}
function repData(){
  const [from,to]=repRange();
  const sales=DB.sales.filter(s=>s.fecha>=from && s.fecha<=to);
  const byProd={}, byCat={};
  sales.forEach(s=>s.items.forEach(i=>{
    const p=productById(i.productId);
    const k=i.productId||i.descripcion;
    const cat=p?p.modelo:'Otros';
    const lt=lineTotal(i);
    const ct=(p?p.costo:0)*i.cantidad;
    if(!byProd[k])byProd[k]={pid:i.productId,desc:i.descripcion,cat:cat,cant:0,monto:0,costo:0};
    byProd[k].cant+=i.cantidad; byProd[k].monto+=lt; byProd[k].costo+=ct;
    if(!byCat[cat])byCat[cat]={cat:cat,cant:0,monto:0,costo:0};
    byCat[cat].cant+=i.cantidad; byCat[cat].monto+=lt; byCat[cat].costo+=ct;
  }));
  const all=Object.values(byProd);
  all.forEach(r=>{r.margen=r.monto-r.costo; r.margenpct=r.monto? r.margen/r.monto*100 : 0;});
  const cats=Object.values(byCat);
  cats.forEach(c=>{c.margen=c.monto-c.costo; c.margenpct=c.monto? c.margen/c.monto*100 : 0;});
  cats.sort((a,b)=>b.monto-a.monto);
  const keyOf={cantidad:'cant', monto:'monto', costo:'costo', margen:'margen', margenpct:'margenpct'};
  const k=keyOf[REP.sort]||'cant'; const dir=REP.dir==='asc'?1:-1;
  let top=all.filter(r=> REP.cat==='todas' || r.cat===REP.cat);
  top.sort((a,b)=>(a[k]-b[k])*dir);
  const mejorMargen=all.slice().sort((a,b)=>b.margen-a.margen)[0]||null;
  const mejorPct=all.slice().sort((a,b)=>b.margenpct-a.margenpct)[0]||null;
  const peorPct=all.slice().sort((a,b)=>a.margenpct-b.margenpct)[0]||null;
  return {from,to,sales,top,cats,all,mejorMargen,mejorPct,peorPct,
    nVentas:sales.length,
    unidades:sales.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.cantidad,0),0),
    ingresos:sales.reduce((a,s)=>a+saleSubtotal(s),0),
    costos:sales.reduce((a,s)=>a+saleCost(s),0),
    margen:sales.reduce((a,s)=>a+saleSubtotal(s)-saleCost(s),0),
    envios:sales.reduce((a,s)=>a+(s.costoEnvio||0),0),
    porCobrar:sales.filter(s=>!s.pagado).reduce((a,s)=>a+saleTotal(s),0)};
}

function downloadReportePDF(){
  if(!window.jspdf||!window.jspdf.jsPDF){ alert('No se pudo generar el PDF.'); return; }
  const d=repData();
  const { jsPDF }=window.jspdf; const doc=new jsPDF();
  doc.setFillColor(35,51,42); doc.rect(0,0,210,30,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text('Viet Pottery — Reporte de ventas',14,14);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(167,189,170); doc.text('Período: '+d.from+'  a  '+d.to,14,22);
  doc.setTextColor(35,51,42); let y=42;
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('Resumen',14,y);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  y+=7; doc.text('N° de ventas: '+d.nVentas,14,y);
  y+=6; doc.text('Unidades vendidas: '+d.unidades,14,y);
  y+=6; doc.text('Ventas (productos): '+fmt(d.ingresos),14,y);
  y+=6; doc.text('Costo de productos: '+fmt(d.costos),14,y);
  y+=6; doc.text('Margen estimado: '+fmt(d.margen)+(d.ingresos?'  ('+Math.round(d.margen/d.ingresos*100)+'%)':''),14,y);
  y+=6; doc.text('Envíos cobrados: '+fmt(d.envios),14,y);
  // Resumen por categoría
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('Ventas por categoría',14,y+10);
  doc.autoTable({
    startY:y+14,
    head:[['Categoría','Unidades','Venta','Costo','Margen $','Margen %']],
    body:d.cats.map(c=>[c.cat, String(c.cant), fmt(c.monto), fmt(c.costo), fmt(c.margen), (c.monto?Math.round(c.margenpct):0)+'%']),
    styles:{fontSize:9,cellPadding:2.5,textColor:[35,51,42]},
    headStyles:{fillColor:[58,78,64],textColor:[255,255,255]},
    columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'}},
    margin:{left:14,right:14}
  });
  // Detalle por producto
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('Detalle por producto',14,doc.lastAutoTable.finalY+10);
  doc.autoTable({
    startY:doc.lastAutoTable.finalY+14,
    head:[['#','Producto','Categoría','Unid.','Venta','Costo','Margen $','Mg %']],
    body:d.all.slice().sort((a,b)=>b.monto-a.monto).map((r,ix)=>[String(ix+1), repName(r), r.cat, String(r.cant), fmt(r.monto), fmt(r.costo), fmt(r.margen), Math.round(r.margenpct)+'%']),
    styles:{fontSize:8,cellPadding:2,textColor:[35,51,42]},
    headStyles:{fillColor:[58,78,64],textColor:[255,255,255]},
    columnStyles:{0:{cellWidth:10},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right'},7:{halign:'right'}},
    margin:{left:14,right:14}
  });
  // Ventas por ubicación (región, ciudad, comuna)
  [['Ventas por región','region'],['Ventas por ciudad','ciudad'],['Ventas por comuna','comuna']].forEach(([titulo,lvl])=>{
    const g=geoAgg(d.sales,lvl);
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text(titulo,14,doc.lastAutoTable.finalY+10);
    doc.autoTable({
      startY:doc.lastAutoTable.finalY+14,
      head:[[(lvl==='region'?'Región':lvl==='ciudad'?'Ciudad':'Comuna'),'N° ventas','Clientes','Unidades','Venta','% total','Ticket']],
      body:g.map(x=>[x.label+(x.ctx?' ('+x.ctx+')':''), String(x.nVentas), String(x.nClientes), String(x.unidades), fmt(x.monto), (d.ingresos?Math.round(x.monto/d.ingresos*100):0)+'%', fmt(x.ticket)]),
      styles:{fontSize:8,cellPadding:2,textColor:[35,51,42]},
      headStyles:{fillColor:[58,78,64],textColor:[255,255,255]},
      columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right'}},
      margin:{left:14,right:14}
    });
  });
  savePdfDoc(doc, 'reporte-ventas-'+d.from+'_a_'+d.to+'.pdf');
}

function saveQuote(){
  syncSaleFromForm();
  EDIT.telefono=(document.getElementById('s_cli_tel')?.value||'').trim();
  EDIT.email=(document.getElementById('s_cli_email')?.value||'').trim();
  if(!EDIT.clienteNombre){alert('Escribe el nombre del cliente o una referencia');return;}
  if(!DB.quotes) DB.quotes=[];
  if(typeof DB.counter.pres!=='number') DB.counter.pres=0;
  if(EDIT.id){const ix=DB.quotes.findIndex(q=>q.id===EDIT.id);DB.quotes[ix]=EDIT;}
  else{ DB.counter.pres++; EDIT.numero='PRE-'+String(DB.counter.pres).padStart(4,'0'); EDIT.id=uid('q'); EDIT.estado='abierto'; DB.quotes.push(EDIT); }
  save();closeModal();go('presupuestos');
}

function downloadQuotePDF(id){
  const q=DB.quotes.find(x=>x.id===id); if(!q) return;

  const { jsPDF }=window.jspdf; const doc=new jsPDF();
  const sub=saleSubtotal(q); const envio=q.costoEnvio||0; const total=sub+envio;

    margin:{left:14,right:14}
  });
  let y=doc.lastAutoTable.finalY+10;
  doc.setFontSize(8); doc.setTextColor(150,150,150); doc.text('Valores en pesos chilenos, IVA incluido.',14,y+2);
  doc.setTextColor(35,51,42); doc.setFont('helvetica','normal'); doc.setFontSize(10);
  if(envio>0){ doc.text('Envío',150,y); doc.text(fmt(envio),196,y,{align:'right'}); y+=6; }
  doc.text('Neto',150,y); doc.text(fmt(neto),196,y,{align:'right'});
  y+=6; doc.text('IVA (19%)',150,y); doc.text(fmt(iva),196,y,{align:'right'});
  y+=7; doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(58,78,64); doc.text('Total',150,y); doc.text(fmt(total),196,y,{align:'right'}); doc.setFont('helvetica','normal'); doc.setTextColor(35,51,42);
  if(q.notas){ y+=12; doc.setFontSize(9); doc.setTextColor(90,90,90); doc.text(doc.splitTextToSize('Notas: '+q.notas,182),14,y); }
  doc.setFontSize(8); doc.setTextColor(150,150,150); doc.text('Cotización generada con la plataforma Viet Pottery · '+new Date().toLocaleDateString('es-CL'),14,288);
  savePdfDoc(doc, 'cotizacion-'+(q.numero||'viet-pottery')+'.pdf');
}

// Agrupa sin distinguir mayúsculas/minúsculas: "Lo Barnechea" = "lo barnechea". value = minúsculas, label = bonito.
function distinctCI(values){
  const map=new Map();
  values.forEach(v=>{ const t=String(v||'').trim(); if(!t) return; const k=t.toLowerCase(); if(!map.has(k)) map.set(k, titleCase(t)); });
  return [...map.entries()].map(([value,label])=>({value,label})).sort((a,b)=>a.label.localeCompare(b.label));
}

// Busca un cliente por nombre (sin distinguir mayúsculas) o lo crea automáticamente.
// Si el cliente ya existe, completa los datos que estén vacíos con lo ingresado.
function resolveClient(nombre, ciudad, comuna, direccion, telefono, email){
  const n=(nombre||'').trim(); if(!n) return null;
  let c=DB.clients.find(x=>x.nombre.toLowerCase()===n.toLowerCase());
  if(!c){
    c={id:uid('c'),nombre:n,ciudad:ciudad||'',comuna:comuna||'',direccion:direccion||'',telefono:telefono||'',email:email||''};
    DB.clients.push(c);
  } else {
    if(telefono && !c.telefono) c.telefono=telefono;
    if(email && !c.email) c.email=email;
    if(comuna && !c.comuna) c.comuna=comuna;
    if(ciudad && !c.ciudad) c.ciudad=ciudad;
  }
  return c;
}
function onSaleProd(ix,pid){const p=productById(pid);EDIT.items[ix].productId=pid;EDIT.items[ix].descripcion=productName(p);EDIT.items[ix].precio=p.precioRef;refreshSaleItems();}
function updateLineSub(ix){const el=document.getElementById('s_sub_'+ix);if(el)el.innerHTML=lineSubHtml(EDIT.items[ix]);}
function onSaleQty(ix,v){EDIT.items[ix].cantidad=Math.max(1,+v||1);updateLineSub(ix);updateSaleTotal();}
function onSalePrice(ix,v){EDIT.items[ix].precio=+v||0;updateLineSub(ix);updateSaleTotal();}
function onSaleDesc(ix,v){let d=+v||0;d=Math.max(0,Math.min(100,d));EDIT.items[ix].descuento=d;updateLineSub(ix);updateSaleTotal();}

function updateSaleTotal(){

function saveSale(){
  syncSaleFromForm();
  if(!EDIT.clienteNombre){alert('Escribe el nombre del cliente');return;}
  if(!EDIT.fechaEntrega){alert('Indica la fecha de entrega del pedido');return;}
  const esNueva=!EDIT.id;
  const tel=(document.getElementById('s_cli_tel')?.value||'').trim();
  const email=(document.getElementById('s_cli_email')?.value||'').trim();
  const cli=resolveClient(EDIT.clienteNombre, EDIT.ciudad, EDIT.comuna, EDIT.direccion, tel, email);
  EDIT.clienteId=cli.id;
  if(EDIT.id){const ix=DB.sales.findIndex(x=>x.id===EDIT.id);DB.sales[ix]=EDIT;}
  else{
    EDIT.id=uid('s');
    if(EDIT.docTipo==='boleta'&&!EDIT.docNumero){DB.counter.boleta++;EDIT.docNumero=String(DB.counter.boleta);}
    if(EDIT.docTipo==='factura'&&!EDIT.docNumero){DB.counter.factura++;EDIT.docNumero=String(DB.counter.factura);}
    DB.sales.push(EDIT);
    if(CONVERT_QUOTE_ID){ const q=(DB.quotes||[]).find(x=>x.id===CONVERT_QUOTE_ID); if(q){ q.estado='ganado'; q.ventaId=EDIT.id; } CONVERT_QUOTE_ID=null; }
  }
  const sid=EDIT.id;
  save();closeModal();go(CURRENT==='despachos'?'despachos':'ventas');
  if(esNueva) openConfirmacion(sid);
}

function copyEmitir(){
  const val=String(window.__emitirMonto||'');
  const done=()=>{const b=document.getElementById('emitir_copybtn'); if(b){const o=b.textContent;b.textContent='¡Copiado! ✓';setTimeout(()=>b.textContent=o,1500);}};
  const fallback=()=>{const t=document.createElement('textarea');t.value=val;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(t);done();};
  if(navigator.clipboard){ navigator.clipboard.writeText(val).then(done).catch(fallback); } else fallback();
}
function copyEmitirEmail(){
  const el=document.getElementById('emitir_email'); if(!el) return;

}

/* ---- Foto de entrega + comprobante de entrega ---- */
// Redimensiona y comprime la imagen para que ocupe poco espacio en la base de datos.
function compressImage(file, maxSide, quality){
  return new Promise((res,rej)=>{
    const reader=new FileReader();
    reader.onload=()=>{ const img=new Image(); img.onload=()=>{
      let w=img.width, h=img.height;
      if(w>h && w>maxSide){ h=Math.round(h*maxSide/w); w=maxSide; }
      else if(h>=w && h>maxSide){ w=Math.round(w*maxSide/h); h=maxSide; }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      try{ res(cv.toDataURL('image/jpeg',quality)); }catch(e){ rej(e); }
    }; img.onerror=rej; img.src=reader.result; };
    reader.onerror=rej; reader.readAsDataURL(file);
  });
}
function subirFotoEntrega(saleId){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  // Sin 'capture': el celular ofrece elegir entre Cámara o Galería; el computador abre el explorador de archivos.
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return;
    compressImage(f,1000,0.55).then(dataUrl=>{
      const s=DB.sales.find(x=>x.id===saleId); if(!s) return;
      s.fotoEntrega=dataUrl; s.fotoEntregaFecha=todayISO();
      if(s.estadoDespacho!=='entregado') s.estadoDespacho='entregado';
      save();
      if(CURRENT==='despachos') renderDespachos();
      openEntrega(saleId);
    }).catch(()=>alert('No se pudo procesar la imagen. Intenta con otra foto.'));
  };
  inp.click();
}

  delete s.fotoEntrega; delete s.fotoEntregaFecha; save();
  if(CURRENT==='despachos') renderDespachos();

let CAL=null; // {y, m}
function calNav(delta){ if(!CAL){const n=new Date();CAL={y:n.getFullYear(),m:n.getMonth()};} let m=CAL.m+delta, y=CAL.y; if(m<0){m=11;y--;} if(m>11){m=0;y++;} CAL={y,m}; renderCalendario(); }
function calToday(){ const n=new Date(); CAL={y:n.getFullYear(),m:n.getMonth()}; renderCalendario(); }
function generateHojaRuta(fecha, auto){
  if(!fecha){ alert('Elige un día para la hoja de ruta.'); return; }
  if(!window.jspdf||!window.jspdf.jsPDF){ alert('No se pudo generar el PDF. Verifica tu conexión.'); return; }
  let ventas=DB.sales.filter(s=>s.fechaEntrega===fecha && s.estadoDespacho!=='entregado');
  if(auto) ventas=ventas.filter(s=>s.auto===auto);
  ventas.sort((a,b)=> (a.ciudad||'').localeCompare(b.ciudad||'') || (a.comuna||'').localeCompare(b.comuna||'') );
  if(ventas.length===0){ alert('No hay entregas pendientes para el '+fecha+(auto?' en '+auto:'')+'.'); return; }
  const totalUnidades=ventas.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.cantidad,0),0);
  const comunas=[...new Set(ventas.map(s=>s.comuna||s.ciudad).filter(Boolean))];
  // Resumen de carga: total de cada producto a cargar ese día
  const resumen={};
  ventas.forEach(s=>s.items.forEach(i=>{
    const p=productById(i.productId);
    const name=p?productName(p):(i.descripcion||'(producto)');
    const key=p?p.id:name;
    if(!resumen[key]) resumen[key]={name, cant:0};
    resumen[key].cant+=i.cantidad;
  }));
  const resumenArr=Object.values(resumen).sort((a,b)=> b.cant-a.cant || a.name.localeCompare(b.name));

  const { jsPDF }=window.jspdf; const doc=new jsPDF();
  const drawBand=()=>{
    doc.setFillColor(35,51,42); doc.rect(0,0,210,26,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.text('Viet Pottery — Hoja de ruta'+(auto?' · '+auto:''),14,12);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(167,189,170);
    doc.text('Entregas del '+fecha+(auto?'   ·   '+auto:'')+'   ·   '+ventas.length+' paradas   ·   '+totalUnidades+' productos a repartir',14,20);
  };
  drawBand();

  // ---------- Sección 1: Resumen de carga ----------
  let y=35;
  doc.setTextColor(35,51,42); doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text('Resumen de carga',14,y);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(120,135,120); doc.text('Total de cada producto a cargar para esta ruta',14,y+4.5);
  doc.autoTable({
    startY:y+8,
    head:[['Producto','Cantidad']],
    body:resumenArr.map(r=>[r.name, String(r.cant)]),
    foot:[['Total de productos a repartir', String(totalUnidades)]],
    styles:{fontSize:9.5,cellPadding:3.2,textColor:[35,51,42],lineColor:[225,231,222],lineWidth:0.1},
    headStyles:{fillColor:[58,78,64],textColor:[255,255,255]},
    footStyles:{fillColor:[230,236,231],textColor:[35,51,42],fontStyle:'bold'},
    alternateRowStyles:{fillColor:[247,250,247]},
    columnStyles:{0:{fontStyle:'bold'},1:{halign:'right',cellWidth:34,fontStyle:'bold'}},
    margin:{top:30,left:14,right:14},
    didDrawPage:()=>{ drawBand(); }
  });

  // ---------- Sección 2: Detalle de la ruta ----------
  y=doc.lastAutoTable.finalY+11;
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(35,51,42); doc.text('Detalle de la ruta',14,y);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(120,135,120); doc.text('Paradas ordenadas por zona. Marca la casilla a medida que entregas.',14,y+4.5);
  doc.autoTable({
    startY:y+8,
    head:[['','Cliente','Ciudad / Comuna','Dirección','Productos','Tipo']],
    body:ventas.map(s=>{
      const c=clientById(s.clienteId);
      const nom=(c?c.nombre:(s.clienteNombre||'—'))+((c&&c.telefono)?'\n'+c.telefono:'');
      const lugar=[s.ciudad,s.comuna].filter(Boolean).join('\n')||'-';
      const prods=s.items.map(i=>i.cantidad+'x '+itemLabel(i)).join('\n');
      return ['', nom, lugar, s.direccion||'-', prods, tipoDespachoOf(s)];
    }),
    styles:{fontSize:9,cellPadding:3.2,valign:'top',lineColor:[225,231,222],lineWidth:0.1,textColor:[35,51,42]},
    headStyles:{fillColor:[58,78,64],textColor:[255,255,255],halign:'left'},
    alternateRowStyles:{fillColor:[247,250,247]},
    columnStyles:{0:{cellWidth:9,halign:'center'},1:{cellWidth:35,fontStyle:'bold'},2:{cellWidth:28},3:{cellWidth:42},5:{cellWidth:14,halign:'center'}},
    margin:{top:30,left:10,right:10},
    didDrawCell:(data)=>{ if(data.section==='body' && data.column.index===0){ doc.setDrawColor(120,120,120); doc.setLineWidth(0.3); doc.rect(data.cell.x+2.5, data.cell.y+2.5, 4.5, 4.5); } },
    didDrawPage:()=>{ drawBand(); }
  });

  let yy=doc.lastAutoTable.finalY+9;
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(35,51,42);
  doc.text('Total de productos a repartir: '+totalUnidades+'   ·   Paradas: '+ventas.length,14,yy);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(93,120,96);
  yy+=6; doc.text('Comunas en la ruta: '+(comunas.join(', ')||'-'),14,yy);
  doc.setFontSize(8); doc.setTextColor(150,150,150);
  doc.text('Hoja de ruta generada con la plataforma Viet Pottery · '+new Date().toLocaleDateString('es-CL'),14,290);
  savePdfDoc(doc, 'hoja-de-ruta-'+fecha+(auto?'-'+auto.toLowerCase().replace(/\s+/g,'-'):'')+'.pdf');
}
function cargaResumenArr(sales){
  const r={};
  sales.forEach(s=>s.items.forEach(i=>{const p=productById(i.productId);const name=p?productName(p):(i.descripcion||'producto');const key=p?p.id:name; if(!r[key])r[key]={name,cant:0}; r[key].cant+=i.cantidad;}));
  return Object.values(r).sort((a,b)=>b.cant-a.cant||a.name.localeCompare(b.name));
}
function asignarAutoEntrega(saleId, fecha, auto){
  const s=DB.sales.find(x=>x.id===saleId); if(!s) return;
  s.auto=auto||''; save();
  if(CURRENT==='despachos') renderDespachos();
  openDiaEntregas(fecha); // refresca el resumen del día agrupado
}
function asignarAutoDespacho(saleId, auto){
  const s=DB.sales.find(x=>x.id===saleId); if(!s) return;
  s.auto=auto||''; save(); renderDespachos();
}
function asignarAutoDetalle(saleId, auto, backFecha){
  const s=DB.sales.find(x=>x.id===saleId); if(!s) return;
  s.auto=auto||''; save();
  if(CURRENT==='despachos') renderDespachos();
  openSaleDetail(saleId, backFecha||''); // refresca el detalle
}
function autoSelectHTML(s, onchange){
  return `<select onclick="event.stopPropagation()" onchange="${onchange}" class="text-xs border border-clay-200 rounded-lg px-2 py-1 bg-white"><option value="" ${!s.auto?'selected':''}>Común</option>${AUTOS.map(a=>`<option value="${a}" ${s.auto===a?'selected':''}>${a}</option>`).join('')}</select>`;
}
function openDiaEntregas(fecha){
  const list=DB.sales.filter(s=>s.fechaEntrega===fecha).sort((a,b)=>(a.ciudad||'').localeCompare(b.ciudad||'')||(a.comuna||'').localeCompare(b.comuna||''));
  const estPill={pendiente:pill('Pendiente','amber'),en_camino:pill('En camino','blue'),entregado:pill('Entregado','green')};
  const totalU=list.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.cantidad,0),0);
  const pend=list.filter(s=>s.estadoDespacho==='pendiente').length;
  // ¿Se está repartiendo en más de un auto este día?
  const autosUsados=AUTOS.filter(a=>list.some(s=>s.auto===a));
  const usaAutos=autosUsados.length>0;
  // Grupos para mostrar entregas: cada auto usado + "Sin asignar"
  const grupos=[];
  autosUsados.forEach(a=>{ const sub=list.filter(s=>s.auto===a); if(sub.length) grupos.push({label:a, sales:sub}); });
  const comun=list.filter(s=>!s.auto || !AUTOS.includes(s.auto));
  if(comun.length) grupos.push({label: usaAutos?'Sin asignar':'Entregas (ordenadas por zona)', sales:comun});
  const autoSelect=(s)=>`<select onclick="event.stopPropagation()" onchange="asignarAutoEntrega('${s.id}','${fecha}',this.value)" class="text-xs border border-clay-200 rounded-lg px-2 py-1 bg-white"><option value="" ${!s.auto?'selected':''}>Común</option>${AUTOS.map(a=>`<option value="${a}" ${s.auto===a?'selected':''}>${a}</option>`).join('')}</select>`;
  const entregaCard=(s)=>{const c=clientById(s.clienteId);return `<div class="border border-clay-100 rounded-xl p-3 cursor-pointer hover:border-clay-300" onclick="openSaleDetail('${s.id}','${fecha}')">
      <div class="flex items-center justify-between gap-2"><div class="font-medium text-sm">${c?c.nombre:(s.clienteNombre||'—')}</div>${estPill[s.estadoDespacho]||''}</div>
      <div class="text-xs text-clay-500 mt-0.5">${[s.ciudad,s.comuna,s.direccion].filter(Boolean).map(titleCase).join(' · ')||'sin dirección'}</div>
      <div class="text-xs text-clay-500 mt-1">${s.items.map(i=>i.cantidad+'× '+itemLabel(i)).join(', ')}</div>
      <div class="flex items-center gap-2 mt-2"><span class="text-[11px] text-clay-400">Auto:</span>${autoSelect(s)}</div>
    </div>`;};
  const grupoUnidades=g=>g.sales.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.cantidad,0),0);
  modal(`
    <div class="p-5 border-b border-clay-100 flex items-center justify-between sticky top-0 bg-white">
      <div><h3 class="text-lg font-bold">Resumen del día · ${fecha}</h3><div class="text-xs text-clay-400">${list.length} entrega${list.length!==1?'s':''} · ${totalU} producto${totalU!==1?'s':''} a repartir${usaAutos?' · '+autosUsados.length+' auto'+(autosUsados.length!==1?'s':''):''}</div></div>
      <button onclick="closeModal()" class="text-clay-400 hover:text-clay-700 text-xl">✕</button>
    </div>
    ${list.length===0?`<div class="p-10 text-center text-clay-400 text-sm">No hay entregas programadas para este día.</div>`:`
    <div class="p-5 space-y-5">
      <div class="grid grid-cols-3 gap-3">
        <div class="bg-clay-50 rounded-xl p-3 text-center"><div class="text-xs text-clay-500">Paradas</div><div class="text-xl font-bold">${list.length}</div></div>
        <div class="bg-clay-50 rounded-xl p-3 text-center"><div class="text-xs text-clay-500">Productos</div><div class="text-xl font-bold">${totalU}</div></div>
        <div class="bg-clay-50 rounded-xl p-3 text-center"><div class="text-xs text-clay-500">Pendientes</div><div class="text-xl font-bold text-amber-600">${pend}</div></div>
      </div>
      <div>
        <div class="text-xs font-semibold text-clay-500 uppercase tracking-wide mb-2">Resumen de carga — productos a llevar</div>
        ${usaAutos?grupos.map(g=>{const arr=cargaResumenArr(g.sales);const isComun=g.label==='Sin asignar';const cls=isComun?'bg-clay-100 text-clay-700':autoCls(g.label);return `<div class="mb-3 border border-clay-100 rounded-xl overflow-hidden">
            <div class="flex items-center justify-between px-3 py-2.5 ${cls}">
              <div class="font-semibold text-sm flex items-center gap-1.5">🚗 ${g.label}</div>
              <div class="leading-none"><span class="text-2xl font-bold tabular-nums">${grupoUnidades(g)}</span> <span class="text-xs font-medium">productos</span></div>
            </div>
            <div class="divide-y divide-clay-100">
              ${arr.map(r=>`<div class="flex items-center justify-between px-3 py-2 text-sm"><span>${r.name}</span><span class="font-semibold tabular-nums">${r.cant}</span></div>`).join('')}
            </div></div>`;}).join('')+`<div class="border border-clay-200 rounded-xl px-3 py-2.5 text-sm bg-clay-50 font-bold flex items-center justify-between"><span>Total general</span><span class="tabular-nums text-base">${totalU}</span></div>`
        :`<div class="border border-clay-100 rounded-xl divide-y divide-clay-100 overflow-hidden">
          ${cargaResumenArr(list).map(r=>`<div class="flex items-center justify-between px-3 py-2 text-sm"><span>${r.name}</span><span class="font-semibold tabular-nums">${r.cant}</span></div>`).join('')}
          <div class="flex items-center justify-between px-3 py-2 text-sm bg-clay-50 font-semibold"><span>Total de productos</span><span class="tabular-nums">${totalU}</span></div>
        </div>`}
      </div>
      <div>
        <div class="text-xs font-semibold text-clay-500 uppercase tracking-wide mb-2">Entregas${usaAutos?' por auto':' (ordenadas por zona)'}</div>
        <div class="space-y-4">
          ${grupos.map(g=>`<div>${usaAutos?`<div class="text-sm font-semibold mb-2 inline-flex items-center gap-2 px-2.5 py-1 rounded-lg ${g.label==='Sin asignar'?'bg-clay-100 text-clay-700':autoCls(g.label)}">🚗 ${g.label}<span class="text-xs font-normal">· ${g.sales.length} parada${g.sales.length!==1?'s':''}</span></div>`:''}<div class="space-y-2">${g.sales.map(entregaCard).join('')}</div></div>`).join('')}
        </div>
      </div>
    </div>`}
    <div class="p-4 border-t border-clay-100 sticky bottom-0 bg-white space-y-2">
      ${list.length>0?`<div class="flex flex-wrap gap-2 justify-end">
        <button onclick="generateHojaRuta('${fecha}')" class="bg-clay-700 hover:bg-clay-800 text-white font-semibold px-4 py-2 rounded-xl text-sm flex items-center gap-1.5"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Hoja de ruta total</button>
        ${autosUsados.map(a=>`<button onclick="generateHojaRuta('${fecha}','${a}')" class="border border-clay-300 text-clay-700 hover:bg-clay-50 font-semibold px-4 py-2 rounded-xl text-sm flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full inline-block ${autoBar(a)}"></span>Ruta ${a}</button>`).join('')}
      </div>`:''}
      <div class="flex justify-end"><button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-clay-200 text-sm">Cerrar</button></div>
    </div>
  `);
}
function renderCalendario(){
  if(!CAL){ const n=new Date(); CAL={y:n.getFullYear(),m:n.getMonth()}; }
  const {y,m}=CAL;
  const monthNames=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const dow=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const first=new Date(y,m,1);
  const lead=(first.getDay()+6)%7;            // Lunes como primer día
  const dim=new Date(y,m+1,0).getDate();
  const estColor={pendiente:'bg-amber-100 text-amber-800',en_camino:'bg-blue-100 text-blue-800',entregado:'bg-sage-100 text-sage-700'};

  const byDay={}; const sinFecha=[];
  DB.sales.forEach(s=>{
    if(!s.fechaEntrega){ sinFecha.push(s); return; }
    const [yy,mm,dd]=s.fechaEntrega.split('-').map(Number);
    if(yy===y && (mm-1)===m){ (byDay[dd]=byDay[dd]||[]).push(s); }
  });
  const t=new Date(); const isToday=d=> d===t.getDate() && m===t.getMonth() && y===t.getFullYear();
  const entregasMes=Object.values(byDay).reduce((a,l)=>a+l.length,0);

  let cells='';
  for(let i=0;i<lead;i++) cells+='<div class="bg-clay-50/40 rounded-lg"></div>';
  const calChip=s=>{const c=clientById(s.clienteId);const nom=c?c.nombre:(s.clienteNombre||'—');const cl=estColor[s.estadoDespacho]||'bg-clay-100 text-clay-700';const tag=`<span class="block text-[11px] leading-tight px-1.5 py-1 rounded mb-1 truncate ${cl}" title="${nom} · ${s.items.map(i=>i.cantidad+'× '+itemLabel(i)).join(', ')}">${nom}</span>`;return `<button onclick="openSaleDetail('${s.id}')" class="block w-full text-left">${tag}</button>`;};
  for(let d=1; d<=dim; d++){
    const list=byDay[d]||[];
    const dstr=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const extra=list.length-4;
    cells+=`<div class="bg-white border ${isToday(d)?'border-clay-500 ring-1 ring-clay-300':'border-clay-100'} rounded-lg p-1.5 min-h-[96px]">
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-xs font-bold ${isToday(d)?'text-clay-700':'text-clay-500'}">${d}</span>
        ${list.length>0?`<button onclick="openDiaEntregas('${dstr}')" class="inline-flex items-center gap-1 text-[10px] font-bold bg-clay-700 hover:bg-clay-800 text-white px-2 py-0.5 rounded-full" title="Ver resumen del día">${list.length} ${list.length===1?'entrega':'entregas'}</button>`:''}
      </div>
      ${list.slice(0,4).map(calChip).join('')}
      ${extra>0?`<button onclick="openDiaEntregas('${dstr}')" class="block w-full text-left text-[11px] font-semibold text-clay-600 hover:text-clay-900 px-1.5 py-1 rounded hover:bg-clay-100">+${extra} más</button>`:''}
    </div>`;
  }
  const trail=(7-((lead+dim)%7))%7;
  for(let i=0;i<trail;i++) cells+='<div class="bg-clay-50/40 rounded-lg"></div>';

  const v=document.getElementById('view');
  v.innerHTML=`
  <div class="card p-4 mb-4 flex flex-wrap items-center gap-2">
    <div class="flex items-center gap-2"><span class="text-base">🚚</span><span class="text-sm font-semibold">Hoja de ruta del día</span></div>
    <input type="date" id="rutaFecha" value="${todayISO()}" class="border border-clay-200 rounded-lg px-3 py-1.5 text-sm">
    <button onclick="generateHojaRuta(document.getElementById('rutaFecha').value)" class="bg-clay-700 hover:bg-clay-800 text-white text-sm font-semibold px-4 py-1.5 rounded-lg flex items-center gap-1.5"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Generar PDF</button>
    <span class="text-xs text-clay-400 hidden sm:inline">Imprime las entregas del día: cliente, comuna, dirección, productos y total a repartir.</span>
  </div>
  <div class="flex items-center justify-between mb-4 flex-wrap gap-3">
    <div class="flex items-center gap-2">
      <button onclick="calNav(-1)" class="w-9 h-9 rounded-lg border border-clay-200 hover:bg-clay-100">←</button>
      <div class="text-lg font-bold w-48 text-center">${monthNames[m]} ${y}</div>
      <button onclick="calNav(1)" class="w-9 h-9 rounded-lg border border-clay-200 hover:bg-clay-100">→</button>
      <button onclick="calToday()" class="px-3 h-9 rounded-lg border border-clay-200 hover:bg-clay-100 text-sm">Hoy</button>
      <span class="text-sm text-clay-500 ml-1">${entregasMes} entrega${entregasMes!==1?'s':''} este mes</span>
    </div>
    <div class="flex items-center gap-3 text-xs text-clay-500">
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-amber-200 inline-block"></span>Pendiente</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-blue-200 inline-block"></span>En camino</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-sage-200 inline-block"></span>Entregado</span>
    </div>
  </div>
  <div class="card p-3 overflow-x-auto">
    <div class="min-w-[760px]">
      <div class="grid grid-cols-7 gap-1.5 mb-1.5">${dow.map(d=>`<div class="text-xs font-semibold text-clay-500 text-center py-1">${d}</div>`).join('')}</div>
      <div class="grid grid-cols-7 gap-1.5">${cells}</div>
    </div>
  </div>
  ${sinFecha.length?`<div class="card p-4 mt-4">
    <div class="font-semibold mb-2 flex items-center gap-2">⚠️ Pedidos sin fecha de entrega ${pill(sinFecha.length,'amber')}</div>
    <div class="divide-y divide-clay-100">${sinFecha.map(s=>{const c=clientById(s.clienteId);return `<div class="flex items-center justify-between text-sm py-2 gap-2"><div class="min-w-0"><span class="font-medium">${c?c.nombre:(s.clienteNombre||'—')}</span> <span class="text-clay-400">· ${s.items.map(i=>i.cantidad+'× '+itemLabel(i)).join(', ')}</span></div>${SESSION.rol!=='bodega'?`<button onclick="openSale('${s.id}')" class="shrink-0 text-clay-600 hover:text-clay-900 text-xs font-medium">Asignar fecha →</button>`:''}</div>`;}).join('')}</div>
  </div>`:''}
  `;
}

function renderClientes(){
  const v=document.getElementById('view');
  const totalComprado=DB.sales.reduce((a,s)=>a+saleTotal(s),0);
  const ticket=DB.sales.length?Math.round(totalComprado/DB.sales.length):0;
  v.innerHTML=`
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
    ${statCard('Clientes',DB.clients.length,'','')}
    ${statCard('Ventas totales',DB.sales.length,'','')}
    ${statCard('Total comprado',fmt(totalComprado),'histórico','text-sage-600')}
    ${statCard('Ticket promedio',fmt(ticket),'por venta','')}
  </div>
  <div class="card overflow-hidden">

function stockMatch(tr){

}

/* ----- Trazabilidad: historial de movimientos de un producto ----- */
function stockMovements(productId){
  const moves=[];
  const p=productById(productId);
  if(p) moves.push({fecha:'', orden:0, tipo:'Stock inicial', detalle:'Carga base del producto', cantidad:p.stockInicial});
  DB.purchases.forEach(c=>c.items.forEach(i=>{ if(i.productId===productId) moves.push({fecha:c.fecha, orden:1, tipo:'Compra', detalle:c.proveedor||'Proveedor', cantidad:i.cantidad}); }));
  DB.sales.forEach(s=>s.items.forEach(i=>{ if(i.productId===productId){const c=clientById(s.clienteId); moves.push({fecha:s.fecha, orden:1, tipo:'Venta', detalle:(c?c.nombre:(s.clienteNombre||'Cliente')), cantidad:-i.cantidad}); }}));
  (DB.adjustments||[]).forEach(a=>{ if(a.productId===productId) moves.push({fecha:a.fecha, orden:1, tipo:'Ajuste', detalle:a.motivo||'Ajuste manual', cantidad:a.cantidad}); });
  moves.sort((a,b)=> (a.fecha||'').localeCompare(b.fecha||'') || a.orden-b.orden);
  let bal=0; moves.forEach(m=>{ bal+=m.cantidad; m.saldo=bal; });
  return moves;
}
function openTrazabilidad(productId){
  const p=productById(productId); if(!p) return;
  const moves=stockMovements(productId).reverse(); // más reciente arriba
  const st=stockOf(productId);
  const entradas=moves.filter(m=>m.cantidad>0).reduce((a,m)=>a+m.cantidad,0);
  const salidas=moves.filter(m=>m.cantidad<0).reduce((a,m)=>a+Math.abs(m.cantidad),0);
  const tcolor={'Stock inicial':'gray','Compra':'green','Venta':'blue','Ajuste':'amber'};
  modal(`
    <div class="p-5 border-b border-clay-100 flex items-center justify-between sticky top-0 bg-white">
      <div><h3 class="text-lg font-bold">${productName(p)}</h3><div class="text-xs text-clay-400">${p.sku} · Trazabilidad de inventario</div></div>

        <div class="bg-clay-50 rounded-xl p-3"><div class="text-xs text-clay-500">Stock actual</div><div class="text-xl font-bold">${st}</div></div>
        <div class="bg-clay-50 rounded-xl p-3"><div class="text-xs text-clay-500">Entradas</div><div class="text-xl font-bold text-sage-600">+${entradas}</div></div>
        <div class="bg-clay-50 rounded-xl p-3"><div class="text-xs text-clay-500">Salidas</div><div class="text-xl font-bold text-red-600">−${salidas}</div></div>
        <div class="bg-clay-50 rounded-xl p-3"><div class="text-xs text-clay-500">Valor actual</div><div class="text-xl font-bold">${fmt(st*p.costo)}</div></div>
      </div>
      <div class="overflow-x-auto border border-clay-100 rounded-xl">
        <table class="w-full text-sm min-w-[480px]">
          <thead class="bg-clay-50 text-clay-500 text-xs uppercase"><tr>
            <th class="text-left font-semibold px-4 py-2.5">Fecha</th>
            <th class="text-left font-semibold px-3 py-2.5">Movimiento</th>
            <th class="text-left font-semibold px-3 py-2.5">Detalle</th>
            <th class="text-right font-semibold px-3 py-2.5">Cantidad</th>
            <th class="text-right font-semibold px-4 py-2.5">Saldo</th>
          </tr></thead><tbody>
          ${moves.map(m=>`<tr class="border-t border-clay-100">
            <td class="px-4 py-2.5 whitespace-nowrap text-clay-500">${m.fecha||'inicial'}</td>
            <td class="px-3 py-2.5">${pill(m.tipo,tcolor[m.tipo]||'gray')}</td>
            <td class="px-3 py-2.5 text-clay-600">${m.detalle}</td>
            <td class="px-3 py-2.5 text-right font-semibold ${m.cantidad>=0?'text-sage-600':'text-red-600'}">${m.cantidad>=0?'+':'−'}${Math.abs(m.cantidad)}</td>
            <td class="px-4 py-2.5 text-right font-medium">${m.saldo}</td>
          </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
    <div class="p-5 border-t border-clay-100 flex justify-end gap-2 sticky bottom-0 bg-white">
      ${SESSION.rol!=='vendedor'?`<button onclick="openAdjust('${p.id}')" class="px-4 py-2 rounded-xl border border-clay-200 text-sm">Ajustar stock</button>`:''}
      <button onclick="closeModal()" class="bg-clay-700 text-white font-semibold px-5 py-2 rounded-xl">Cerrar</button>
    </div>
  `);
}
/* ----- Planilla de inventario imprimible (PDF) ----- */
function descargarPlanillaInventario(){
  if(!window.jspdf||!window.jspdf.jsPDF){ alert('No se pudo generar el PDF. Verifica tu conexión e inténtalo de nuevo.'); return; }
  const { jsPDF }=window.jspdf;
  const doc=new jsPDF();
  doc.autoTable({
    head:[['SKU','Producto','Stock\nsistema','Conteo\nfísico','Diferencia']],
    body:[...DB.products].sort((a,b)=>a.sku.localeCompare(b.sku)).map(p=>[p.sku, productName(p), String(stockOf(p.id)), '', '']),
    styles:{fontSize:9,cellPadding:3,minCellHeight:9,lineColor:[205,216,205],lineWidth:0.2,textColor:[35,51,42],valign:'middle'},
    headStyles:{fillColor:[58,78,64],textColor:[255,255,255],fontStyle:'bold'},
    columnStyles:{0:{cellWidth:24},2:{halign:'center',cellWidth:24},3:{cellWidth:30},4:{cellWidth:28}},
    margin:{top:32,left:14,right:14},
    didDrawPage:function(){
      doc.setFillColor(35,51,42); doc.rect(0,0,210,26,'F');
      doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.text('Viet Pottery — Toma de inventario',14,12);
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(167,189,170);
      doc.text('Fecha: ____ / ____ / ______      Responsable: ______________________',14,20);
      doc.setTextColor(255,255,255); doc.text('Pág. '+doc.internal.getNumberOfPages(),196,12,{align:'right'});
    }
  });
  savePdfDoc(doc, 'inventario-viet-pottery-'+todayISO()+'.pdf');
}

  modal(`<div class="p-5 border-b border-clay-100 flex items-center justify-between"><h3 class="text-lg font-bold">Ajuste de stock</h3><button onclick="closeModal()" class="text-clay-400 text-xl">✕</button></div>

/* ----- Pedidos a proveedor (órdenes de compra) ----- */
let EDITO=null;
function openOrder(id){
  if(!DB.orders) DB.orders=[];
  const o=id?DB.orders.find(x=>x.id===id):{id:null,numero:'',fecha:todayISO(),fechaEntrega:'',proveedor:'',items:[{productId:DB.products[0].id,cantidad:1,costo:DB.products[0].costo}],notas:'',estado:'enviado'};
  EDITO=JSON.parse(JSON.stringify(o));renderOrderModal();
}
function renderOrderModal(){
  const o=EDITO;const total=o.items.reduce((a,i)=>a+i.cantidad*i.costo,0);const neto=Math.round(total/1.19);const iva=total-neto;
  const prodOpt=sel=>DB.products.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${productName(p)}</option>`).join('');
  modal(`<div class="p-5 border-b border-clay-100 flex items-center justify-between sticky top-0 bg-white"><h3 class="text-lg font-bold">${o.id?'Pedido '+o.numero:'Nuevo pedido a proveedor'}</h3><button onclick="closeModal()" class="text-clay-400 text-xl">✕</button></div>
  <div class="p-5 space-y-4">
    <div class="grid sm:grid-cols-3 gap-3">
      <div class="sm:col-span-1"><label class="text-sm font-medium">Proveedor</label><input id="o_prov" value="${(o.proveedor||'').replace(/"/g,'&quot;')}" placeholder="Nombre del proveedor" class="w-full border border-clay-200 rounded-xl px-3 py-2 mt-1"></div>
      <div><label class="text-sm font-medium">Fecha del pedido</label><input id="o_fecha" type="date" value="${o.fecha}" class="w-full border border-clay-200 rounded-xl px-3 py-2 mt-1"></div>
      <div><label class="text-sm font-medium">Entrega estimada</label><input id="o_entrega" type="date" value="${o.fechaEntrega||''}" class="w-full border border-clay-200 rounded-xl px-3 py-2 mt-1"></div>
    </div>
    <div><div class="flex items-center justify-between mb-1"><label class="text-sm font-medium">Productos a pedir</label><button onclick="addOItem()" class="text-sm text-clay-700 font-medium">+ Agregar</button></div>
      <div class="grid grid-cols-12 gap-2 text-xs text-clay-400 px-1 mb-1"><div class="col-span-6">Producto</div><div class="col-span-2 text-center">Cantidad</div><div class="col-span-3 text-right">Costo unit.</div><div class="col-span-1"></div></div>
      <div id="o_items" class="space-y-2">${o.items.map((it,ix)=>`<div class="grid grid-cols-12 gap-2 items-center"><select onchange="onOProd(${ix},this.value)" class="col-span-6 border border-clay-200 rounded-lg px-2 py-2 text-sm">${prodOpt(it.productId)}</select><input type="number" min="1" value="${it.cantidad}" oninput="EDITO.items[${ix}].cantidad=+this.value;oTotal()" class="col-span-2 border border-clay-200 rounded-lg px-2 py-2 text-sm text-center"><input type="text" inputmode="numeric" value="${milesIn(it.costo)}" oninput="EDITO.items[${ix}].costo=moneyInput(this);oTotal()" class="col-span-3 border border-clay-200 rounded-lg px-2 py-2 text-sm text-right"><button onclick="removeOItem(${ix})" class="col-span-1 text-clay-400 hover:text-red-600">✕</button></div>`).join('')}</div>
    </div>
    <div><label class="text-sm font-medium">Notas para el proveedor</label><input id="o_notas" value="${(o.notas||'').replace(/"/g,'&quot;')}" placeholder="Condiciones, dirección de entrega, etc." class="w-full border border-clay-200 rounded-xl px-3 py-2 mt-1"></div>
  </div>
  <div class="p-5 border-t border-clay-100 flex items-center justify-between sticky bottom-0 bg-white">
    <div>${o.id&&SESSION.rol==='admin'?`<button onclick="deleteOrder('${o.id}')" class="text-red-600 text-sm">Eliminar</button>`:''}</div>
    <div class="flex items-center gap-4"><div class="text-right"><div class="text-[11px] text-clay-400">Neto <span id="o_neto">${fmt(neto)}</span> · IVA <span id="o_iva">${fmt(iva)}</span></div><div class="text-xs text-clay-400">Total con IVA</div><div id="o_total" class="text-xl font-bold">${fmt(total)}</div></div><button onclick="saveOrder(true)" class="bg-clay-700 text-white font-semibold px-5 py-2.5 rounded-xl">Guardar y generar PDF</button></div>
  </div>`);
}
function oTotal(){const t=EDITO.items.reduce((a,i)=>a+i.cantidad*i.costo,0);const neto=Math.round(t/1.19);const set=(id,val)=>{const e=document.getElementById(id);if(e)e.textContent=val;};set('o_total',fmt(t));set('o_neto',fmt(neto));set('o_iva',fmt(t-neto));}
function onOProd(ix,pid){syncO();const p=productById(pid);EDITO.items[ix].productId=pid;if(p)EDITO.items[ix].costo=p.costo;renderOrderModal();}
function addOItem(){syncO();const p=DB.products[0];EDITO.items.push({productId:p.id,cantidad:1,costo:p.costo});renderOrderModal();}
function removeOItem(ix){if(EDITO.items.length<=1)return;syncO();EDITO.items.splice(ix,1);renderOrderModal();}
function syncO(){EDITO.proveedor=val('o_prov');EDITO.fecha=val('o_fecha');EDITO.fechaEntrega=val('o_entrega');EDITO.notas=val('o_notas');}
function saveOrder(genPDF){
  syncO();
  if(!EDITO.proveedor){alert('Ingresa el proveedor');return;}
  if(!DB.orders) DB.orders=[];
  if(typeof DB.counter.oc!=='number') DB.counter.oc=0;
  if(EDITO.id){const ix=DB.orders.findIndex(o=>o.id===EDITO.id);DB.orders[ix]=EDITO;}
  else{ DB.counter.oc++; EDITO.numero='OC-'+String(DB.counter.oc).padStart(4,'0'); EDITO.id=uid('o'); DB.orders.push(EDITO); }
  const oid=EDITO.id;
  save();closeModal();go('compras');
  if(genPDF) downloadOrderPDF(oid);
}
function deleteOrder(id){if(!confirm('¿Eliminar este pedido?'))return;DB.orders=DB.orders.filter(o=>o.id!==id);save();closeModal();go('compras');}
let RECV=null;
function recibirOrder(id){
  const o=DB.orders.find(x=>x.id===id); if(!o) return;
  RECV={id:o.id, numero:o.numero, proveedor:o.proveedor,
        items:o.items.map(i=>({productId:i.productId, costo:i.costo, pedida:i.cantidad, recibida:i.cantidad}))};
  renderRecvModal();
}
function recvItemRow(it,ix){
  const p=productById(it.productId); const dif=(it.recibida||0)-it.pedida;
  return `<div class="grid grid-cols-12 gap-2 items-center">
    <div class="col-span-6 text-sm">${p?productName(p):'(producto)'}${p?` <span class="text-clay-400 text-xs">${p.sku}</span>`:''}</div>
    <div class="col-span-3 text-center text-sm text-clay-500">${it.pedida}</div>
    <div class="col-span-3"><input type="number" min="0" value="${it.recibida}" oninput="onRecvQty(${ix},this.value)" class="w-full border ${dif<0?'border-amber-400 bg-amber-50':'border-clay-200'} rounded-lg px-2 py-2 text-sm text-center"></div>
  </div>`;
}
function renderRecvModal(){
  const r=RECV;
  const totalRecibido=r.items.reduce((a,i)=>a+(i.recibida||0)*i.costo,0);
  modal(`
    <div class="p-5 border-b border-clay-100 flex items-center justify-between sticky top-0 bg-white"><div><h3 class="text-lg font-bold">Confirmar recepción · ${r.numero}</h3><div class="text-xs text-clay-400">${r.proveedor}</div></div><button onclick="closeModal()" class="text-clay-400 hover:text-clay-700 text-xl">✕</button></div>
    <div class="p-5 space-y-4">
      <div class="text-sm text-clay-600">Revisa lo que realmente llegó. Si recibiste menos (o más) de lo pedido, ajusta la cantidad. <b>Solo lo recibido se suma al stock.</b></div>
      <div class="grid grid-cols-12 gap-2 text-xs font-medium text-clay-400 px-1"><div class="col-span-6">Producto</div><div class="col-span-3 text-center">Pedido</div><div class="col-span-3 text-center">Recibido</div></div>
      <div class="space-y-2" id="recv_items">${r.items.map((it,ix)=>recvItemRow(it,ix)).join('')}</div>
      <div><label class="text-sm font-medium">Nota (opcional)</label><input id="recv_nota" placeholder="Ej: faltaron 5 unidades, llegan la próxima semana" class="w-full border border-clay-200 rounded-xl px-3 py-2 mt-1"></div>
    </div>
    <div class="p-5 border-t border-clay-100 flex items-center justify-between sticky bottom-0 bg-white">
      <div class="text-right"><div class="text-xs text-clay-400">Recibido (a costo, con IVA)</div><div id="recv_total" class="text-lg font-bold text-clay-800">${fmt(totalRecibido)}</div></div>
      <button onclick="confirmarRecepcion()" class="bg-clay-700 text-white font-semibold px-5 py-2.5 rounded-xl">Confirmar y sumar al stock</button>
    </div>`);
}
function onRecvQty(ix,v){RECV.items[ix].recibida=Math.max(0,+v||0);const el=document.getElementById('recv_total');if(el)el.textContent=fmt(RECV.items.reduce((a,i)=>a+(i.recibida||0)*i.costo,0));}
function confirmarRecepcion(){
  const r=RECV; if(!r) return;
  const items=r.items.filter(i=>(i.recibida||0)>0).map(i=>({productId:i.productId,cantidad:i.recibida,costo:i.costo}));
  if(items.length===0){ alert('No marcaste ninguna unidad como recibida.'); return; }
  const nota=(document.getElementById('recv_nota')?.value||'').trim();
  const hayDif=r.items.some(i=>(i.recibida||0)!==i.pedida);
  DB.purchases.push({id:uid('pu'),fecha:todayISO(),proveedor:r.proveedor,items,notas:'Recepción de '+r.numero+(hayDif?' (cantidades ajustadas)':'')+(nota?' · '+nota:'')});
  const o=DB.orders.find(x=>x.id===r.id);
  if(o){ o.estado='recibido'; o.recibido={fecha:todayISO(), items:r.items.map(i=>({productId:i.productId,pedida:i.pedida,recibida:i.recibida})), nota}; }
  RECV=null; save(); closeModal(); go('compras');
}
function downloadOrderPDF(id){
  const o=DB.orders.find(x=>x.id===id); if(!o) return;
  if(!window.jspdf||!window.jspdf.jsPDF){ alert('No se pudo generar el PDF. Verifica tu conexión e inténtalo de nuevo.'); return; }
  const { jsPDF }=window.jspdf;
  const doc=new jsPDF();
  const total=o.items.reduce((a,i)=>a+i.cantidad*i.costo,0);
  const unidades=o.items.reduce((a,i)=>a+i.cantidad,0);
  // Encabezado (con logo si está disponible)
  pdfHeader(doc,'ORDEN DE COMPRA',o.numero,o.fecha);
  // Datos proveedor
  doc.setTextColor(35,51,42); doc.setFontSize(10);
  doc.setFont('helvetica','bold'); doc.text('Proveedor',14,46);
  doc.setFont('helvetica','normal'); doc.text(o.proveedor||'-',14,52);
  if(o.fechaEntrega){ doc.setFont('helvetica','bold'); doc.text('Entrega estimada',130,46); doc.setFont('helvetica','normal'); doc.text(o.fechaEntrega,130,52); }
  // Tabla de items
  doc.autoTable({
    startY:60,
    head:[['SKU','Producto','Cantidad','Costo unit.','Subtotal']],
    body:o.items.map(i=>{const p=productById(i.productId);return [p?p.sku:'-', p?productName(p):'(producto)', String(i.cantidad), fmt(i.costo), fmt(i.cantidad*i.costo)];}),
    styles:{fontSize:9,cellPadding:3,lineColor:[230,236,231],textColor:[35,51,42]},
    headStyles:{fillColor:[58,78,64],textColor:[255,255,255],fontStyle:'bold'},
    alternateRowStyles:{fillColor:[244,247,244]},
    columnStyles:{2:{halign:'center'},3:{halign:'right'},4:{halign:'right'}},
    margin:{left:14,right:14}
  });
  const neto=Math.round(total/1.19); const iva=total-neto;
  let y=doc.lastAutoTable.finalY+10;
  doc.setFontSize(10); doc.setTextColor(93,120,96); doc.text('Total de unidades: '+unidades,14,y);
  doc.setFontSize(8); doc.setTextColor(150,150,150); doc.text('Valores en pesos chilenos, IVA incluido.',14,y+6);
  doc.setTextColor(35,51,42); doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text('Neto',150,y); doc.text(fmt(neto),196,y,{align:'right'});
  y+=6; doc.text('IVA (19%)',150,y); doc.text(fmt(iva),196,y,{align:'right'});
  y+=7; doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(58,78,64); doc.text('Total',150,y); doc.text(fmt(total),196,y,{align:'right'});
  doc.setFont('helvetica','normal');
  if(o.notas){ y+=12; doc.setFontSize(9); doc.setTextColor(90,90,90); doc.text(doc.splitTextToSize('Notas: '+o.notas,182),14,y); }
  // Pie
  doc.setFontSize(8); doc.setTextColor(150,150,150);
  doc.text('Orden de compra generada con la plataforma Viet Pottery · '+new Date().toLocaleDateString('es-CL'),14,288);
  savePdfDoc(doc, 'orden-compra-'+o.numero+'.pdf');
}

    <div><label class="text-sm font-medium">Notas</label><input id="pu_notas" value="${c.notas}" class="w-full border border-clay-200 rounded-xl px-3 py-2 mt-1"></div>

}
function puTotal(){document.getElementById('pu_total').textContent=fmt(EDITPU.items.reduce((a,i)=>a+i.cantidad*i.costo,0));}
function onPuProd(ix,pid){syncPu();const p=productById(pid);EDITPU.items[ix].productId=pid;if(p)EDITPU.items[ix].costo=p.costo;renderPurchaseModal();}
function addPuItem(){syncPu();const p=DB.products[0];EDITPU.items.push({productId:p.id,cantidad:1,costo:p.costo});renderPurchaseModal();}
function removePuItem(ix){if(EDITPU.items.length<=1)return;syncPu();EDITPU.items.splice(ix,1);renderPurchaseModal();}
function syncPu(){EDITPU.proveedor=val('pu_prov');EDITPU.fecha=val('pu_fecha');EDITPU.notas=val('pu_notas');}
function savePurchase(){syncPu();if(!EDITPU.proveedor){alert('Ingresa proveedor');return;}if(EDITPU.id){const ix=DB.purchases.findIndex(p=>p.id===EDITPU.id);DB.purchases[ix]=EDITPU;}else{EDITPU.id=uid('pu');DB.purchases.push(EDITPU);}save();closeModal();go('compras');}
function deletePurchase(id){if(!confirm('¿Eliminar compra?'))return;DB.purchases=DB.purchases.filter(p=>p.id!==id);save();closeModal();go('compras');}

function saveUsuario(){
  const email=document.getElementById('u_email').value.trim();
  const nombre=document.getElementById('u_nombre').value.trim();
  const rol=document.getElementById('u_rol').value;
  if(!email){alert('Ingresa el correo');return;}
  if(!DB.users) DB.users=[];
  const ix=DB.users.findIndex(x=>(x.email||'').toLowerCase()===email.toLowerCase());
  if(ix>=0) DB.users[ix]={email:DB.users[ix].email, nombre, rol};
  else DB.users.push({email, nombre, rol});
  save();closeModal();go('usuarios');
}
function deleteUsuario(email){
  if((email||'').toLowerCase()===(SESSION.email||'').toLowerCase()){alert('No puedes quitarte el acceso a ti mismo.');return;}
  if(!confirm('¿Quitar el acceso de '+email+'? (No borra su cuenta de Firebase Authentication, solo su rol aquí.)'))return;
  DB.users=(DB.users||[]).filter(x=>x.email!==email);
  save();closeModal();go('usuarios');
}

/* ---------- Respaldo a Excel (una hoja por categoría) ---------- */
function descargarRespaldoExcel(){
  if(!window.XLSX){ alert('No se pudo generar el Excel. Verifica tu conexión e inténtalo de nuevo.'); return; }
  const nombreProd=i=>{const p=productById(i.productId);return p?productName(p):(i.descripcion||'producto');};
  const itemsStr=arr=>(arr||[]).map(i=>i.cantidad+'x '+nombreProd(i)).join(' | ');
  const docPlain=s=> s.docTipo==='no_aplica'?'No aplica':s.docTipo==='pendiente'?'Pendiente':((s.docTipo==='factura'?'Factura ':'Boleta ')+(s.docNumero||''));
  const wb=XLSX.utils.book_new();
  const add=(name,rows)=>{ const data=(rows&&rows.length)?rows:[{Aviso:'Sin registros'}]; const ws=XLSX.utils.json_to_sheet(data); XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31)); };

  add('Presupuestos',(DB.quotes||[]).map(q=>({
    'N°':q.numero||'','Fecha':q.fecha||'','Válido hasta':q.fechaValidez||'','Cliente':q.clienteNombre||'','Teléfono':q.telefono||'','Email':q.email||'',
    'Estado':q.estado||'','Productos':itemsStr(q.items),'Subtotal':saleSubtotal(q),'Envío':q.costoEnvio||0,'Total':saleTotal(q),'Notas':q.notas||''
  })));

  add('Ventas',(DB.sales||[]).map(s=>{const c=clientById(s.clienteId);return {
    'Fecha':s.fecha||'','Entrega':s.fechaEntrega||'','Cliente':c?c.nombre:(s.clienteNombre||''),'Zona':zonaOf(s),'Ciudad':s.ciudad||'','Comuna':s.comuna||'','Dirección':s.direccion||'',
    'Productos':itemsStr(s.items),'Subtotal':saleSubtotal(s),'Envío':s.costoEnvio||0,'Total':saleTotal(s),
    'Pago':s.pagado?'Pagado':'Por cobrar','Cuenta':s.cuenta||'','Despacho':s.estadoDespacho||'','Tipo despacho':tipoDespachoOf(s),'Courier':s.courier||'',
    'Documento':docPlain(s),'N° doc':s.docNumero||''
  };}));

  add('Despachos',(DB.sales||[]).map(s=>{const c=clientById(s.clienteId);return {
    'Fecha entrega':s.fechaEntrega||'','Cliente':c?c.nombre:(s.clienteNombre||''),'Estado':s.estadoDespacho||'','Tipo':tipoDespachoOf(s),
    'Ciudad':s.ciudad||'','Comuna':s.comuna||'','Dirección':s.direccion||'','Courier':s.courier||'','Costo envío':s.costoEnvio||0,'Productos':itemsStr(s.items)
  };}));

  add('Calendario',(DB.sales||[]).filter(s=>s.fechaEntrega).sort((a,b)=>(a.fechaEntrega||'').localeCompare(b.fechaEntrega||'')).map(s=>{const c=clientById(s.clienteId);return {
    'Fecha entrega':s.fechaEntrega||'','Cliente':c?c.nombre:(s.clienteNombre||''),'Estado despacho':s.estadoDespacho||'','Tipo':tipoDespachoOf(s),'Ciudad':s.ciudad||'','Comuna':s.comuna||'','Productos':itemsStr(s.items),'Total':saleTotal(s)
  };}));

  add('Clientes',(DB.clients||[]).map(c=>{const cs=(DB.sales||[]).filter(s=>s.clienteId===c.id);return {
    'Nombre':c.nombre||'','Ciudad':c.ciudad||'','Comuna':c.comuna||'','Dirección':c.direccion||'','Teléfono':c.telefono||'','Email':c.email||'',
    'N° compras':cs.length,'Total comprado':cs.reduce((a,s)=>a+saleTotal(s),0),'Por cobrar':clientBalance(c.id)
  };}));

  add('Cobranzas',(DB.sales||[]).filter(s=>!s.pagado).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')).map(s=>{const c=clientById(s.clienteId);return {
    'Fecha venta':s.fecha||'','Cliente':c?c.nombre:(s.clienteNombre||''),'Días':diasDesde(s.fecha),'Monto':saleTotal(s),'Cuenta':s.cuenta||'','Documento':docPlain(s)
  };}));

  add('Stock',(DB.products||[]).map(p=>{const st=stockOf(p.id);return {
    'SKU':p.sku||'','Producto':productName(p),'Modelo':p.modelo||'','Tamaño':p.tamano||'','Color':p.color||'','Stock':st,'Mínimo':p.stockMin||0,
    'Estado':st<=0?'Agotado':st<=p.stockMin?'Bajo':'OK','Costo':p.costo||0,'Valor a costo':st*(p.costo||0)
  };}));

  add('Productos',(DB.products||[]).map(p=>({
    'SKU':p.sku||'','Modelo':p.modelo||'','Tamaño':p.tamano||'','Color':p.color||'','Costo':p.costo||0,'Precio ref':p.precioRef||0,
    'Margen %':p.precioRef?Math.round((p.precioRef-p.costo)/p.precioRef*100):0,'Stock':stockOf(p.id)
  })));

  add('Compras',(DB.purchases||[]).map(pu=>({
    'Fecha':pu.fecha||'','Proveedor':pu.proveedor||'','Productos':itemsStr(pu.items),'Total (con IVA)':(pu.items||[]).reduce((a,i)=>a+i.cantidad*i.costo,0),'Notas':pu.notas||''
  })));

  const fname='respaldo-viet-pottery-'+todayISO()+'.xlsx';
  (async()=>{
    try{
      const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
      const blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const file=new File([blob],fname,{type:blob.type});
      if(isMobileDevice() && navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:fname}); return; }
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click(); a.remove();
    }catch(e){ if(e&&e.name==='AbortError') return; try{ XLSX.writeFile(wb,fname); }catch(_){ alert('No se pudo generar el Excel en este dispositivo.'); } }
  })();
}

/* ---------- Utils UI ---------- */
function val(id){return document.getElementById(id).value;}
function modal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.remove('hidden');}
function closeModal(){document.getElementById('modal').classList.add('hidden');EDIT=EDITC=EDITP=EDITPU=null;CONVERT_QUOTE_ID=null;}
function filterTable(tid,q){q=q.toLowerCase();document.querySelectorAll(`#${tid} tbody tr`).forEach(tr=>{tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none';});}
function ventasMatch(el){
  const g=id=>document.getElementById(id);
  const q=((g('fVenta')&&g('fVenta').value)||'').toLowerCase();
  const doc=g('fDoc')?g('fDoc').value:'';
  const pago=g('fPago')?g('fPago').value:'';
  const zona=g('fZona')?g('fZona').value:'';
  const ciudad=g('fCiudad')?g('fCiudad').value:'';
  const comuna=g('fComuna')?g('fComuna').value:'';
  const desp=g('fDespacho')?g('fDespacho').value:'';
  return el.textContent.toLowerCase().includes(q)
    && (!doc||el.dataset.doc===doc)
    && (!pago||el.dataset.pago===pago)
    && (!desp||el.dataset.despacho===desp)
    && (!zona||el.dataset.zona===zona)
    && (!ciudad||el.dataset.ciudad===ciudad)
    && (!comuna||el.dataset.comuna===comuna);
}
function applyVentasView(){
  const g=id=>document.getElementById(id);
  const per=VENTAS_PER;
  // total que pasan el filtro
  let total=0; document.querySelectorAll('#vtbl tbody tr').forEach(tr=>{ if(ventasMatch(tr)) total++; });
  const pages = per===Infinity?1:Math.max(1,Math.ceil(total/per));
  if(VENTAS_PAGE>pages) VENTAS_PAGE=pages;
  if(VENTAS_PAGE<1) VENTAS_PAGE=1;
  const page=VENTAS_PAGE, start=(page-1)*per, end=(per===Infinity)?Infinity:page*per;
  const applySet=nodes=>{ let mi=0; nodes.forEach(el=>{ if(ventasMatch(el)){ el.style.display=(mi>=start&&mi<end)?'':'none'; mi++; } else el.style.display='none'; }); };
  applySet(document.querySelectorAll('#vtbl tbody tr'));
  applySet(document.querySelectorAll('#vcards .vcard'));
  const from = total===0?0:start+1;
  const to = (per===Infinity)?total:Math.min(end,total);
  if(g('vCount')) g('vCount').textContent = total+' ventas';
  if(g('vPageInfo')) g('vPageInfo').textContent = total===0?'Sin resultados':('Mostrando '+from+'–'+to+' de '+total);
  if(g('vPageLbl')) g('vPageLbl').textContent = 'Página '+page+' de '+pages;
  if(g('vPrev')) g('vPrev').disabled = page<=1;
  if(g('vNext')) g('vNext').disabled = page>=pages;
}
function filterVentas(){ VENTAS_PAGE=1; applyVentasView(); }
function setVentasPer(v){ VENTAS_PER = v==='all'?Infinity:(+v||20); VENTAS_PAGE=1; applyVentasView(); }
function ventasPrev(){ if(VENTAS_PAGE>1){ VENTAS_PAGE--; applyVentasView(); } }
function ventasNext(){ VENTAS_PAGE++; applyVentasView(); }

      <button id="pp_${id}" onclick="pagPrev('${id}')" class="px-3 py-1.5 rounded-lg border border-clay-200 text-sm hover:bg-clay-50 disabled:opacity-40">← Anterior</button>
      <span id="pl_${id}" class="text-sm text-clay-500"></span>
      <button id="pn_${id}" onclick="pagNext('${id}')" class="px-3 py-1.5 rounded-lg border border-clay-200 text-sm hover:bg-clay-50 disabled:opacity-40">Siguiente →</button>
    </div>
  </div>`;
}
function pagApply(id){
  const st=pagState(id);
  const m=PAG_MATCH[id]||(tr=>tr.textContent.toLowerCase().includes((st.q||'').toLowerCase()));
  const rows=document.querySelectorAll('#'+id+' tbody tr');
  let total=0; rows.forEach(tr=>{ if(m(tr)) total++; });
  const per=st.per, pages=per===Infinity?1:Math.max(1,Math.ceil(total/per));
  if(st.page>pages)st.page=pages; if(st.page<1)st.page=1;
  const start=(st.page-1)*per, end=per===Infinity?Infinity:st.page*per;
  let mi=0; rows.forEach(tr=>{ if(m(tr)){ tr.style.display=(mi>=start&&mi<end)?'':'none'; mi++; } else tr.style.display='none'; });
  const from=total===0?0:start+1, to=per===Infinity?total:Math.min(end,total);
  const set=(eid,t)=>{const e=document.getElementById(eid); if(e)e.textContent=t;};
  set('pi_'+id, total===0?'Sin resultados':('Mostrando '+from+'–'+to+' de '+total));
  set('pl_'+id,'Página '+st.page+' de '+pages);
  const pp=document.getElementById('pp_'+id), pn=document.getElementById('pn_'+id);
  if(pp)pp.disabled=st.page<=1; if(pn)pn.disabled=st.page>=pages;
  if(id==='sttbl'){ const e=document.getElementById('stCount'); if(e)e.textContent=total+' productos'; }
}
function pagRender(id){ const st=pagState(id); st.q=''; st.page=1; pagApply(id); }
function pagSearch(id,q){ const st=pagState(id); st.q=q||''; st.page=1; pagApply(id); }
function pagSetPer(id,v){ const st=pagState(id); st.per=v==='all'?Infinity:(+v||20); st.page=1; pagApply(id); }
function pagPrev(id){ const st=pagState(id); if(st.page>1){st.page--; pagApply(id);} }
function pagNext(id){ const st=pagState(id); st.page++; pagApply(id); }

/* ---------- Init ---------- */
// La app arranca cuando Firebase está listo: el script de módulo llama a bootFirebaseApp().
// Si Firebase ya cargó antes que este script, arrancamos de inmediato.
if(window.FB) bootFirebaseApp();
prepareLogo();
// Mostrar versión actual y avisar si hay una más nueva publicada.
(function(){
  const lbl=document.getElementById('appVerLabel'); if(lbl) lbl.textContent=APP_VERSION;
  setTimeout(()=>checkForUpdate(true), 4000);
  // Revisa cada 15 min y al volver a la app (clave en el ícono del celular).
  setInterval(()=>checkForUpdate(true), 15*60*1000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkForUpdate(true); });
})();
</script>
