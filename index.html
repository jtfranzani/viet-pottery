<script type="module">
  // ----- Firebase: autenticación y base de datos en la nube -----
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyAdDsvcGtkIUVHhX5o-VIivgKd_nnoqUws",
    authDomain: "viet-pottery.firebaseapp.com",
    projectId: "viet-pottery",
    storageBucket: "viet-pottery.firebasestorage.app",
    messagingSenderId: "451880236267",
    appId: "1:451880236267:web:51c93138c0061a46f53aae"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const DREF = doc(db, 'app', 'data');
  window.FB = {
    signIn:(e,p)=>signInWithEmailAndPassword(auth,e,p),
    signOutNow:()=>signOut(auth),
    onAuth:(cb)=>onAuthStateChanged(auth,cb),
    // Crea la cuenta (correo+clave) en una app Firebase secundaria para NO cerrar la sesión del admin.
    createAuthUser: async (email, pass)=>{
      const sApp = getApps().find(a=>a.name==='vpSecondary') || initializeApp(firebaseConfig, 'vpSecondary');
      const sAuth = getAuth(sApp);
      await createUserWithEmailAndPassword(sAuth, email, pass);
      try{ await signOut(sAuth); }catch(_){}
    },
    resetPass:(email)=>sendPasswordResetEmail(auth, email),
    getData: async ()=>{ const s=await getDoc(DREF); return s.exists()?(s.data().db||null):null; },
    setData:(obj)=>setDoc(DREF,{db:obj}),
    watch:(cb)=>onSnapshot(DREF,(s)=>{ if(s.exists()&&s.data().db) cb(s.data().db); }),
    // Archivos (PDF facturas, comprobantes): cada archivo se guarda en su propio documento
    // de la colección 'files' (base64), separado del documento principal para no recargarlo.
    saveBlob: (id, payload)=> setDoc(doc(db,'files',id), payload),
    loadBlob: async (id)=>{ const s=await getDoc(doc(db,'files',id)); return s.exists()?s.data():null; },
    deleteBlob: (id)=> deleteDoc(doc(db,'files',id))
  };
  if(window.bootFirebaseApp) window.bootFirebaseApp();
</script>

<script>
/* =========================================================
   VIET POTTERY · Plataforma de gestión
   Datos y login en la nube con Firebase (Firestore + Auth)
   ========================================================= */

// >>> Subir este número cada vez que se publica una nueva versión a GitHub <<<
const APP_VERSION = '2026.07.09-119';

const CITIES = ['Santiago','Rancagua','Talca','Otra'];
// Autos de despacho disponibles para repartir cuando un día tiene muchos pedidos.
const AUTOS = ['Auto Cami','Auto Vale','Auto 3'];
// Color distintivo de cada auto (clases de fondo/texto y de barra).
const AUTO_CLS = {'Auto Cami':'bg-blue-100 text-blue-700','Auto Vale':'bg-purple-100 text-purple-700','Auto 3':'bg-amber-100 text-amber-700'};
const AUTO_BAR = {'Auto Cami':'bg-blue-600','Auto Vale':'bg-purple-600','Auto 3':'bg-amber-500'};
const autoCls = a => AUTO_CLS[a] || 'bg-clay-100 text-clay-600';
const autoBar = a => AUTO_BAR[a] || 'bg-clay-500';
const autoBadge = a => a?`<span class="badge ${autoCls(a)}">🚗 ${a}</span>`:'';
// Mapa ciudad -> región (Chile). Permite agrupar ventas por región sin pedir el dato manualmente.
const REGION_MAP = {
  'arica':'Arica y Parinacota','iquique':'Tarapacá','alto hospicio':'Tarapacá',
  'antofagasta':'Antofagasta','calama':'Antofagasta','copiapo':'Atacama','copiapó':'Atacama',
  'la serena':'Coquimbo','coquimbo':'Coquimbo','ovalle':'Coquimbo',
  'valparaiso':'Valparaíso','valparaíso':'Valparaíso','vina del mar':'Valparaíso','viña del mar':'Valparaíso','quilpue':'Valparaíso','quilpué':'Valparaíso','villa alemana':'Valparaíso','san antonio':'Valparaíso','quillota':'Valparaíso','los andes':'Valparaíso',
  'santiago':'Metropolitana','rancagua':"O'Higgins",'san fernando':"O'Higgins",'rengo':"O'Higgins",'machali':"O'Higgins",'machalí':"O'Higgins",
  'talca':'Maule','curico':'Maule','curicó':'Maule','linares':'Maule','cauquenes':'Maule',
  'chillan':'Ñuble','chillán':'Ñuble',
  'concepcion':'Biobío','concepción':'Biobío','talcahuano':'Biobío','los angeles':'Biobío','los ángeles':'Biobío','coronel':'Biobío',
  'temuco':'Araucanía','villarrica':'Araucanía','pucon':'Araucanía','pucón':'Araucanía','angol':'Araucanía',
  'valdivia':'Los Ríos','la union':'Los Ríos','la unión':'Los Ríos',
  'osorno':'Los Lagos','puerto montt':'Los Lagos','puerto varas':'Los Lagos','castro':'Los Lagos','ancud':'Los Lagos',
  'coyhaique':'Aysén','coihaique':'Aysén',
  'punta arenas':'Magallanes','puerto natales':'Magallanes'
};
const regionOf = ciudad => { const k=String(ciudad||'').trim().toLowerCase(); return REGION_MAP[k] || (k?'Otra región':'Sin ubicación'); };
const ACCOUNTS = ['Transferencia B. Santander Viet','Transferencia B. Estado C.F','Efectivo','Link de Pago'];
const fmt = n => '$' + (Math.round(n||0)).toLocaleString('es-CL');
// Formato de miles para campos de monto (sin $): 34600 -> "34.600"
const milesIn = n => (n? Math.round(n).toLocaleString('es-CL') : '');
const milesParse = v => parseInt(String(v||'').replace(/[^\d]/g,''),10)||0;
// Reformatea el input mientras se escribe y devuelve el número.
function moneyInput(el){ const n=milesParse(el.value); el.value = n? n.toLocaleString('es-CL') : ''; return n; }
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const horaHM = ts => { if(!ts) return ''; const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
// Fecha en lenguaje natural: "Hoy", "Mañana", "Ayer", "Vie 13 jun"
function fechaAmig(iso){
  if(!iso) return '';
  const hoy=new Date(todayISO()+'T00:00:00'); const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso;
  const diff=Math.round((d-hoy)/86400000);
  const dias=['dom','lun','mar','mié','jue','vie','sáb'], mes=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  if(diff===0) return 'Hoy'; if(diff===1) return 'Mañana'; if(diff===-1) return 'Ayer';
  return dias[d.getDay()]+' '+d.getDate()+' '+mes[d.getMonth()];
}
// Flecha indicadora de margen (no depender solo del color): sano ▲ · medio ◆ · bajo ▼  (frac en 0..1)
function mgArrow(frac){ return frac>=0.5?'▲':frac>=0.35?'◆':'▼'; }
const uid = p => p + '-' + Math.random().toString(36).slice(2,8);
// ¿Es un celular o tablet? (en computador descargamos directo; solo en móvil usamos "Compartir")
const isMobileDevice = () => (navigator.maxTouchPoints>0) && (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || navigator.platform==='MacIntel');

/* ---- Actualización de la plataforma ---- */
// Recarga la página saltando la caché (clave cuando está fijada como ícono en el inicio del celular).
function actualizarPlataforma(){
  const btn=document.getElementById('btnActualizarTxt'); if(btn) btn.textContent='Actualizando…';
  const base=location.href.split('?')[0].split('#')[0];
  location.replace(base+'?v='+Date.now());
}
// Revisa si hay una versión más nueva publicada y, si la hay, avisa con un banner.
async function checkForUpdate(silent){
  try{
    const url=location.href.split('?')[0].split('#')[0]+'?check='+Date.now();
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok) return;
    const txt=await res.text();
    const m=txt.match(/APP_VERSION\s*=\s*'([^']+)'/);
    const remote=m?m[1]:null;
    if(remote && remote!==APP_VERSION){ mostrarBannerActualizacion(remote); }
    else if(!silent){ toastInfo('Ya tienes la última versión ('+APP_VERSION+').'); }
  }catch(e){ /* sin conexión: ignorar */ }
}
function mostrarBannerActualizacion(remote){
  if(document.getElementById('updBanner')) return;
  const b=document.createElement('div');
  b.id='updBanner';
  b.style.cssText='position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;max-width:92vw;';
  b.innerHTML=`<div style="background:#23332a;color:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 8px 28px rgba(0,0,0,.25);display:flex;align-items:center;gap:14px;font-size:14px;">
    <span>🔔 Hay una nueva versión disponible.</span>
    <button onclick="actualizarPlataforma()" style="background:#5f7f4d;color:#fff;font-weight:600;border:none;border-radius:9px;padding:7px 14px;cursor:pointer;">Actualizar ahora</button>
    <button onclick="document.getElementById('updBanner').remove()" style="background:transparent;color:#a7bdaa;border:none;cursor:pointer;font-size:18px;line-height:1;">✕</button>
  </div>`;
  document.body.appendChild(b);
}
function toastInfo(msg){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;background:#23332a;color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;box-shadow:0 8px 28px rgba(0,0,0,.25);';
  t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .4s'; t.style.opacity='0'; setTimeout(()=>t.remove(),400); }, 2600);
}
// Toast con botón "Deshacer" para acciones reversibles
function toastUndo(msg, onUndo){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;background:#23332a;color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;box-shadow:0 8px 28px rgba(0,0,0,.25);display:flex;align-items:center;gap:14px;';
  const span=document.createElement('span'); span.textContent=msg; t.appendChild(span);
  const btn=document.createElement('button'); btn.textContent='Deshacer'; btn.style.cssText='color:#a3c585;font-weight:600;cursor:pointer;background:none;border:none;font-size:14px;';
  let done=false;
  btn.onclick=()=>{ if(done) return; done=true; t.remove(); try{ onUndo&&onUndo(); }catch(e){} };
  t.appendChild(btn); document.body.appendChild(t);
  setTimeout(()=>{ if(done) return; t.style.transition='opacity .4s'; t.style.opacity='0'; setTimeout(()=>t.remove(),400); }, 6000);
}
// Modal de confirmación propio (reemplaza al confirm() del navegador)
function confirmModal({titulo, mensaje='', confirmar='Confirmar', danger=false, icon='', onConfirm}){
  window.__confirmCb = onConfirm;
  modal(`
    <div class="p-5">
      <div class="flex items-start gap-3">
        ${icon?`<div class="w-10 h-10 rounded-full ${danger?'bg-red-100 text-red-600':'bg-clay-100 text-clay-700'} flex items-center justify-center text-lg shrink-0">${icon}</div>`:''}

// Guarda/comparte un PDF de jsPDF. En celular usa el menú nativo "Compartir" (evita el bug del enlace blob: en iOS).
async function savePdfDoc(doc, filename){
  // Vista previa dentro de la app: se ve el PDF sin descargarlo, con botones para abrir, descargar o compartir.
  let blob;
  try{ blob = doc.output('blob'); }
  catch(e){ try{ doc.save(filename); }catch(_){ alert('No se pudo generar el PDF.'); } return; }
  if(window.__pdfUrl){ try{ URL.revokeObjectURL(window.__pdfUrl); }catch(_){} }
  window.__pdfBlob = blob;
  window.__pdfUrl = URL.createObjectURL(blob);
  window.__pdfName = filename || 'documento.pdf';
  openPdfPreview();
}
function openPdfPreview(){
  const url=window.__pdfUrl, name=window.__pdfName||'documento.pdf';
  const mobile=isMobileDevice();
  modal(`
    <div class="p-4 border-b border-clay-100 flex items-center justify-between sticky top-0 bg-white z-10">
      <div class="min-w-0"><h3 class="text-base font-bold truncate">📄 ${name}</h3><div class="text-xs text-clay-400">Vista previa</div></div>
      <button onclick="closeModal()" class="text-clay-400 hover:text-clay-700 text-xl">✕</button>
    </div>
    <div class="bg-clay-100">
      <iframe src="${url}" class="w-full" style="height:62vh;border:0;background:#fff" title="Vista previa del PDF"></iframe>
      ${mobile?`<div class="text-[11px] text-clay-500 text-center px-4 py-2">Si la vista se ve en blanco en tu celular, toca "Abrir pantalla completa".</div>`:''}
    </div>
    <div class="p-4 border-t border-clay-100 flex flex-wrap gap-2 sticky bottom-0 bg-white">
      <button onclick="window.open(window.__pdfUrl,'_blank')" class="flex-1 text-sm font-medium border border-clay-200 hover:bg-clay-50 px-3 py-2.5 rounded-xl">🔍 Abrir pantalla completa</button>
      ${mobile?`<button onclick="compartirPdf()" class="flex-1 text-sm font-medium bg-clay-700 hover:bg-clay-800 text-white px-3 py-2.5 rounded-xl">📲 Compartir / Descargar</button>`:`<button onclick="descargarPdf()" class="flex-1 text-sm font-medium bg-clay-700 hover:bg-clay-800 text-white px-3 py-2.5 rounded-xl">⬇️ Descargar</button>`}
    </div>
  `);
}
function descargarPdf(){ const a=document.createElement('a'); a.href=window.__pdfUrl; a.download=window.__pdfName||'documento.pdf'; document.body.appendChild(a); a.click(); a.remove(); }
async function compartirPdf(){
  try{
    const file=new File([window.__pdfBlob], window.__pdfName||'documento.pdf', {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  descargarPdf();
}
// Guarda/comparte una imagen (canvas). En celular usa el menú nativo "Compartir".
async function saveCanvasImage(canvas, filename){
  const dataUrl = canvas.toDataURL('image/png');
  if(isMobileDevice()){
    try{
      const blob = await (await fetch(dataUrl)).blob();
      // Nombre genérico y sin "title": así en el celular se comparte como FOTO (sin nombre de archivo visible).
      const file = new File([blob], 'imagen.png', {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file]});
        return;
      }
    }catch(e){ if(e && e.name==='AbortError') return; }
  }
  const a=document.createElement('a'); a.download=filename; a.href=dataUrl; document.body.appendChild(a); a.click(); a.remove();
}

let _saveIndT;
function setSaveState(state){
  let el=document.getElementById('saveInd');
  if(!el){ el=document.createElement('div'); el.id='saveInd'; el.style.cssText='position:fixed;bottom:14px;left:14px;z-index:55;font-size:12px;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #e6ece7;border-radius:999px;padding:5px 11px;box-shadow:0 4px 14px rgba(35,51,42,.12);opacity:0;transition:opacity .3s;pointer-events:none'; document.body.appendChild(el); }
  clearTimeout(_saveIndT);
  if(state==='saving'){ el.innerHTML='<span style="width:12px;height:12px;border:2px solid #cdd8ce;border-top-color:#5d7860;border-radius:50%;display:inline-block;animation:spin .7s linear infinite"></span><span style="color:#5d7860">Guardando…</span>'; el.style.opacity='1'; }
  else if(state==='saved'){ el.innerHTML='<span style="color:#4d7a4a">●</span><span style="color:#4d7a4a">Guardado</span>'; el.style.opacity='1'; _saveIndT=setTimeout(()=>{el.style.opacity='0';},1800); }
  else if(state==='error'){ el.innerHTML='<span style="color:#dc2626">⚠</span><span style="color:#dc2626">No se pudo guardar</span>'; el.style.opacity='1'; _saveIndT=setTimeout(()=>{el.style.opacity='0';},4000); }
}

  if(!DB.cuentas || !DB.cuentas.length) DB.cuentas=seedCuentas();

  if(!DB.transfers) DB.transfers=[];   // Transferencias central → Casa Augusta
  if(!DB.caReturns) DB.caReturns=[];   // Devoluciones que reingresan a Casa Augusta
  if(!DB.prospectos) DB.prospectos=[]; // Prospectos de clientes (interesados en Casa Augusta)
  // Migración: distinguir el ORIGEN de la venta (dónde se generó) de la BODEGA (de dónde sale el stock).
  // Una venta es de Casa Augusta SOLO si se generó en ese punto (tipoDespacho==='CA'),
  // no por el solo hecho de descontar stock de Casa Augusta. Las ventas de Pedidos que usan
  // stock de Casa Augusta quedan en Ventas>Pedidos (origen distinto de 'CA').
  { let migo=false;
    (DB.sales||[]).forEach(s=>{ if(typeof s.origen==='undefined'){ s.origen=(s.tipoDespacho==='CA')?'CA':''; migo=true; } });
    if(migo) save();
  }
  migrarCuentas();
  if(cargarGastosJunio() && window.FB){ try{ await FB.setData(DB); }catch(e){ console.error('carga gastos junio', e); } }
  if(!DB.counter) DB.counter={boleta:0,factura:0,oc:0,pres:0};
  if(typeof DB.counter.oc!=='number') DB.counter.oc=0;
  if(typeof DB.counter.pres!=='number') DB.counter.pres=0;
  if(typeof DB.counter.pedido!=='number') DB.counter.pedido=0;
  // El N° de pedido ahora es manual y opcional (se escribe a mano, p. ej. para currier).
  // Limpieza única: borra los N° de pedido que se habían asignado automáticamente (PED-0001…),
  // para que el campo quede vacío y cada quien anote el número que quiera.
  if(!DB.migPedidoManual){
    let migp=false;
    (DB.sales||[]).forEach(s=>{ if(typeof s.pedidoNum==='string' && /^PED-\d+$/.test(s.pedidoNum)){ s.pedidoNum=''; migp=true; } });
    DB.migPedidoManual=true;
    if(migp||true) save();
  }
  // Migración: mover fotos de entrega antiguas (guardadas dentro del documento principal) a documentos aparte,
  // para liberar espacio y evitar que se supere el límite de tamaño de la base.
  if(window.FB && FB.saveBlob){
    let migr=false;
    for(const s of (DB.sales||[])){
      if(s.fotoEntrega && !s.fotoEntregaId){
        try{
          const fileId=uid('foto');
          await FB.saveBlob(fileId, {data:s.fotoEntrega, name:'entrega.jpg', mime:'image/jpeg', ts:Date.now()});
          s.fotoEntregaId=fileId; delete s.fotoEntrega; migr=true;
        }catch(e){ /* si falla, se deja como estaba */ }
      }
    }
    if(migr){ try{ await FB.setData(DB); }catch(e){ console.error('migración fotos', e); } }
  }
  // Migración: asignar el código de proveedor (SKU proveedor) a cada producto según su SKU interno.
  if(PROV_SKU && DB.products){
    let migp=false;
    DB.products.forEach(p=>{ if(!p.skuProveedor && PROV_SKU[p.sku]){ p.skuProveedor=PROV_SKU[p.sku]; migp=true; } });
    if(migp){ save(); }
  }
}

/* ---------- Helpers de negocio ---------- */
const productById = id => DB.products.find(p=>p.id===id);
const clientById = id => DB.clients.find(c=>c.id===id);
// ===== Renombre de modelos =====
// El nombre ANTIGUO se conserva SIEMPRE en p.modelo (se usa para el proveedor: OC y facturas).
// El nombre NUEVO se calcula al vuelo y es el que ve el cliente. Internamente mostramos "Nuevo (Antiguo)".
const MODELO_RENAME = [
  ['Rustic Round','Vietnam'],
  ['European bowl','Lotus'],
  ['Essential','Hanoi'],
  ['Elipse','Nara'],
  ['Cask','Angkor'],
  ['Bios','Bali'],
  ['Garland','Pagoda'],
  ['Flute','Imperial'],
  ['Firenze','Yunnan'],
  ['Harmony','Ubud']
];
function modeloNuevo(m){ m=m||''; for(const [ant,nue] of MODELO_RENAME){ if(m===ant) return nue; if(m.startsWith(ant+' ')) return nue+m.slice(ant.length); } return m; }
// Solo el nombre de modelo para columnas que ya separan tamaño/color: "Nuevo (Antiguo)" si cambió
function modeloShow(m){ const nue=modeloNuevo(m); return nue!==m?`${nue} (${m})`:nue; }
const _pnBase = (p, modelo) => `${modelo} ${p.tamano!=='Único'?p.tamano:''} ${p.color!=='Natural'?'· '+p.color:''}`.replace(/\s+/g,' ').trim();
// Interno (por defecto): nombre nuevo y, entre paréntesis, el antiguo (solo si cambió)
function productName(p){ const nue=modeloNuevo(p.modelo); const base=_pnBase(p,nue); return nue!==p.modelo?`${base} (${p.modelo})`:base; }
// Cliente: SOLO el nombre nuevo
const productNameCliente = p => _pnBase(p, modeloNuevo(p.modelo));
// Proveedor (OC / facturas): SOLO el nombre antiguo original
const productNameProveedor = p => _pnBase(p, p.modelo);
const lineTotal = i => i.cantidad*i.precio*(1-(i.descuento||0)/100);
const saleSubtotal = s => s.items.reduce((a,i)=>a+lineTotal(i),0);   // solo productos (con descuentos)
const saleTotal = s => saleSubtotal(s) + (s.costoEnvio||0);          // total que paga el cliente: productos + envío
const saleCost  = s => s.items.reduce((a,i)=>{const p=productById(i.productId);return a+(p?p.costo:0)*i.cantidad;},0);
// Nombre limpio de un item: usa el catálogo y, si no, limpia la descripción (quita "xN" duplicado).
const _cleanDesc = i => String(i.descripcion||'').replace(/\s*x\s*\d+\s*$/i,'').trim();
const itemLabel = i => { const p=productById(i.productId); return p?productName(p):_cleanDesc(i); };            // interno: Nuevo (Antiguo)
const itemLabelCliente = i => { const p=productById(i.productId); return p?productNameCliente(p):_cleanDesc(i); }; // cliente: solo Nuevo
const itemLabelProveedor = i => { const p=productById(i.productId); return p?productNameProveedor(p):_cleanDesc(i); };// proveedor: solo Antiguo
// Lista de productos de una venta en líneas alineadas (cantidad × nombre).
const saleItemsHtml = s => s.items.map(i=>`<div class="flex items-baseline gap-1.5 whitespace-nowrap"><span class="text-clay-400 tabular-nums font-medium">${i.cantidad}×</span><span>${itemLabel(i)}</span></div>`).join('');

// Stock de la bodega CENTRAL. Las ventas de Casa Augusta (bodega:'CA') NO restan aquí:
// salen del stock de Casa Augusta. Las transferencias central→CA sí restan del central.
function stockOf(productId){
  const p = productById(productId); if(!p) return 0;
  let s = p.stockInicial;
  DB.sales.forEach(v=>{ if(v.perdido||v.bodega==='CA') return; v.items.forEach(i=>{ if(i.productId===productId) s-=i.cantidad; }); });
  // Las compras/recepciones asignadas a Casa Augusta (item.bodega==='CA') NO suman al central.
  DB.purchases.forEach(c=>c.items.forEach(i=>{ if(i.productId===productId && i.bodega!=='CA') s+=i.cantidad; }));
  DB.adjustments.forEach(a=>{ if(a.productId===productId) s+=a.cantidad; });
  // Transferencias: central→CA restan del central; CA→central (sentido 'aCentral') suman al central.
  (DB.transfers||[]).forEach(t=>{ if(t.estado==='anulada') return; const dir=(t.sentido==='aCentral')?1:-1; (t.items||[]).forEach(i=>{ if(i.productId===productId) s+=dir*i.cantidad; }); });
  return s;
}
// Stock de la bodega CASA AUGUSTA (Santiago). Entra por transferencias desde central
// y por devoluciones; sale por las ventas registradas en Casa Augusta.
function stockCA(productId){
  let s = 0;
  // Transferencias: central→CA suman a Casa Augusta; CA→central (sentido 'aCentral') restan de Casa Augusta.
  (DB.transfers||[]).forEach(t=>{ if(t.estado==='anulada') return; const dir=(t.sentido==='aCentral')?-1:1; (t.items||[]).forEach(i=>{ if(i.productId===productId) s+=dir*i.cantidad; }); });
  // Recepciones/compras asignadas directamente a Casa Augusta al recibir la OC.
  DB.purchases.forEach(c=>(c.items||[]).forEach(i=>{ if(i.productId===productId && i.bodega==='CA') s+=i.cantidad; }));
  DB.sales.forEach(v=>{ if(v.bodega!=='CA'||v.perdido) return; v.items.forEach(i=>{ if(i.productId===productId) s-=i.cantidad; }); });
  (DB.caReturns||[]).forEach(r=>{ (r.items||[]).forEach(i=>{ if(i.productId===productId) s+=i.cantidad; }); });
  // Ajustes manuales de inventario en Casa Augusta (conteo, merma, regalo, etc.).
  (DB.adjustmentsCA||[]).forEach(a=>{ if(a.productId===productId) s+=a.cantidad; });
  return s;
}
function clientBalance(clientId){
  return DB.sales.filter(s=>s.clienteId===clientId && !s.pagado && !s.perdido).reduce((a,s)=>a+saleTotal(s),0);
}

/* ---------- Permisos por módulo ----------
   Cada usuario puede tener u.mods = [ids de módulos que puede ver].
   - Si el rol es 'admin' => ve TODO siempre (súper usuario, no se puede limitar).
   - Si tiene u.mods definido => se usa esa lista exacta (permisos por checkbox).
   - Si NO tiene u.mods (usuarios antiguos) => se derivan de su rol para no romper nada. */
const ALL_MODS = NAV.map(n=>n.id);
function defaultModsForRole(rol){ if(rol==='admin') return ALL_MODS.slice(); return NAV.filter(n=>n.roles.includes(rol)).map(n=>n.id); }
function userMods(u){ if(!u) return []; if(u.rol==='admin') return ALL_MODS.slice(); if(Array.isArray(u.mods)) return u.mods.slice(); return defaultModsForRole(u.rol); }
function canView(navId){ if(!SESSION) return false; if(navId==='usuarios') return SESSION.rol==='admin'; if(SESSION.rol==='admin') return true; return (SESSION.mods||[]).includes(navId); }
function landingView(){ if(canView('dashboard')) return 'dashboard'; if(canView('ca_stock')) return 'ca_stock'; const first=NAV.find(n=>canView(n.id)); return first?first.id:'dashboard'; }
function emailNombre(email){ const p=(email||'').split('@')[0].replace(/[._-]+/g,' ').trim(); return p.replace(/\b\w/g,c=>c.toUpperCase())||'Usuario'; }
function showLogin(){ document.getElementById('app').classList.add('hidden'); document.getElementById('loginScreen').classList.remove('hidden'); }
function showApp(){ document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); buildNav(); renderUserBox(); go(landingView()); }
// Mantiene los permisos de la sesión al día si el admin los cambia mientras la persona está conectada.
function refreshSessionPerms(){ if(!SESSION) return; const u=(DB.users||[]).find(x=>(x.email||'').toLowerCase()===(SESSION.email||'').toLowerCase()); if(!u){ FB.signOutNow(); return; } const rebuilt={email:u.email,nombre:u.nombre,rol:u.rol,mods:userMods(u)}; const changed=rebuilt.rol!==SESSION.rol||JSON.stringify(rebuilt.mods)!==JSON.stringify(SESSION.mods); SESSION=rebuilt; if(changed){ buildNav(); renderUserBox(); if(!canView(CURRENT)) go(landingView()); } }
function isModalOpen(){ const m=document.getElementById('modal'); return m && !m.classList.contains('hidden'); }
function rerender(){ if(SESSION && !isModalOpen()) go(CURRENT); }

// Arranca cuando Firebase está listo (lo llama el script de módulo).
function bootFirebaseApp(){
  if(window.__vpBooted) return; window.__vpBooted=true;
  FB.onAuth(async (user)=>{
    if(!user){ SESSION=null; showLogin(); return; }
    try{ await bootData(); }
    catch(e){ console.error(e); alert('No se pudieron cargar los datos. Revisa tu conexión e intenta de nuevo.'); showLogin(); return; }
    const email=(user.email||'').toLowerCase();
    let u=(DB.users||[]).find(x=>(x.email||'').toLowerCase()===email);
    if(!u){
      if(!DB.users || DB.users.length===0){ u={email:user.email, nombre:emailNombre(user.email), rol:'admin'}; DB.users.push(u); save(); }
      else { alert('Tu usuario ('+user.email+') aún no tiene permisos en la plataforma. Pídele al administrador que te agregue en el módulo Usuarios.'); FB.signOutNow(); showLogin(); return; }
    }
    SESSION={email:u.email, nombre:u.nombre, rol:u.rol, mods:userMods(u)};
    FB.watch((data)=>{ DB=data; if(!DB.orders)DB.orders=[]; if(!DB.users)DB.users=[]; if(!DB.quotes)DB.quotes=[]; if(!DB.invoices)DB.invoices=[]; if(!DB.suppliers)DB.suppliers=[]; if(!DB.metaUnidades)DB.metaUnidades={}; if(!DB.tasks)DB.tasks=[]; if(!DB.campaigns)DB.campaigns=[]; if(!DB.cuentas||!DB.cuentas.length)DB.cuentas=seedCuentas(); if(!DB.egresos)DB.egresos=[]; if(!DB.transfers)DB.transfers=[]; if(!DB.caReturns)DB.caReturns=[]; migrarCuentas(); refreshSessionPerms(); rerender(); });
    showApp();
  });
}
function doLogin(){

}

/* ---------- Logo (carga logo.png, recorta y le quita el fondo blanco en el navegador) ---------- */
let LOGO_DATAURL=null, LOGO_W=0, LOGO_H=0;
function prepareLogo(){
  const img=new Image(); img.crossOrigin='anonymous';
  img.onload=function(){
    try{
      const cv=document.createElement('canvas'); cv.width=img.naturalWidth; cv.height=img.naturalHeight;
      const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0);
      const id=ctx.getImageData(0,0,cv.width,cv.height); const d=id.data;
      let minX=cv.width,minY=cv.height,maxX=0,maxY=0,found=false;
      for(let i=0;i<d.length;i+=4){
        const wmin=Math.min(d[i],d[i+1],d[i+2]);
        let a; if(wmin>=245)a=0; else if(wmin<=225)a=255; else a=Math.round((245-wmin)/20*255);
        d[i+3]=a;
        if(a>20){ found=true; const idx=i/4, px=idx%cv.width, py=(idx/cv.width)|0; if(px<minX)minX=px; if(px>maxX)maxX=px; if(py<minY)minY=py; if(py>maxY)maxY=py; }
      }
      ctx.putImageData(id,0,0);
      let sx=0,sy=0,sw=cv.width,sh=cv.height;
      if(found){ const pad=Math.round(Math.max(cv.width,cv.height)*0.02); sx=Math.max(0,minX-pad); sy=Math.max(0,minY-pad); sw=Math.min(cv.width-sx,maxX-minX+1+2*pad); sh=Math.min(cv.height-sy,maxY-minY+1+2*pad); }
      const out=document.createElement('canvas'); out.width=sw; out.height=sh;
      out.getContext('2d').drawImage(cv,sx,sy,sw,sh,0,0,sw,sh);
      LOGO_DATAURL=out.toDataURL('image/png'); LOGO_W=sw; LOGO_H=sh;
    }catch(e){ LOGO_DATAURL=img.src; LOGO_W=img.naturalWidth; LOGO_H=img.naturalHeight; }
    applyLogo();
  };
  img.onerror=function(){ /* sin logo.png: se mantiene el diseño con "VP" */ };
  img.src='logo.png?v=1';
}

/* ===== Etiqueta de despacho (para pegar en el macetero) — Pedidos y Casa Augusta ===== */
// Genera UNA etiqueta por hoja (A4), en blanco y negro, con la dirección y los productos ordenados.
function generarEtiquetaDespacho(id){
  if(!window.jspdf||!window.jspdf.jsPDF){ alert('No se pudo generar el PDF.'); return; }
  const s=DB.sales.find(x=>x.id===id); if(!s) return;
  const c=clientById(s.clienteId);
  const nombre=c?c.nombre:(s.clienteNombre||'Cliente');
  const tel=(c&&c.telefono)||s.clienteTel||'';
  const direccion=(s.direccion||'').trim();
  const comuna=titleCase((s.comuna||'').trim());
  const ciudad=titleCase((s.ciudad||'').trim());
  const esCA=s.origen==='CA';
  // Normaliza el modo de entrega para ambos canales (Pedidos y Casa Augusta)
  let modo, courier='', tracking='';
  if(esCA){
    if(s.caMetodo==='currier'){ modo='ENVÍO POR CURRIER'; courier=(s.caCurrier||s.courier||'').trim(); tracking=(s.caSeguimiento||s.seguimiento||'').trim(); }
    else { modo='RETIRO EN TIENDA'; }
  } else {
    const tp=tipoDespachoOf(s);
    if(tp==='Currier'){ modo='ENVÍO POR CURRIER'; courier=(s.courier||'').trim(); tracking=(s.seguimiento||'').trim(); }
    else if(tp==='Retiro'){ modo='RETIRO EN TIENDA'; }
    else { modo='DESPACHO A DOMICILIO'; }
  }
  const ref=s.pedidoNum?('Pedido '+s.pedidoNum):(s.docNumero?((s.docTipo==='factura'?'Factura ':'Boleta ')+s.docNumero):('N° '+String(s.id).slice(-6).toUpperCase()));
  const unidades=s.items.reduce((a,i)=>a+(i.cantidad||0),0);

  const { jsPDF }=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
  const x=25, cw=160, p=9, xL=x+p, xR=x+cw-p, top=22;
  let y=top+p+3;

  // --- Encabezado ---
  doc.setTextColor(0,0,0);
  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.text('VIET POTTERY',xL,y);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(80,80,80);
  doc.text(ref,xR,y-3,{align:'right'});
  doc.text(s.fecha,xR,y+2,{align:'right'});
  doc.setTextColor(0,0,0);
  y+=5; doc.setDrawColor(0,0,0); doc.setLineWidth(0.4); doc.line(xL,y,xR,y);
  y+=8;

  // --- Modo de entrega (recuadro con borde negro, sin color) ---
  doc.setLineWidth(0.6); doc.roundedRect(xL,y-6,cw-2*p,11,2,2);
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text(modo,x+cw/2,y+1.5,{align:'center'});
  y+=13;

  // --- Destinatario (campo por campo, ordenado) ---
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(90,90,90); doc.text('DESTINATARIO',xL,y);
  doc.setTextColor(0,0,0); y+=6.5;
  doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.splitTextToSize(nombre,cw-2*p).forEach(ln=>{ doc.text(ln,xL,y); y+=6.5; });
  y+=1.5;
  const lblW=27;
  const row=(label,val)=>{
    if(!val) return;
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(90,90,90); doc.text(label,xL,y);
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(0,0,0);
    const lines=doc.splitTextToSize(String(val),cw-2*p-lblW);
    lines.forEach((ln,i)=>{ doc.text(ln,xL+lblW,y); if(i<lines.length-1) y+=5; });
    y+=6.2;
  };
  row('Teléfono', tel);
  if(direccion||comuna||ciudad){
    row('Dirección', direccion||'—');
    row('Comuna', comuna);
    row('Ciudad', ciudad);
  } else if(!esCA){
    doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(120,120,120); doc.text('(sin dirección registrada)',xL,y); doc.setTextColor(0,0,0); y+=6.2;
  }
  // --- Transporte (si aplica) ---
  row('Currier', courier);
  row('Seguimiento', tracking);

  // --- Contenido (lista, uno por línea, con cantidad alineada) ---
  y+=1; doc.setDrawColor(210,210,210); doc.setLineWidth(0.3); doc.line(xL,y,xR,y); y+=6;
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(90,90,90);
  doc.text('CONTENIDO ('+unidades+(unidades===1?' unidad':' unidades')+')',xL,y);
  doc.setTextColor(0,0,0); y+=6;
  const qx=xL+9;
  s.items.forEach(i=>{
    doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.text(i.cantidad+'×',qx,y,{align:'right'});
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    const lines=doc.splitTextToSize(itemLabelCliente(i),cw-2*p-14);
    lines.forEach((ln,k)=>{ doc.text(ln,qx+3.5,y); if(k<lines.length-1) y+=5; });
    y+=6;
  });
  if(s.notas){
    y+=1; doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(90,90,90);
    doc.splitTextToSize('Nota: '+s.notas,cw-2*p).slice(0,3).forEach(ln=>{ doc.text(ln,xL,y); y+=4.6; });
    doc.setTextColor(0,0,0);
  }

  // --- Aviso frágil + borde de la etiqueta ---
  y+=3; doc.setDrawColor(0,0,0); doc.setLineWidth(0.4); doc.line(xL,y,xR,y); y+=6;
  doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.text('FRÁGIL — MANIPULAR CON CUIDADO',x+cw/2,y,{align:'center'});
  const bottom=y+p-3;
  doc.setDrawColor(0,0,0); doc.setLineWidth(0.7); doc.rect(x,top,cw,bottom-top);

  const fnameCli=(nombre||'cliente').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  savePdfDoc(doc,'etiqueta-'+fnameCli+'.pdf');
}

// ---- Entrega parcial: unidades entregadas / pendientes por producto ----
function itemEntregadoQty(s,i){
  if(typeof i.entregadoQty==='number') return Math.max(0, Math.min(i.cantidad||0, i.entregadoQty));
  return s.estadoDespacho==='entregado' ? (i.cantidad||0) : 0;   // pedidos antiguos entregados = todo entregado
}
function itemPendienteQty(s,i){ return (i.cantidad||0) - itemEntregadoQty(s,i); }
function salePendientes(s){ return s.items.filter(i=>itemPendienteQty(s,i)>0); }
function saleUnidadesPendientes(s){ return s.items.reduce((a,i)=>a+itemPendienteQty(s,i),0); }
function saleTodoEntregado(s){ return s.items.every(i=>itemPendienteQty(s,i)<=0); }
function saleHayEntregaParcial(s){ const p=saleUnidadesPendientes(s); const t=s.items.reduce((a,i)=>a+(i.cantidad||0),0); return p>0 && p<t; }
function pendientesTexto(s){ return salePendientes(s).map(i=>itemPendienteQty(s,i)+'× '+itemLabel(i)).join(', '); }
function docLabel(s){
  if(s.docTipo==='no_aplica') return '<span class="text-clay-300">No aplica</span>';
  if(s.docTipo==='pendiente') return pill('Pendiente','amber');
  return `${s.docTipo==='factura'?'Factura':'Boleta'} ${s.docNumero||''}`;
}
function entregaCell(s){
  if(!s.fechaEntrega) return '<span class="text-clay-300">— sin fecha</span>';
  const entregado = s.estadoDespacho==='entregado';
  const atrasado = !entregado && s.fechaEntrega < todayISO();
  const hoy = !entregado && s.fechaEntrega === todayISO();
  return `<span class="${atrasado?'text-red-600 font-semibold':hoy?'text-amber-600 font-semibold':entregado?'text-clay-400':''}">${fechaAmig(s.fechaEntrega)}${atrasado?' ⚠️':''}</span><div class="text-[11px] text-clay-400">${s.fechaEntrega}</div>`;
}

let charts={};
function shadeHex(hex,pct){const n=parseInt(hex.slice(1),16);const f=t=>Math.max(0,Math.min(255,Math.round(pct<0?t*(1+pct):t+(255-t)*pct)));const r=f((n>>16)&255),g=f((n>>8)&255),b=f(n&255);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function drawChart(id,type,labels,data,color,horizontal){
  if(charts[id]) charts[id].destroy();
  const ctx=document.getElementById(id); if(!ctx||!window.Chart) return;
  const isDough = type==='doughnut';
  let bg;
  if(isDough){
    bg = Array.isArray(color)?color:[color];
  } else {
    // Barras con profundidad: degradado vertical + cada barra con un tono distinto del verde base
    bg = (c)=>{
      const area=c.chart.chartArea, cx=c.chart.ctx;
      const base = Array.isArray(color)?color[c.dataIndex%color.length]:color;
      if(!area) return base;
      const n=c.dataset.data.length, i=c.dataIndex;
      const t = n>1 ? i/(n-1) : 0;
      const barBase = shadeHex(base, 0.22 - t*0.40);   // primeras barras más claras, últimas más oscuras
      const grad = horizontal
        ? cx.createLinearGradient(area.left,0,area.right,0)
        : cx.createLinearGradient(0,area.bottom,0,area.top);
      grad.addColorStop(0, shadeHex(barBase,-0.08));
      grad.addColorStop(1, shadeHex(barBase, 0.24));
      return grad;
    };
  }
  charts[id]=new Chart(ctx,{type,data:{labels,datasets:[{data,backgroundColor:bg,borderRadius:isDough?0:6,borderWidth:isDough?2:0,borderColor:isDough?'#ffffff':'transparent',hoverOffset:isDough?8:0,spacing:isDough?1:0}]},
    options:{indexAxis:horizontal?'y':'x',cutout:isDough?'62%':undefined,plugins:{legend:{display:isDough,position:'bottom',labels:{boxWidth:12,font:{size:11}}}},
      scales:isDough?{}:{y:{ticks:{callback:v=>'$'+(v/1000)+'k',font:{size:10}},grid:{color:'#e6ece7'}},x:{ticks:{font:{size:10}},grid:{display:false}}}}});
}

let REP={preset:'mes', from:'', to:'', sort:'cantidad', dir:'desc', cat:'todas', geo:'region', tab:'resumen'};
function repIso(d){const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const da=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${da}`;}
function repRange(){
  const t=new Date(); t.setHours(0,0,0,0); const today=repIso(t);
  if(REP.preset==='hoy') return [today,today];
  if(REP.preset==='semana'){ const day=(t.getDay()+6)%7; const mon=new Date(t); mon.setDate(t.getDate()-day); return [repIso(mon),today]; }
  if(REP.preset==='mes') return [repIso(new Date(t.getFullYear(),t.getMonth(),1)),today];
  if(REP.preset==='anio') return [repIso(new Date(t.getFullYear(),0,1)),today];
  if(REP.preset==='personalizado') return [REP.from||today, REP.to||today];
  return ['0000-01-01','9999-12-31'];
}
function setRepPreset(p){ REP.preset=p; REP.cat='todas'; if(p==='personalizado' && (!REP.from||!REP.to)){ const t=new Date(); REP.from=repIso(new Date(t.getFullYear(),t.getMonth(),1)); REP.to=repIso(t); } renderReportes(); }
function setRepFrom(v){ REP.from=v; REP.cat='todas'; renderReportes(); }
function setRepTo(v){ REP.to=v; REP.cat='todas'; renderReportes(); }
function setRepSort(v){ if(REP.sort===v){ REP.dir=REP.dir==='asc'?'desc':'asc'; } else { REP.sort=v; REP.dir='desc'; } renderReportes(); }
function setRepCat(c){ REP.cat=c; renderReportes(); }
function setRepGeo(g){ REP.geo=g; renderReportes(); }
function setRepTab(t){ REP.tab=t; renderReportes(); }
function setMetaUnidades(monthKey){
  if(!DB.metaUnidades) DB.metaUnidades={};
  const cur=DB.metaUnidades[monthKey]||'';
  const v=prompt('Meta de unidades a vender en el mes (deja vacío para quitarla):', cur);
  if(v===null) return;
  const n=parseInt(String(v).replace(/[^\d]/g,''),10)||0;
  if(n>0) DB.metaUnidades[monthKey]=n; else delete DB.metaUnidades[monthKey];
  save(); go(CURRENT);
}
function geoAgg(sales, level){
  const g={};
  sales.forEach(s=>{
    let label, ctx='', key;
    if(level==='region'){ label=regionOf(s.ciudad); key=label.toLowerCase(); }
    else if(level==='ciudad'){ label=titleCase(s.ciudad)||'Sin ciudad'; ctx=regionOf(s.ciudad); key=label.toLowerCase(); }
    else { label=titleCase(s.comuna)||'Sin comuna'; ctx=titleCase(s.ciudad)||''; key=(label+'|'+ctx).toLowerCase(); }
    if(!g[key]) g[key]={label,ctx,nVentas:0,unidades:0,monto:0,clientes:new Set()};
    const o=g[key];
    o.nVentas++; o.unidades+=s.items.reduce((x,i)=>x+i.cantidad,0); o.monto+=saleSubtotal(s);
    o.clientes.add(s.clienteId||s.clienteNombre||'');
  });
  const arr=Object.values(g).map(o=>({label:o.label,ctx:o.ctx,nVentas:o.nVentas,unidades:o.unidades,monto:o.monto,nClientes:o.clientes.size,ticket:o.nVentas?Math.round(o.monto/o.nVentas):0}));
  arr.sort((a,b)=>b.monto-a.monto);
  return arr;
}
function repData(){
  const [from,to]=repRange();
  const sales=DB.sales.filter(s=>!s.perdido && s.fecha>=from && s.fecha<=to);
  const byProd={}, byCat={};
  sales.forEach(s=>s.items.forEach(i=>{
    const p=productById(i.productId);
    const k=i.productId||i.descripcion;
    const cat=p?modeloShow(p.modelo):'Otros';
    const lt=lineTotal(i);
    const ct=(p?p.costo:0)*i.cantidad;
    if(!byProd[k])byProd[k]={pid:i.productId,desc:i.descripcion,cat:cat,cant:0,monto:0,costo:0};
    byProd[k].cant+=i.cantidad; byProd[k].monto+=lt; byProd[k].costo+=ct;
    if(!byCat[cat])byCat[cat]={cat:cat,cant:0,monto:0,costo:0};
    byCat[cat].cant+=i.cantidad; byCat[cat].monto+=lt; byCat[cat].costo+=ct;
  }));
  const all=Object.values(byProd);
  all.forEach(r=>{r.margen=r.monto-r.costo; r.margenpct=r.monto? r.margen/r.monto*100 : 0;});
  const cats=Object.values(byCat);
  cats.forEach(c=>{c.margen=c.monto-c.costo; c.margenpct=c.monto? c.margen/c.monto*100 : 0;});
  cats.sort((a,b)=>b.monto-a.monto);
  const keyOf={cantidad:'cant', monto:'monto', costo:'costo', margen:'margen', margenpct:'margenpct'};
  const k=keyOf[REP.sort]||'cant'; const dir=REP.dir==='asc'?1:-1;
  let top=all.filter(r=> REP.cat==='todas' || r.cat===REP.cat);
  top.sort((a,b)=>(a[k]-b[k])*dir);
  const mejorMargen=all.slice().sort((a,b)=>b.margen-a.margen)[0]||null;
  const mejorPct=all.slice().sort((a,b)=>b.margenpct-a.margenpct)[0]||null;
  const peorPct=all.slice().sort((a,b)=>a.margenpct-b.margenpct)[0]||null;
  return {from,to,sales,top,cats,all,mejorMargen,mejorPct,peorPct,
    nVentas:sales.length,
    unidades:sales.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.cantidad,0),0),
    ingresos:sales.reduce((a,s)=>a+saleSubtotal(s),0),
    costos:sales.reduce((a,s)=>a+saleCost(s),0),
    margen:sales.reduce((a,s)=>a+saleSubtotal(s)-saleCost(s),0),
    envios:sales.reduce((a,s)=>a+(s.costoEnvio||0),0),
    porCobrar:sales.filter(s=>!s.pagado).reduce((a,s)=>a+saleTotal(s),0)};
}

function downloadReportePDF(){
  if(!window.jspdf||!window.jspdf.jsPDF){ alert('No se pudo generar el PDF.'); return; }
  const d=repData();
  const { jsPDF }=window.jspdf; const doc=new jsPDF();
  doc.setFillColor(74,44,35); doc.rect(0,0,210,30,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text('Viet Pottery — Reporte de ventas',14,14);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(221,176,155); doc.text('Período: '+d.from+'  a  '+d.to,14,22);
  doc.setTextColor(74,44,35); let y=42;

  y+=6; doc.text('Ventas (productos): '+fmt(d.ingresos),14,y);
  y+=6; doc.text('Costo de productos: '+fmt(d.costos),14,y);
  y+=6; doc.text('Margen estimado: '+fmt(d.margen)+(d.ingresos?'  ('+Math.round(d.margen/d.ingresos*100)+'%)':''),14,y);
  y+=6; doc.text('Envíos cobrados: '+fmt(d.envios),14,y);
  // Resumen por categoría
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('Ventas por categoría',14,y+10);
  doc.autoTable({
    startY:y+14,
    head:[['Categoría','Unidades','Venta','Costo','Margen $','Margen %']],
    body:d.cats.map(c=>[c.cat, String(c.cant), fmt(c.monto), fmt(c.costo), fmt(c.margen), (c.monto?Math.round(c.margenpct):0)+'%']),
    styles:{fontSize:9,cellPadding:2.5,textColor:[74,44,35]},
    headStyles:{fillColor:[125,72,54],textColor:[255,255,255]},
    columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'}},
    margin:{left:14,right:14}
  });
  // Detalle por producto
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('Detalle por producto',14,doc.lastAutoTable.finalY+10);
  doc.autoTable({
    startY:doc.lastAutoTable.finalY+14,
    head:[['#','Producto','Categoría','Unid.','Venta','Costo','Margen $','Mg %']],
    body:d.all.slice().sort((a,b)=>b.monto-a.monto).map((r,ix)=>[String(ix+1), repName(r), r.cat, String(r.cant), fmt(r.monto), fmt(r.costo), fmt(r.margen), Math.round(r.margenpct)+'%']),
    styles:{fontSize:8,cellPadding:2,textColor:[74,44,35]},
    headStyles:{fillColor:[125,72,54],textColor:[255,255,255]},
    columnStyles:{0:{cellWidth:10},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right'},7:{halign:'right'}},
    margin:{left:14,right:14}
  });
  // Ventas por ubicación (región, ciudad, comuna)
  [['Ventas por región','region'],['Ventas por ciudad','ciudad'],['Ventas por comuna','comuna']].forEach(([titulo,lvl])=>{
    const g=geoAgg(d.sales,lvl);
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text(titulo,14,doc.lastAutoTable.finalY+10);
    doc.autoTable({
      startY:doc.lastAutoTable.finalY+14,
      head:[[(lvl==='region'?'Región':lvl==='ciudad'?'Ciudad':'Comuna'),'N° ventas','Clientes','Unidades','Venta','% total','Ticket']],
      body:g.map(x=>[x.label+(x.ctx?' ('+x.ctx+')':''), String(x.nVentas), String(x.nClientes), String(x.unidades), fmt(x.monto), (d.ingresos?Math.round(x.monto/d.ingresos*100):0)+'%', fmt(x.ticket)]),
      styles:{fontSize:8,cellPadding:2,textColor:[74,44,35]},
      headStyles:{fillColor:[125,72,54],textColor:[255,255,255]},
      columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right'}},
      margin:{left:14,right:14}
    });
  });
  savePdfDoc(doc, 'reporte-ventas-'+d.from+'_a_'+d.to+'.pdf');
}

function saveQuote(){
  syncSaleFromForm();
  EDIT.telefono=(document.getElementById('s_cli_tel')?.value||'').trim();
  EDIT.email=(document.getElementById('s_cli_email')?.value||'').trim();
  if(!EDIT.clienteNombre){alert('Escribe el nombre del cliente o una referencia');return;}
  if(!DB.quotes) DB.quotes=[];
  if(typeof DB.counter.pres!=='number') DB.counter.pres=0;
  if(EDIT.id){const ix=DB.quotes.findIndex(q=>q.id===EDIT.id);DB.quotes[ix]=EDIT;}
  else{ DB.counter.pres++; EDIT.numero='PRE-'+String(DB.counter.pres).padStart(4,'0'); EDIT.id=uid('q'); EDIT.estado='abierto'; DB.quotes.push(EDIT); }
  save();closeModal();go('presupuestos');
}
function convertirPresupuesto(qid){
  const q=DB.quotes.find(x=>x.id===qid); if(!q) return;

  EDIT={id:null,fecha:todayISO(),fechaEntrega:'',clienteId:'',clienteNombre:q.clienteNombre||'',clienteTel:q.telefono||'',clienteEmail:q.email||'',
        items:JSON.parse(JSON.stringify(q.items)),cuenta:ACCOUNTS[0],pagado:true,docTipo:'pendiente',docNumero:'',

}
function marcarPerdido(id){const q=DB.quotes.find(x=>x.id===id);if(!q)return;confirmModal({titulo:'Marcar presupuesto como perdido',mensaje:'El presupuesto '+(q.numero||'')+' pasará a estado Perdido. Podrás reabrirlo cuando quieras.',confirmar:'Marcar perdido',icon:'🚫',onConfirm:()=>{q.estado='perdido';save();go('presupuestos');}});}
function reabrirPresupuesto(id){const q=DB.quotes.find(x=>x.id===id);if(!q)return;q.estado='abierto';save();closeModal();go('presupuestos');}
function deleteQuote(id){confirmModal({titulo:'Eliminar presupuesto',mensaje:'Esta acción no se puede deshacer.',confirmar:'Eliminar',danger:true,icon:'🗑️',onConfirm:()=>{DB.quotes=(DB.quotes||[]).filter(q=>q.id!==id);save();go('presupuestos');}});}

function downloadQuotePDF(id){
  const q=DB.quotes.find(x=>x.id===id); if(!q) return;
  if(!window.jspdf||!window.jspdf.jsPDF){ alert('No se pudo generar el PDF.'); return; }
  const { jsPDF }=window.jspdf; const doc=new jsPDF();
  const sub=saleSubtotal(q); const envio=q.costoEnvio||0; const total=sub+envio;
  const neto=Math.round(total/1.19); const iva=total-neto;
  const y0=pdfProHeader(doc,'COTIZACIÓN', q.numero||'', q.fecha||'');
  // Datos del cliente + meta
  const cli=[q.clienteNombre||'-'];
  if(q.telefono) cli.push('Tel: '+q.telefono);
  if(q.email) cli.push(q.email);
  const lugar=[q.direccion,q.comuna,q.ciudad].filter(Boolean).map(titleCase).join(', '); if(lugar) cli.push(lugar);
  const meta=[]; if(q.fecha) meta.push(['Emisión', q.fecha]); if(q.fechaValidez) meta.push(['Válido hasta', q.fechaValidez]);
  const yp=pdfProParty(doc, y0, 'Cliente', cli, meta);
  doc.autoTable({
    startY:yp+4,
    head:[['Producto','Cant.','P. unit.','Dcto','Subtotal']],
    body:q.items.map(i=>{const p=productById(i.productId); return [p?productNameCliente(p):(i.descripcion||'-'), String(i.cantidad), fmt(i.precio), (i.descuento||0)+'%', fmt(lineTotal(i))];}),
    styles:{fontSize:9.5,cellPadding:3.5,lineColor:[245,233,225],lineWidth:0.1,textColor:[74,44,35]},
    headStyles:{fillColor:[125,72,54],textColor:[255,255,255],fontStyle:'bold'},
    alternateRowStyles:{fillColor:[247,250,247]},
    columnStyles:{0:{fontStyle:'bold'},1:{halign:'center',cellWidth:18},2:{halign:'right',cellWidth:28},3:{halign:'center',cellWidth:18},4:{halign:'right',cellWidth:30}},
    margin:{left:14,right:14}
  });
  let y=doc.lastAutoTable.finalY+10;
  const rows=[]; if(envio>0) rows.push(['Envío', fmt(envio)]); rows.push(['Neto', fmt(neto)]); rows.push(['IVA (19%)', fmt(iva)]);
  doc.setFontSize(8); doc.setTextColor(150,150,150); doc.text('Valores en pesos chilenos, IVA incluido.',14,y+2);
  y=pdfProTotals(doc, y, rows, 'Total', fmt(total));
  y+=6;
  if(q.fechaValidez){ doc.setFontSize(9); doc.setTextColor(120,102,92); doc.text('Esta cotización es válida hasta el '+q.fechaValidez+'. Precios sujetos a disponibilidad de stock.',14,y); y+=6; }
  if(q.notas){ y+=2; doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(125,72,54); doc.text('Notas',14,y); doc.setFont('helvetica','normal'); doc.setTextColor(90,90,90); doc.text(doc.splitTextToSize(q.notas,182),14,y+5); }
  pdfProFooter(doc, 'Cotización · '+new Date().toLocaleDateString('es-CL'));
  savePdfDoc(doc, 'cotizacion-'+(q.numero||'viet-pottery')+'.pdf');
}

const titleCase = s => String(s||'').toLowerCase().replace(/(^|[\s/])([a-záéíóúñ])/g, (m,p,c)=>p+c.toUpperCase());

// Agrupa sin distinguir mayúsculas/minúsculas: "Lo Barnechea" = "lo barnechea". value = minúsculas, label = bonito.
function distinctCI(values){
  const map=new Map();
  values.forEach(v=>{ const t=String(v||'').trim(); if(!t) return; const k=t.toLowerCase(); if(!map.has(k)) map.set(k, titleCase(t)); });
  return [...map.entries()].map(([value,label])=>({value,label})).sort((a,b)=>a.label.localeCompare(b.label));
}

}

function lineSubHtml(it){
  const desc=it.descuento||0; const sub=lineTotal(it);
  return desc>0
    ? `<span class="text-sage-700">Subtotal línea: <span class="line-through text-clay-300">${fmt(it.cantidad*it.precio)}</span> → <b>${fmt(sub)}</b> · ${desc}% dcto</span>`
    : `<span class="text-clay-400">Subtotal línea: <b class="text-clay-600">${fmt(sub)}</b></span>`;

// Stock disponible en la bodega elegida (Requinoa central o Casa Augusta),
// SIN contar el pedido que se está editando (para no restarse a sí mismo).
function stockBaseVenta(productId){
  const esCA = !!(EDIT && EDIT.bodega==='CA');
  let base = esCA ? stockCA(productId) : stockOf(productId);
  if(EDIT&&EDIT.id){ const orig=DB.sales.find(x=>x.id===EDIT.id);
    if(orig && !orig.perdido && ((orig.bodega==='CA')===esCA))
      orig.items.forEach(i=>{ if(i.productId===productId) base+=(i.cantidad||0); });
  }
  return base;
}
// Advertencia por línea: compara lo pedido (sumando todas las líneas del mismo producto) contra el stock base.
function itemStockWarn(it){
  if(!it||!EDIT) return '';
  const base=stockBaseVenta(it.productId);
  const req=EDIT.items.filter(x=>x.productId===it.productId).reduce((a,x)=>a+(+x.cantidad||0),0);
  if(req>base) return `<div class="text-[11px] text-red-600 font-medium mt-1 flex items-start gap-1 bg-red-50 border border-red-200 rounded-lg px-2 py-1">⚠️ <span>Sin stock suficiente · disponible <b>${base}</b>, pedido <b>${req}</b> (faltan ${req-base}). Puedes generar el pedido igualmente.</span></div>`;
  return '';
}

// Busca un cliente por nombre (sin distinguir mayúsculas) o lo crea automáticamente.
// Si el cliente ya existe, completa los datos que estén vacíos con lo ingresado.
function resolveClient(nombre, ciudad, comuna, direccion, telefono, email){
  const n=(nombre||'').trim(); if(!n) return null;
  let c=DB.clients.find(x=>x.nombre.toLowerCase()===n.toLowerCase());
  if(!c){
    c={id:uid('c'),nombre:n,ciudad:ciudad||'',comuna:comuna||'',direccion:direccion||'',telefono:telefono||'',email:email||''};
    DB.clients.push(c);
  } else {
    if(telefono && !c.telefono) c.telefono=telefono;
    if(email && !c.email) c.email=email;
    if(comuna && !c.comuna) c.comuna=comuna;
    if(ciudad && !c.ciudad) c.ciudad=ciudad;
  }
  return c;
}

function saveSale(){
  syncSaleFromForm();
  if(!EDIT.clienteNombre){alert('Escribe el nombre del cliente');return;}
  if(!EDIT.fechaEntrega){alert('Indica la fecha de entrega del pedido');return;}
  // Aviso de stock insuficiente (no bloquea: permite generar igualmente).
  const faltantes=[]; const vistos={};
  (EDIT.items||[]).forEach(it=>{ if(vistos[it.productId]) return; vistos[it.productId]=true;
    const base=stockBaseVenta(it.productId);
    const req=EDIT.items.filter(x=>x.productId===it.productId).reduce((a,x)=>a+(+x.cantidad||0),0);
    if(req>base) faltantes.push({nombre:productName(productById(it.productId)),base,req,falta:req-base});
  });
  if(faltantes.length){
    const msg='⚠️ Estos productos no tienen stock suficiente:\n\n'+faltantes.map(f=>`• ${f.nombre}: disponible ${f.base}, pedido ${f.req} (faltan ${f.falta})`).join('\n')+'\n\n¿Deseas generar el pedido de todas formas?';
    if(!confirm(msg)) return;
  }
  if(EDIT.estadoDespacho==='entregado'){ if(!EDIT.entregadoAt) EDIT.entregadoAt=Date.now(); (EDIT.items||[]).forEach(i=>{ i.entregadoQty=i.cantidad; }); }
  else if(EDIT.estadoDespacho==='pendiente' && !saleHayEntregaParcial(EDIT)){ (EDIT.items||[]).forEach(i=>{ delete i.entregadoQty; }); }
  // Si la venta sale de la bodega Casa Augusta, sincroniza los campos del módulo CA
  // para que aparezca correctamente en sus vistas (stock, ventas y entregas).
  if(EDIT.bodega==='CA'){ EDIT.caEstado = EDIT.estadoDespacho==='entregado'?'entregado':'pendiente'; if(!EDIT.caMetodo) EDIT.caMetodo='currier'; }
  else { delete EDIT.caEstado; delete EDIT.caMetodo; delete EDIT.caCurrier; }
  const esNueva=!EDIT.id;
  // ¿Pasó a "entregado" recién con esta edición? -> abrir el comprobante de entrega
  const prev = EDIT.id ? DB.sales.find(x=>x.id===EDIT.id) : null;
  const reciénEntregado = EDIT.estadoDespacho==='entregado' && (!prev || prev.estadoDespacho!=='entregado');
  const tel=(document.getElementById('s_cli_tel')?.value||'').trim();
  const email=(document.getElementById('s_cli_email')?.value||'').trim();
  const cli=resolveClient(EDIT.clienteNombre, EDIT.ciudad, EDIT.comuna, EDIT.direccion, tel, email);
  EDIT.clienteId=cli.id;
  if(EDIT.id){const ix=DB.sales.findIndex(x=>x.id===EDIT.id);DB.sales[ix]=EDIT;}
  else{
    EDIT.id=uid('s');
    if(EDIT.docTipo==='boleta'&&!EDIT.docNumero){DB.counter.boleta++;EDIT.docNumero=String(DB.counter.boleta);}
    if(EDIT.docTipo==='factura'&&!EDIT.docNumero){DB.counter.factura++;EDIT.docNumero=String(DB.counter.factura);}
    DB.sales.push(EDIT);
    if(CONVERT_QUOTE_ID){ const q=(DB.quotes||[]).find(x=>x.id===CONVERT_QUOTE_ID); if(q){ q.estado='ganado'; q.ventaId=EDIT.id; } CONVERT_QUOTE_ID=null; }
  }
  const sid=EDIT.id;
  save();closeModal();go(CURRENT==='despachos'?'despachos':'ventas');
  if(esNueva) openConfirmacion(sid);
  else if(reciénEntregado) openEntrega(sid);
}
function deleteSale(id){

}

async function generarLinkPago(id){
  const s=DB.sales.find(x=>x.id===id); if(!s) return;
  const cfg=pagoConfig();
  const w=(document.getElementById('lk_worker')?.value||'').trim(); if(w){ cfg.getnetWorkerUrl=w; }
  const r=(document.getElementById('lk_return')?.value||'').trim(); if(r){ cfg.getnetReturnUrl=r; }
  if(w||r) save();
  const url=cfg.getnetWorkerUrl;
  if(!url){ alert('Primero pega la URL de tu Worker de Getnet en "Configuración".'); return; }
  const btn=document.getElementById('lk_genbtn'); if(btn){ btn.disabled=true; btn.textContent='Generando…'; }
  const c=clientById(s.clienteId);
  const total=saleTotal(s);
  const reference='VP-'+String(s.numero||s.id);
  try{
    const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      reference,
      description:'Pago pedido Viet Pottery '+reference,
      amount: total,
      currency:'CLP',
      buyer:{ name:(c?c.nombre:(s.clienteNombre||'')), email:(c&&c.email?c.email:s.clienteEmail||''), phone:(c&&c.telefono?c.telefono:''), document:(c&&c.rut?c.rut:'') },
      returnUrl: cfg.getnetReturnUrl||(location.origin+location.pathname)
    })});
    const data=await resp.json();
    if(!resp.ok || !data.processUrl){ throw new Error(data.error||data.message||('Error '+resp.status)); }
    s.linkPago=data.processUrl; s.linkPagoRequestId=data.requestId||''; s.linkPagoAt=Date.now();
    save(); toastInfo('✓ Link de pago generado'); openEmitirLink(id);
  }catch(err){
    if(btn){ btn.disabled=false; btn.textContent='⚡ Generar link automático'; }
    alert('No se pudo generar el link:\n'+err.message+'\n\nRevisa que el Worker esté desplegado y la URL sea correcta.');
  }
}

// Redimensiona y comprime la imagen para que ocupe poco espacio en la base de datos.
function compressImage(file, maxSide, quality){
  return new Promise((res,rej)=>{
    const reader=new FileReader();
    reader.onload=()=>{ const img=new Image(); img.onload=()=>{
      let w=img.width, h=img.height;
      if(w>h && w>maxSide){ h=Math.round(h*maxSide/w); w=maxSide; }
      else if(h>=w && h>maxSide){ w=Math.round(w*maxSide/h); h=maxSide; }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      try{ res(cv.toDataURL('image/jpeg',quality)); }catch(e){ rej(e); }
    }; img.onerror=rej; img.src=reader.result; };
    reader.onerror=rej; reader.readAsDataURL(file);
  });
}
function subirFotoEntrega(saleId){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  // Sin 'capture': el celular ofrece elegir entre Cámara o Galería; el computador abre el explorador de archivos.
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return;
    compressImage(f,1000,0.55).then(async dataUrl=>{
      const s=DB.sales.find(x=>x.id===saleId); if(!s) return;
      if(!window.FB||!FB.saveBlob){ alert('Se requiere conexión con la base de datos.'); return; }
      try{
        const fileId=uid('foto');
        await FB.saveBlob(fileId, {data:dataUrl, name:'entrega.jpg', mime:'image/jpeg', ts:Date.now()});
        // borra la foto anterior (blob o inline) para no dejar basura
        if(s.fotoEntregaId && FB.deleteBlob) FB.deleteBlob(s.fotoEntregaId);
        s.fotoEntregaId=fileId; delete s.fotoEntrega; // la foto ya NO va en el documento principal
        if(!s.fotoEntregaFecha) s.fotoEntregaFecha=todayISO();
        if(!s.entregadoAt) s.entregadoAt=Date.now(); // registra fecha y hora del respaldo
        save();
        if(CURRENT==='despachos') renderDespachos();
        openEntrega(saleId, dataUrl); // muestra el comprobante con la foto recién subida
      }catch(e){ alert('No se pudo guardar la foto.\n'+((e&&e.message)||'')); }
    }).catch(()=>alert('No se pudo procesar la imagen. Intenta con otra foto.'));
  };
  inp.click();
}

function openEntregaSelector(saleId, back){

  if(salePendientes(s).length===0){ openEntrega(saleId); return; } // ya está entregado completo
  const c=clientById(s.clienteId); const nombre=c?c.nombre:(s.clienteNombre||'Cliente');
  const filas=s.items.map((i,idx)=>{
    const pq=itemPendienteQty(s,i);

      return `<div class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-sage-50/60 border border-sage-100">

        <button type="button" onclick="entQtyStep(${idx},-1,${pq})" class="w-7 h-7 rounded-lg border border-clay-200 text-clay-600 hover:bg-clay-50 font-bold leading-none">−</button>
        <input id="ent_qty_${idx}" type="number" min="1" max="${pq}" value="${pq}" inputmode="numeric" onchange="entQtyClamp(${idx},${pq})" class="w-12 text-center border border-clay-200 rounded-lg py-1 text-sm tabular-nums">
        <button type="button" onclick="entQtyStep(${idx},1,${pq})" class="w-7 h-7 rounded-lg border border-clay-200 text-clay-600 hover:bg-clay-50 font-bold leading-none">+</button>
        <span class="text-[11px] text-clay-400 whitespace-nowrap">de ${pq}</span>
      </div>` : `<input id="ent_qty_${idx}" type="hidden" value="1">`;
    return `<label id="ent_row_${idx}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl border border-clay-200 hover:border-clay-300 cursor-pointer transition">

          <div class="text-sm font-medium text-clay-800 truncate">${itemLabel(i)}</div>

        </div>
        ${stepper}
      </label>`;
  }).join('');
  modal(`

function entRowToggle(idx){
  const chk=document.getElementById('ent_chk_'+idx);
  const stp=document.getElementById('ent_stp_'+idx);
  const row=document.getElementById('ent_row_'+idx);
  const on=!!(chk&&chk.checked);
  if(stp){ stp.style.opacity=on?'1':'0.35'; stp.style.pointerEvents=on?'auto':'none'; }
  if(row){ row.classList.toggle('opacity-50',!on); row.classList.toggle('bg-clay-50',!on); }
}
function entQtyStep(idx,d,max){
  const q=document.getElementById('ent_qty_'+idx); if(!q) return;
  let v=(parseInt(q.value,10)||0)+d; v=Math.max(1,Math.min(max,v)); q.value=v;
  const chk=document.getElementById('ent_chk_'+idx); if(chk&&!chk.checked){ chk.checked=true; entRowToggle(idx); }
}
function entQtyClamp(idx,max){
  const q=document.getElementById('ent_qty_'+idx); if(!q) return;
  let v=parseInt(q.value,10); if(isNaN(v)||v<1) v=1; if(v>max) v=max; q.value=v;
}
function confirmarEntregaSeleccion(saleId, back){
  const s=DB.sales.find(x=>x.id===saleId); if(!s) return;
  back=back||'';
  s.items.forEach((i,idx)=>{
    const chk=document.getElementById('ent_chk_'+idx);
    if(!chk) return; // línea ya entregada (sin checkbox) → se mantiene tal cual
    const pq=itemPendienteQty(s,i);
    const qin=document.getElementById('ent_qty_'+idx);
    const add = chk.checked ? (qin?Math.max(1,Math.min(pq,parseInt(qin.value,10)||pq)):pq) : 0;
    i.entregadoQty = itemEntregadoQty(s,i) + add;   // fija el acumulado (también deja 0 explícito si se desmarcó)
  });
  const completo = saleTodoEntregado(s);
  if(completo){
    s.estadoDespacho='entregado'; if(!s.entregadoAt) s.entregadoAt=Date.now(); if(!s.fotoEntregaFecha) s.fotoEntregaFecha=todayISO();
  } else {
    s.estadoDespacho='pendiente'; delete s.entregadoAt; s.entregaParcialAt=Date.now();
  }
  save();
  if(CURRENT==='despachos') renderDespachos(); else if(CURRENT==='calendario') renderCalendario();
  if(completo){ toastInfo('✓ Pedido entregado completo'); openEntrega(saleId); }
  else {
    const np=saleUnidadesPendientes(s);
    toastInfo('✓ Entrega parcial · '+np+' producto'+(np!==1?'s':'')+' aún pendiente'+(np!==1?'s':''));
    if(back.indexOf('dia:')===0) openDiaEntregas(back.slice(4));

          ${s.items.map(i=>{const dt=i.descuento||0;const pq=itemPendienteQty(s,i);const eq=itemEntregadoQty(s,i);const estado = pq<=0 ? `<span class="text-[11px] text-sage-600 font-medium">✓ Entregado</span>` : (eq>0 ? `<span class="text-[11px] text-amber-700 font-medium">⏳ ${pq}× pendiente${eq>0?` · ${eq}× entregado`:''}</span>` : '');const pr=productById(i.productId);const costoLinea=(pr?pr.costo:0)*i.cantidad;const ventaLinea=lineTotal(i);const unit=i.cantidad>0?Math.round(ventaLinea/i.cantidad):ventaLinea;return `<div class="flex justify-between items-baseline px-4 py-2.5 text-sm"><span><span class="text-clay-400">${i.cantidad} ×</span> ${itemLabel(i)}${dt>0?` <span class="text-sage-600 text-xs">(-${dt}%)</span>`:''}<br><span class="text-[11px] text-clay-400">${fmt(unit)} c/u${dt>0?' (con descuento)':''}</span>${estado?'<br>'+estado:''}</span><span class="text-right whitespace-nowrap"><span class="font-medium">${fmt(ventaLinea)}</span>${verMargen?`<br><span class="text-[11px] text-clay-400">costo ${fmt(costoLinea)}</span><br><span class="text-[11px] text-sage-600 font-medium">margen ${fmt(ventaLinea-costoLinea)}</span>`:''}</span></div>`;}).join('')}

// Convierte un pedido normal en una venta de Casa Augusta (aparece en ese módulo y descuenta su stock).
function moverACasaAugusta(id){
  const s=DB.sales.find(x=>x.id===id); if(!s) return;
  if(s.origen==='CA'){ toastInfo('Esta venta ya es de Casa Augusta.'); return; }
  confirmModal({titulo:'¿Mover a Casa Augusta?', mensaje:'Esta venta pasará al módulo Casa Augusta y su stock se descontará de la bodega de Casa Augusta. Podrás revertirlo cuando quieras.', confirmar:'Mover a Casa Augusta', icon:'🏠', onConfirm:()=>{
    s.origen='CA';
    s.bodega='CA';
    s.tipoDespacho='CA';
    s.ciudad=s.ciudad||'Santiago';
    if(!s.caMetodo) s.caMetodo='retiro_cliente';
    s.caEstado = s.estadoDespacho==='entregado' ? 'entregado' : 'pendiente';
    if(s.caMetodo==='currier' && !s.courier) s.courier=s.caCurrier||'Currier';
    save(); closeModal(); go('ca_ventas');
    toastInfo('✅ Venta movida a Casa Augusta.');
  }});
}
// Devuelve una venta de Casa Augusta a Ventas > Pedidos (deja de aparecer en el módulo Casa Augusta).
function moverAPedidos(id){
  const s=DB.sales.find(x=>x.id===id); if(!s) return;
  confirmModal({titulo:'¿Mover a Pedidos?', mensaje:'Esta venta dejará de aparecer en el módulo Casa Augusta y volverá a Ventas > Pedidos. Elige de qué bodega se descuenta el stock.', confirmar:'Mover a Pedidos', icon:'📦', onConfirm:()=>{
    s.origen='';
    // Mantiene el stock en Casa Augusta por defecto (usaba stock de CA); el usuario puede cambiar la bodega editando el pedido.
    s.tipoDespacho = (s.tipoDespacho==='CA') ? 'Viet' : (s.tipoDespacho||'Viet');
    delete s.caEstado; delete s.caMetodo; delete s.caCurrier; delete s.caSeguimiento;
    save(); closeModal(); go('ventas');
    toastInfo('✅ Venta movida a Pedidos.');
  }});
}

/* ===================== DESPACHOS ===================== */
const tipoDespachoOf = s => (s.tipoDespacho==='Fran'?'Fran':(s.tipoDespacho==='Currier'?'Currier':(s.tipoDespacho==='Retiro'?'Retiro':'Viet')));
let DESP_TIPO='Viet';
let DESP_COL='pendiente'; // solo afecta la vista móvil: qué columna se muestra
let DESP_SHOW={}; // columnas expandidas (ver todos)
function setDespTipo(t){ DESP_TIPO=t; renderDespachos(); }
function setDespCol(k){ DESP_COL=k; renderDespachos(); }
function toggleDespShow(key){ DESP_SHOW[key]=!DESP_SHOW[key]; renderDespachos(); }
function renderDespachos(){
  const v=document.getElementById('view');
  const cols=[['pendiente','Pendientes','amber'],['en_camino','En camino','blue'],['entregado','Entregados','green']];

  const tab=(t,label,badge)=>`<button onclick="setDespTipo('${t}')" class="px-4 py-2 rounded-xl text-sm font-medium flex items-center gap-2 ${DESP_TIPO===t?'bg-clay-700 text-white':'bg-white border border-clay-200 text-clay-600 hover:bg-clay-50'}">${label}${badge!=null?`<span class="text-xs ${DESP_TIPO===t?'bg-white/20':'bg-clay-100 text-clay-600'} px-1.5 rounded-full">${badge}</span>`:''}</button>`;
  const colTab=(key,label,color)=>{const n=sales.filter(s=>s.estadoDespacho===key).length;return `<button onclick="setDespCol('${key}')" class="flex-1 px-2 py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5 ${DESP_COL===key?'bg-clay-700 text-white':'text-clay-600'}">${label}<span class="text-[11px] ${DESP_COL===key?'bg-white/20':'bg-clay-200 text-clay-600'} px-1.5 rounded-full">${n}</span></button>`;};
  v.innerHTML=`
  <div class="flex flex-wrap gap-2 mb-4 items-center">
    ${tab('Viet','Despachos Viet',activos('Viet'))}
    ${tab('Fran','Despachos Fran',activos('Fran'))}
    ${tab('Currier','Currier',activos('Currier'))}
    ${tab('Retiro','Retiro en tienda',activos('Retiro'))}
    ${tab('Todos','Todos',null)}
    <button onclick="openModoReparto(todayISO())" class="sm:ml-auto bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-xl flex items-center gap-1.5">🚚 Modo reparto</button>
  </div>
  <div class="flex gap-1.5 mb-4 bg-clay-100/70 p-1.5 rounded-xl lg:hidden">
    ${colTab('pendiente','Pendientes','amber')}${colTab('en_camino','En camino','blue')}${colTab('entregado','Entregados','green')}
  </div>
  <div class="grid lg:grid-cols-3 gap-4">
    ${cols.map(([key,title,color])=>{
      const hoy=todayISO();
      const list=sales.filter(s=>s.estadoDespacho===key);
      if(key==='entregado'){ list.sort((a,b)=>recencyEntregado(b)-recencyEntregado(a)); }
      else { list.sort((a,b)=>{const fa=a.fechaEntrega||'9999-12-31',fb=b.fechaEntrega||'9999-12-31';return fa.localeCompare(fb)|| (a.fecha||'').localeCompare(b.fecha||'');}); }
      const atrasadosN = key!=='entregado' ? list.filter(s=>s.fechaEntrega && s.fechaEntrega<hoy).length : 0;
      const LIMIT=5; const expanded=DESP_SHOW[key]; const shown=expanded?list:list.slice(0,LIMIT);
      return `<div class="card p-4 ${DESP_COL===key?'':'hidden'} lg:block">
        <div class="flex items-center justify-between mb-3 gap-2 flex-wrap"><div class="font-semibold flex items-center gap-2">${title} ${pill(list.length,color)}${atrasadosN>0?`<span class="badge bg-red-100 text-red-700">⚠️ ${atrasadosN} atrasad${atrasadosN!==1?'os':'o'}</span>`:''}</div></div>
        <div class="space-y-2">
        ${list.length?shown.map(s=>{const c=clientById(s.clienteId);const tp=tipoDespachoOf(s);
          const atrasado = key!=='entregado' && s.fechaEntrega && s.fechaEntrega<hoy;
          const esHoy = key!=='entregado' && s.fechaEntrega===hoy;
          const diasAtr = atrasado? Math.round((new Date(hoy)-new Date(s.fechaEntrega))/86400000) : 0;
          return `<div class="border ${atrasado?'border-red-300 ring-1 ring-red-200 bg-red-50/40':'border-clay-100'} rounded-xl p-3 hover:border-clay-300 cursor-pointer" onclick="openSaleDetail('${s.id}')">
          ${atrasado?`<div class="flex items-center gap-1.5 text-[11px] font-bold text-red-700 bg-red-100 rounded-lg px-2 py-1 mb-2">⚠️ Atrasado ${diasAtr} día${diasAtr!==1?'s':''} · debía entregarse el ${s.fechaEntrega}</div>`:esHoy?`<div class="flex items-center gap-1.5 text-[11px] font-bold text-amber-700 bg-amber-100 rounded-lg px-2 py-1 mb-2">📦 Entrega programada para hoy</div>`:''}
          <div class="flex justify-between items-start gap-2"><div class="font-medium text-sm">${c?c.nombre:'—'}</div><div class="text-xs ${atrasado?'text-red-600 font-semibold':'text-clay-400'} whitespace-nowrap text-right">${s.fechaEntrega?fechaAmig(s.fechaEntrega):s.fecha}</div></div>
          <div class="mt-1 flex flex-wrap gap-1">${pill(tp==='Currier'?'Currier':(tp==='Retiro'?'Retiro en tienda':('Despacho '+tp)), tp==='Fran'?'blue':(tp==='Currier'?'amber':(tp==='Retiro'?'clay':'green')))}${(tp==='Currier'||tp==='Retiro')?'':autoBadge(s.auto)}${tp==='Currier'&&s.seguimiento?`<span class="badge bg-clay-100 text-clay-600">📦 ${s.seguimiento}</span>`:''}</div>
          <div class="text-xs text-clay-500 mt-1.5">${tp==='Retiro'?'🏪 Retiro en tienda':([s.ciudad,s.comuna,s.direccion].filter(Boolean).join(' · ')||'<span class="text-clay-300">sin dirección</span>')}</div>
          <div class="text-xs text-clay-500 mt-1">${s.items.map(i=>`${i.cantidad}× ${itemLabel(i)}`).join(', ')}</div>
          ${saleHayEntregaParcial(s)?`<div class="text-[11px] font-semibold text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-2 py-1 mt-1.5 flex items-start gap-1">⏳<span>Entrega parcial — pendiente: ${pendientesTexto(s)}</span></div>`:''}
          ${(tp==='Currier'||tp==='Retiro')?'':`<div class="flex items-center gap-2 mt-2"><span class="text-[11px] text-clay-400">Auto:</span>${autoSelectHTML(s, `asignarAutoDespacho('${s.id}',this.value)`)}</div>`}
          ${tieneFotoEntrega(s)?`<div class="mt-2 text-[11px] text-sage-700 font-medium flex items-center gap-1">📷 Con foto de respaldo</div>`:''}
          <div class="flex items-center justify-between mt-2"><span class="text-xs ${s.courier?'':'text-clay-300'}">${s.courier||'sin courier'}</span>${key==='pendiente'?(saleHayEntregaParcial(s)?`<span class="flex items-center gap-1.5"><button onclick="event.stopPropagation();deshacerEntregaParcial('${s.id}','')" class="text-xs font-medium text-clay-600 bg-clay-100 hover:bg-clay-200 px-2 py-1 rounded-lg">↩️</button><button onclick="event.stopPropagation();openEntregaSelector('${s.id}','')" class="text-xs font-medium text-sage-700 bg-sage-100 hover:bg-sage-200 px-2 py-1 rounded-lg">Entregar resto ✓</button></span>`:`<button onclick="event.stopPropagation();advanceDispatch('${s.id}')" class="text-xs font-medium text-clay-700 bg-clay-100 hover:bg-clay-200 px-2 py-1 rounded-lg">Marcar en camino →</button>`):key==='en_camino'?`<button onclick="event.stopPropagation();openEntregaSelector('${s.id}','')" class="text-xs font-medium text-sage-700 bg-sage-100 hover:bg-sage-200 px-2 py-1 rounded-lg">Marcar entregado ✓</button>`:pill('OK','green')}</div>
          <div class="mt-2">

              : (key==='entregado'
                  ? `<button onclick="event.stopPropagation();subirFotoEntrega('${s.id}')" class="w-full text-xs font-medium text-clay-700 bg-white hover:bg-clay-50 border border-clay-200 px-2 py-1.5 rounded-lg flex items-center justify-center gap-1.5">📷 Agregar foto de entrega</button>`

          </div>
        </div>`;}).join('')+(list.length>LIMIT?`<button onclick="toggleDespShow('${key}')" class="w-full text-sm font-medium text-clay-600 hover:text-clay-900 py-2 rounded-xl border border-dashed border-clay-200 hover:bg-clay-50">${expanded?'Ver menos ▲':'+ '+(list.length-LIMIT)+' más ▼'}</button>`:''):'<div class="text-sm text-clay-400 text-center py-6">Sin despachos</div>'}
