function advanceDispatch(id){const s=DB.sales.find(x=>x.id===id);if(!s)return;const next=s.estadoDespacho==='pendiente'?'en_camino':'entregado';if(next==='entregado'){openEntregaSelector(id,'');return;}s.estadoDespacho=next;save();go('despachos');}
function goVentasPendientes(){ go('ventas'); const d=document.getElementById('fDoc'); if(d){ d.value='pendiente'; filterVentas(); } }
/* ===================== MODO REPARTO (terreno) ===================== */
let REPARTO_FECHA=null;
function openModoReparto(fecha){ REPARTO_FECHA=fecha||todayISO(); renderModoReparto(); }
function setRepartoFecha(v){ REPARTO_FECHA=v||todayISO(); renderModoReparto(); }
function repartoEnCamino(id){ const s=DB.sales.find(x=>x.id===id); if(!s) return; s.estadoDespacho='en_camino'; save(); renderModoReparto(); }
function repartoEntregar(id){ const s=DB.sales.find(x=>x.id===id); if(!s) return; s.estadoDespacho='entregado'; if(!s.entregadoAt) s.entregadoAt=Date.now(); s.items.forEach(i=>{ i.entregadoQty=i.cantidad; }); save(); renderModoReparto(); toastInfo('✓ Entregado'); }
function repartoPendiente(id){ const s=DB.sales.find(x=>x.id===id); if(!s) return; s.estadoDespacho='pendiente'; save(); renderModoReparto(); }
function repartoAvisar(id){
  const s=DB.sales.find(x=>x.id===id); if(!s) return;
  const c=clientById(s.clienteId); const nombre=c?c.nombre:(s.clienteNombre||'');
  const msg=`Hola ${nombre}! 🌿\n\n¡Tu pedido de Viet Pottery ya fue entregado! Esperamos que lo disfrutes.\n\n¡Gracias por tu compra! 🙏`;
  mostrarRecordatorio(msg, telWa(c&&c.telefono?c.telefono:''), '📲 Avisar entrega');
}
function repartoVentas(fecha){
  // Los envíos por currier son externos y los retiros en tienda no se despachan: no van en la hoja de ruta/manejo del vehículo.
  return DB.sales.filter(s=>!s.perdido && s.fechaEntrega===fecha && s.origen!=='CA' && tipoDespachoOf(s)!=='Currier' && tipoDespachoOf(s)!=='Retiro')
    .sort((a,b)=>(a.ciudad||'').localeCompare(b.ciudad||'')||(a.comuna||'').localeCompare(b.comuna||''));
}
function abrirRutaMaps(fecha){
  const dirs=repartoVentas(fecha).filter(s=>s.estadoDespacho!=='entregado').map(s=>[s.direccion,s.comuna,s.ciudad].filter(Boolean).join(', ')).filter(Boolean);
  if(!dirs.length){ alert('No hay direcciones cargadas para armar la ruta de este día.'); return; }
  const destino=dirs[dirs.length-1];
  const waypoints=dirs.slice(0,-1).join('|');
  const url='https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(destino)+(waypoints?'&waypoints='+encodeURIComponent(waypoints):'');
  window.open(url,'_blank');
}
function renderModoReparto(){
  const fecha=REPARTO_FECHA||todayISO();
  const ventas=repartoVentas(fecha);
  const pend=ventas.filter(s=>s.estadoDespacho!=='entregado');
  const done=ventas.filter(s=>s.estadoDespacho==='entregado');
  const ord=[...pend,...done];
  const tieneDirs=pend.some(s=>(s.direccion||s.comuna||s.ciudad));
  const card=(s,idx)=>{const c=clientById(s.clienteId);const nom=c?c.nombre:(s.clienteNombre||'—');const dir=[s.direccion,s.comuna,s.ciudad].filter(Boolean).join(', ');const ent=s.estadoDespacho==='entregado';const cam=s.estadoDespacho==='en_camino';return `
    <div class="border ${ent?'border-clay-100 bg-clay-50/40 opacity-80':'border-clay-200'} rounded-xl p-3">
      <div class="flex items-start justify-between gap-2">
        <div class="min-w-0"><div class="font-semibold text-sm">${idx}. ${nom}</div><div class="text-xs text-clay-500">${dir||'<span class="text-clay-300">sin dirección</span>'}</div><div class="text-xs text-clay-400 mt-0.5">${s.items.map(i=>i.cantidad+'× '+itemLabel(i)).join(', ')}</div></div>
        ${ent?pill('Entregado','green'):cam?pill('En camino','blue'):pill('Pendiente','amber')}
      </div>
      ${ent
        ? `<div class="flex flex-wrap gap-2 mt-2.5">${(c&&c.telefono)?`<button onclick="repartoAvisar('${s.id}')" class="text-xs font-medium text-white px-3 py-2 rounded-lg" style="background:#25D366">📲 Avisar entrega</button>`:''}<button onclick="repartoPendiente('${s.id}')" class="text-xs font-medium border border-clay-200 text-clay-600 hover:bg-clay-50 px-3 py-2 rounded-lg">↩️ Volver a pendiente</button></div>`
        : `<div class="grid grid-cols-2 gap-2 mt-2.5">
            <button onclick="repartoEnCamino('${s.id}')" class="text-sm font-medium ${cam?'bg-blue-600 text-white':'border border-clay-200 text-clay-700 hover:bg-clay-50'} py-2.5 rounded-lg">${cam?'🚚 En camino':'Marcar en camino'}</button>
            <button onclick="repartoEntregar('${s.id}')" class="text-sm font-semibold bg-sage-600 hover:bg-sage-700 text-white py-2.5 rounded-lg">✓ Entregar</button>
          </div>`}
    </div>`;};
  modal(`
    <div class="p-4 sm:p-5 border-b border-clay-100 sticky top-0 bg-white z-10">
      <div class="flex items-center justify-between">
        <div><h3 class="text-lg font-bold">🚚 Modo reparto</h3><div class="text-xs text-clay-500 mt-0.5">${pend.length} por entregar · ${done.length} entregada${done.length!==1?'s':''}</div></div>
        <button onclick="closeModal()" class="text-clay-400 hover:text-clay-700 text-xl">✕</button>
      </div>
      <div class="flex items-center gap-2 mt-2.5"><span class="text-xs text-clay-500">Día:</span><input type="date" value="${fecha}" onchange="setRepartoFecha(this.value)" class="border border-clay-200 rounded-lg px-2 py-1.5 text-sm"><span class="text-xs text-clay-400 capitalize">${fechaAmig(fecha)}</span></div>
    </div>
    <div class="p-4 sm:p-5 space-y-3">
      ${tieneDirs?`<button onclick="abrirRutaMaps('${fecha}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl text-sm flex items-center justify-center gap-2">🗺️ Abrir ruta en Google Maps</button>`:''}
      ${ord.length? ord.map((s,i)=>card(s,i+1)).join('') : `<div class="text-center text-clay-400 text-sm py-10"><div class="text-3xl mb-2">📭</div>No hay entregas programadas para este día.</div>`}
      <div class="text-[11px] text-clay-400 text-center pt-1">"Marcar en camino" no avisa al cliente. Al entregar puedes avisarle con un mensaje listo para copiar.</div>
    </div>
  `);
}

/* ===================== MI DÍA (tablero operativo) ===================== */
function miDiaEntregar(id){ const s=DB.sales.find(x=>x.id===id); if(!s) return; s.estadoDespacho='entregado'; if(!s.entregadoAt) s.entregadoAt=Date.now(); s.items.forEach(i=>{ i.entregadoQty=i.cantidad; }); save(); renderMiDia(); toastInfo('✓ Entregado'); }
function miDiaToggleTask(id){ const t=(DB.tasks||[]).find(x=>x.id===id); if(!t) return; t.estado='completada'; t.completadaAt=Date.now(); save(); renderMiDia(); toastInfo('✓ Tarea completada'); }
function renderMiDia(){

  const hoy=todayISO();
  const esBodega=SESSION.rol==='bodega';

  const entAtras=entregas.filter(s=>s.fechaEntrega<hoy).length;
  const tareas=(DB.tasks||[]).filter(t=>t.estado!=='completada' && t.fecha && t.fecha<=hoy).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
  const tarAtras=tareas.filter(t=>t.fecha<hoy).length;
  const tarAlta=tareas.filter(t=>t.prioridad==='alta').length;
  const impagas=DB.sales.filter(s=>!s.pagado && !s.perdido).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const porCobrar=impagas.reduce((a,s)=>a+saleTotal(s),0);
  const nClientes=new Set(impagas.map(s=>s.clienteId)).size;
  const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const hd=new Date(hoy+'T00:00:00'); const dias=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const saludoFecha=`${dias[hd.getDay()]} ${hd.getDate()} de ${MESES[hd.getMonth()]}`;
  const entregaRow=s=>{const c=clientById(s.clienteId);const atr=s.fechaEntrega<hoy;return `<div class="flex items-center gap-3 px-4 py-3 hover:bg-clay-50/60">
    <div class="flex-1 min-w-0 cursor-pointer" onclick="openSaleDetail('${s.id}')"><div class="font-medium text-sm truncate">${c?c.nombre:(s.clienteNombre||'—')}</div><div class="text-xs text-clay-400">${[s.comuna,s.ciudad].filter(Boolean).join(' · ')||'sin ubicación'} · ${s.items.map(i=>i.cantidad+'× '+itemLabel(i)).join(', ')}</div></div>
    ${atr?'<span class="badge bg-red-100 text-red-700 shrink-0">atrasada</span>':(s.estadoDespacho==='en_camino'?'<span class="badge bg-blue-100 text-blue-700 shrink-0">en camino</span>':'')}
    <button onclick="miDiaEntregar('${s.id}')" class="shrink-0 text-xs font-medium text-sage-700 bg-sage-100 hover:bg-sage-200 px-3 py-1.5 rounded-lg">Entregar ✓</button>
  </div>`;};
  const tareaRow=t=>`<div class="flex items-center gap-3 px-4 py-3">
    <button onclick="miDiaToggleTask('${t.id}')" class="shrink-0 w-6 h-6 rounded-full border-2 border-clay-300 hover:border-sage-500 flex items-center justify-center text-transparent hover:text-sage-500" title="Completar">✓</button>
    <div class="flex-1 min-w-0 cursor-pointer" onclick="openTaskDetail('${t.id}')"><div class="font-medium text-sm truncate">${t.titulo}</div><div class="text-xs text-clay-400">${t.fecha<hoy?'<span class="text-red-600">atrasada</span> · ':''}${t.responsable||''}${t.proveedor?' · 🏷️ '+t.proveedor:''}</div></div>
    ${taskPrioPill(t.prioridad)}
  </div>`;
  const cobroRow=s=>{const c=clientById(s.clienteId);const d=diasDesde(s.fecha);return `<div class="flex items-center gap-3 px-4 py-3">
    <div class="flex-1 min-w-0 cursor-pointer" onclick="openSaleDetail('${s.id}')"><div class="font-medium text-sm truncate">${c?c.nombre:(s.clienteNombre||'—')}</div><div class="text-xs text-clay-400">${s.fecha}${d>0?' · hace '+d+'d':''}</div></div>
    <div class="font-semibold text-red-600 text-sm whitespace-nowrap shrink-0">${fmt(saleTotal(s))}</div>
    <button onclick="recordatorioCobranza('${s.id}')" class="shrink-0 text-xs font-medium text-white px-2.5 py-1.5 rounded-lg" style="background:#25D366" title="Recordar cobro">📲</button>
  </div>`;};
  v.innerHTML=`
  <div class="mb-5"><div class="text-sm text-clay-500 capitalize">${saludoFecha}</div><h2 class="text-xl sm:text-2xl font-bold">Hola, ${(SESSION.nombre||'').split(' ')[0]} 👋</h2></div>
  <div class="grid grid-cols-2 lg:grid-cols-3 gap-2.5 sm:gap-4 mb-5">
    <button onclick="go('despachos')" class="block text-left w-full">${statCard('🚚 Entregas de hoy',entregas.length,entAtras?entAtras+' atrasada'+(entAtras!==1?'s':''):'al día 👍',entAtras?'text-amber-600':'text-clay-800')}</button>
    <button onclick="go('tareas')" class="block text-left w-full">${statCard('✅ Tareas de hoy',tareas.length,tarAlta?tarAlta+' alta prioridad':(tarAtras?tarAtras+' atrasada'+(tarAtras!==1?'s':''):'al día 👍'),tarAtras?'text-amber-600':'text-blue-600')}</button>
    ${!esBodega?`<button onclick="go('cobranzas')" class="block text-left w-full card p-3 sm:p-5 ring-2 ring-red-200 col-span-2 lg:col-span-1" style="background:#fef2f2"><div class="text-[11px] sm:text-sm text-red-700 font-semibold">💰 Por cobrar</div><div class="text-lg sm:text-2xl font-bold mt-0.5 text-red-700">${fmt(porCobrar)}</div><div class="text-[10px] sm:text-xs text-red-600 mt-0.5">${nClientes} cliente${nClientes!==1?'s':''} · ver →</div></button>`:''}
  </div>
  <div class="card overflow-hidden mb-5">
    <div class="px-4 py-3 border-b border-clay-100 flex items-center justify-between gap-2">
      <div class="font-semibold flex items-center gap-2">🚚 Entregas de hoy ${entregas.length?pill(entregas.length, entAtras?'amber':'gray'):''}</div>
      ${entregas.length?`<button onclick="openModoReparto('${hoy}')" class="text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 px-3 py-1.5 rounded-lg">Modo reparto →</button>`:''}
    </div>
    ${entregas.length?`<div class="divide-y divide-clay-100">${entregas.map(entregaRow).join('')}</div>`:'<div class="px-4 py-8 text-center text-clay-400 text-sm">No hay entregas pendientes para hoy 🎉</div>'}

      ${tareas.length?`<div class="divide-y divide-clay-100">${tareas.map(tareaRow).join('')}</div>`:'<div class="px-4 py-8 text-center text-clay-400 text-sm">Sin tareas para hoy 👍</div>'}
    </div>
    ${!esBodega?`<div class="card overflow-hidden">
      <div class="px-4 py-3 border-b border-clay-100 flex items-center justify-between"><div class="font-semibold flex items-center gap-2">💰 Cobros pendientes</div><button onclick="go('cobranzas')" class="text-xs text-clay-600 hover:underline">Ver todos →</button></div>
      ${impagas.length?`<div class="divide-y divide-clay-100">${impagas.slice(0,6).map(cobroRow).join('')}</div>${impagas.length>6?`<div class="px-4 py-2 text-center"><button onclick="go('cobranzas')" class="text-xs text-clay-500 hover:underline">+${impagas.length-6} más en Cobranzas</button></div>`:''}`:'<div class="px-4 py-8 text-center text-clay-400 text-sm">No tienes cuentas por cobrar ✅</div>'}
    </div>`:''}
  </div>`;
}

/* ===================== ANÁLISIS ABC / PARETO ===================== */
let ABC_VIEW='prod', ABC_PERIODO='anio';
const ABC_TIPO_PROD={A:'⭐ Estrella',B:'Estable',C:'🐌 Lento'};
const ABC_TIPO_CLI={A:'⭐ Clave',B:'Habitual',C:'🐌 Esporádico'};
const ABC_ACC_PROD={A:'Nunca te puede faltar. Ten stock siempre. No lo descuentes: ya se vende solo.',B:'Va bien. Un descuento chico de vez en cuando ayuda, sin exagerar.',C:'Casi no se vende. Métele oferta para sacarlo, o súmalo en combo con una estrella.'};
const ABC_ACC_CLI={A:'De tus mejores. Trátalo regio y muéstrale tus ofertas primero.',B:'Te compra seguido. Un empujón (oferta dirigida) puede hacerlo comprar más.',C:'Te compra poco o dejó de comprar. Mándale una promo para reactivarlo.'};
function setABCView(v){ ABC_VIEW=v; renderABC(); }
function setABCPeriodo(p){ ABC_PERIODO=p; renderABC(); }
function abcExclMap(){ DB.config=DB.config||{}; if(!DB.config.abcExcl) DB.config.abcExcl={prod:{},cli:{}}; if(!DB.config.abcExcl.prod)DB.config.abcExcl.prod={}; if(!DB.config.abcExcl.cli)DB.config.abcExcl.cli={}; return DB.config.abcExcl; }
function toggleABCExcl(view,key){ const m=abcExclMap()[view]; if(m[key]) delete m[key]; else m[key]=true; save(); renderABC(); }
function abcEnRango(s){ const now=new Date(); const y=String(now.getFullYear()); const ym=y+'-'+String(now.getMonth()+1).padStart(2,'0'); if(ABC_PERIODO==='mes') return (s.fecha||'').slice(0,7)===ym; if(ABC_PERIODO==='anio') return (s.fecha||'').slice(0,4)===y; return true; }
function renderABC(){
  const v=document.getElementById('view');
  const esProd=ABC_VIEW==='prod';
  const sales=DB.sales.filter(s=>!s.perdido && abcEnRango(s));
  const agg={};
  if(esProd){
    sales.forEach(s=>s.items.forEach(i=>{ const p=i.productId?productById(i.productId):null; const key=i.productId||('desc:'+(i.descripcion||'')); const name=p?productName(p):(i.descripcion||'(producto)'); if(!agg[key])agg[key]={key,name,v:0}; agg[key].v+=lineTotal(i); }));
  } else {
    sales.forEach(s=>{ const c=clientById(s.clienteId); const key=s.clienteId||('nom:'+(s.clienteNombre||'')); const name=c?c.nombre:(s.clienteNombre||'(cliente)'); if(!agg[key])agg[key]={key,name,v:0}; agg[key].v+=saleSubtotal(s); });
  }
  const exclM=abcExclMap()[esProd?'prod':'cli'];
  const all=Object.values(agg).filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
  all.forEach(r=>r.excl=!!exclM[r.key]);
  const incl=all.filter(r=>!r.excl);
  const total=incl.reduce((a,r)=>a+r.v,0);
  let cum=0; incl.forEach(r=>{ r.pct=total?r.v/total*100:0; cum+=r.pct; r.cum=cum; r.clase=r.cum<=80?'A':(r.cum<=95?'B':'C'); });
  const A=incl.filter(r=>r.clase==='A'),B=incl.filter(r=>r.clase==='B'),C=incl.filter(r=>r.clase==='C');
  const cPct=total?Math.round(C.reduce((a,r)=>a+r.v,0)/total*100):0;
  const noun=esProd?'productos':'clientes';
  const tipos=esProd?ABC_TIPO_PROD:ABC_TIPO_CLI;
  const acc=esProd?ABC_ACC_PROD:ABC_ACC_CLI;
  const exclN=all.length-incl.length;
  const vt=(x,l)=>`<button onclick="setABCView('${x}')" class="px-4 py-1.5 rounded-lg text-sm font-medium ${ABC_VIEW===x?'bg-white shadow-sm text-clay-800':'text-clay-500'}">${l}</button>`;
  const pb=(p,l)=>`<button onclick="setABCPeriodo('${p}')" class="px-3 py-1.5 rounded-lg text-sm font-medium ${ABC_PERIODO===p?'bg-clay-700 text-white':'bg-white border border-clay-200 text-clay-600 hover:bg-clay-50'}">${l}</button>`;
  const alerta=(bg,tx,sub,icon,t,x)=>`<div class="card flex items-start gap-3 p-3.5" style="background:${bg}"><span class="text-xl shrink-0">${icon}</span><div><div class="font-semibold text-sm ${tx}">${t}</div><div class="text-xs ${sub} mt-0.5 leading-snug">${x}</div></div></div>`;
  let alertasHtml='';
  if(total>0){
    if(esProd){
      alertasHtml=alerta('#fef2f2','text-red-800','text-red-700','⚠️','Dependes de pocos productos',`El 80% de tu venta sale de solo <b>${A.length} producto${A.length!==1?'s':''}</b>. Si se te agota uno, lo notas al tiro → ten stock de esos sí o sí.`)
        +alerta('#fffbeb','text-amber-800','text-amber-700','📦',`${C.length} producto${C.length!==1?'s':''} casi no vende${C.length!==1?'n':''}`,`Si tienes stock de ellos, es plata parada en bodega. → Liquídalos en una oferta o ármalos en combo con una estrella.`)
        +alerta('#f3f9ee','text-sage-700','text-clay-600','🎯','Para tu próxima campaña',`Pon en oferta los <b>🐌 lentos</b> (no las estrellas, que ya se venden solas) y muéstrasela primero a tus mejores clientes.`);
    } else {
      alertasHtml=alerta('#fef2f2','text-red-800','text-red-700','⚠️','Dependes de pocos clientes',`El 80% de tu venta viene de solo <b>${A.length} cliente${A.length!==1?'s':''}</b>. Si uno deja de comprar, se siente → cuídalos y suma clientes nuevos.`)
        +alerta('#f3f9ee','text-sage-700','text-clay-600','🎯','A quién mostrarle las ofertas',`Tus <b>${A.length} cliente${A.length!==1?'s':''} clave</b> son los que más responden. → Muéstrales cada oferta nueva primero.`)
        +alerta('#fffbeb','text-amber-800','text-amber-700','🔄',`${C.length} cliente${C.length!==1?'s':''} te compra${C.length!==1?'n':''} poco`,`Mándales una promo para que vuelvan. Recuperar a alguien que ya te compró es lo más barato.`);
    }
  }
  const grupo=(letra,emoji,tit,arr)=>`<div class="card p-4"><div class="text-xs font-semibold inline-block px-2 py-0.5 rounded ${({A:'bg-sage-100 text-sage-700',B:'bg-amber-100 text-amber-700',C:'bg-red-100 text-red-700'})[letra]} mb-2">${emoji} ${tit}</div><div class="text-2xl font-bold">${arr.length}</div><div class="text-xs text-clay-500 mb-2">${noun} · ${total?Math.round(arr.reduce((a,r)=>a+r.v,0)/total*100):0}% de la venta</div><div class="text-xs text-clay-600 leading-snug">${acc[letra]}</div></div>`;
  const chart=incl.slice(0,20);
  const maxV=Math.max(1,...chart.map(r=>r.v));
  const colC={A:'bg-sage-500',B:'bg-amber-400',C:'bg-red-300'};
  const claseColor={A:'bg-sage-100 text-sage-700',B:'bg-amber-100 text-amber-700',C:'bg-red-100 text-red-700'};
  v.innerHTML=`
  <div class="flex flex-wrap items-center gap-3 mb-4">
    <div class="inline-flex bg-clay-100 rounded-xl p-1">${vt('prod','Productos')}${vt('cli','Clientes')}</div>
    <div class="flex items-center gap-1.5 sm:ml-auto">${pb('mes','Este mes')}${pb('anio','Este año')}${pb('todo','Todo')}</div>
  </div>
  ${total===0?`<div class="card p-12 text-center text-clay-500"><div class="text-3xl mb-2">📊</div>No hay ventas en este período para analizar.</div>`:`
  <div class="card overflow-hidden mb-4">
    <div class="flex items-center gap-2 px-4 sm:px-5 py-3 bg-clay-800 text-white"><span class="text-lg">💡</span><div class="font-semibold text-sm sm:text-base">En simple</div></div>
    <div class="px-4 sm:px-5 py-4 text-[15px] leading-relaxed text-clay-700">
      De tus <b>${incl.length} ${noun}</b> con venta, solo <b class="text-sage-700">${A.length}</b> te dan el <b>80% de la plata</b>. Esos son tus <b>estrellas</b> ⭐: son los que mantienen el negocio, cuídalos.<br>
      En cambio, <b class="text-red-600">${C.length} ${noun}</b> juntan apenas el <b>${cPct}%</b> — casi no ${esProd?'venden':'compran'}. ${esProd?'Son los candidatos perfectos para una oferta o combo.':'Vale la pena reactivarlos con una promo.'}${exclN>0?` <span class="text-clay-400">(${exclN} excluido${exclN!==1?'s':''} del análisis)</span>`:''}
    </div>
  </div>
  <div class="space-y-2.5 mb-4">${alertasHtml}</div>
  <div class="grid sm:grid-cols-3 gap-3 mb-4">${grupo('A','⭐',esProd?'Estrellas':'Clave',A)}${grupo('B','',esProd?'Estables':'Habituales',B)}${grupo('C','🐌',esProd?'Lentos':'Esporádicos',C)}</div>
  <div class="card p-4 sm:p-5 mb-4">
    <div class="font-semibold mb-1">${esProd?'Tus productos, de más a menos venta':'Tus clientes, de más a menos venta'}${incl.length>20?' (top 20)':''}</div>
    <p class="text-xs text-clay-400 mb-3">Cada barra es lo que vende. La línea roja marca dónde se junta el 80% de tu venta: lo de su izquierda es lo que mueve la caja.</p>
    <div class="relative" style="height:200px">
      <svg class="absolute inset-0 w-full" style="height:170px" viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="0" y1="20" x2="100" y2="20" stroke="#dc2626" stroke-width="0.5" stroke-dasharray="2 1.5"/><polyline fill="none" stroke="#3a4e40" stroke-width="0.9" points="${chart.map((r,i)=>`${((i+0.5)/chart.length*100).toFixed(2)},${(100-r.cum).toFixed(2)}`).join(' ')}"/></svg>

let CAL=null; // {y, m}

function calNav(delta){ if(!CAL){const n=new Date();CAL={y:n.getFullYear(),m:n.getMonth()};} let m=CAL.m+delta, y=CAL.y; if(m<0){m=11;y--;} if(m>11){m=0;y++;} CAL={y,m}; renderCalendario(); }
function calToday(){ const n=new Date(); CAL={y:n.getFullYear(),m:n.getMonth()}; renderCalendario(); }
function generateHojaRuta(fecha, auto){
  if(!fecha){ alert('Elige un día para la hoja de ruta.'); return; }
  if(!window.jspdf||!window.jspdf.jsPDF){ alert('No se pudo generar el PDF. Verifica tu conexión.'); return; }
  let ventas=DB.sales.filter(s=>s.fechaEntrega===fecha && s.estadoDespacho!=='entregado');
  if(auto) ventas=ventas.filter(s=>s.auto===auto);
  ventas.sort((a,b)=> (a.ciudad||'').localeCompare(b.ciudad||'') || (a.comuna||'').localeCompare(b.comuna||'') );
  if(ventas.length===0){ alert('No hay entregas pendientes para el '+fecha+(auto?' en '+auto:'')+'.'); return; }
  const totalUnidades=ventas.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.cantidad,0),0);
  const comunas=[...new Set(ventas.map(s=>s.comuna||s.ciudad).filter(Boolean))];
  // Resumen de carga: total de cada producto a cargar ese día
  const resumen={};
  ventas.forEach(s=>s.items.forEach(i=>{
    const p=productById(i.productId);
    const name=p?productName(p):(i.descripcion||'(producto)');
    const key=p?p.id:name;
    if(!resumen[key]) resumen[key]={name, cant:0};
    resumen[key].cant+=i.cantidad;
  }));
  const resumenArr=Object.values(resumen).sort((a,b)=> b.cant-a.cant || a.name.localeCompare(b.name));

  const { jsPDF }=window.jspdf; const doc=new jsPDF();
  const drawBand=()=>{
    doc.setFillColor(74,44,35); doc.rect(0,0,210,26,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.text('Viet Pottery — Hoja de ruta'+(auto?' · '+auto:''),14,12);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(221,176,155);
    doc.text('Entregas del '+fecha+(auto?'   ·   '+auto:'')+'   ·   '+ventas.length+' paradas   ·   '+totalUnidades+' productos a repartir',14,20);
  };
  drawBand();

  // ---------- Sección 1: Resumen de carga ----------
  let y=35;
  doc.setTextColor(74,44,35); doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text('Resumen de carga',14,y);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(150,128,116); doc.text('Total de cada producto a cargar para esta ruta',14,y+4.5);
  doc.autoTable({
    startY:y+8,
    head:[['Producto','Cantidad']],
    body:resumenArr.map(r=>[r.name, String(r.cant)]),
    foot:[['Total de productos a repartir', String(totalUnidades)]],
    styles:{fontSize:9.5,cellPadding:3.2,textColor:[74,44,35],lineColor:[242,229,220],lineWidth:0.1},
    headStyles:{fillColor:[125,72,54],textColor:[255,255,255]},
    footStyles:{fillColor:[245,233,225],textColor:[74,44,35],fontStyle:'bold'},
    alternateRowStyles:{fillColor:[247,250,247]},
    columnStyles:{0:{fontStyle:'bold'},1:{halign:'right',cellWidth:34,fontStyle:'bold'}},
    margin:{top:30,left:14,right:14},
    didDrawPage:()=>{ drawBand(); }
  });

  // ---------- Sección 2: Detalle de la ruta ----------
  y=doc.lastAutoTable.finalY+11;
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(74,44,35); doc.text('Detalle de la ruta',14,y);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(150,128,116); doc.text('Paradas ordenadas por zona. Marca la casilla a medida que entregas.',14,y+4.5);
  doc.autoTable({
    startY:y+8,
    head:[['','Cliente','Ciudad / Comuna','Dirección','Productos','Tipo']],
    body:ventas.map(s=>{
      const c=clientById(s.clienteId);
      const nom=(c?c.nombre:(s.clienteNombre||'—'))+((c&&c.telefono)?'\n'+c.telefono:'');
      const lugar=[s.ciudad,s.comuna].filter(Boolean).join('\n')||'-';
      const prods=s.items.map(i=>i.cantidad+'x '+itemLabel(i)).join('\n');
      return ['', nom, lugar, s.direccion||'-', prods, tipoDespachoOf(s)];
    }),
    styles:{fontSize:9,cellPadding:3.2,valign:'top',lineColor:[242,229,220],lineWidth:0.1,textColor:[74,44,35]},
    headStyles:{fillColor:[125,72,54],textColor:[255,255,255],halign:'left'},
    alternateRowStyles:{fillColor:[247,250,247]},
    columnStyles:{0:{cellWidth:9,halign:'center'},1:{cellWidth:35,fontStyle:'bold'},2:{cellWidth:28},3:{cellWidth:42},5:{cellWidth:14,halign:'center'}},
    margin:{top:30,left:10,right:10},
    didDrawCell:(data)=>{ if(data.section==='body' && data.column.index===0){ doc.setDrawColor(120,120,120); doc.setLineWidth(0.3); doc.rect(data.cell.x+2.5, data.cell.y+2.5, 4.5, 4.5); } },
    didDrawPage:()=>{ drawBand(); }
  });

  let yy=doc.lastAutoTable.finalY+9;
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(74,44,35);
  doc.text('Total de productos a repartir: '+totalUnidades+'   ·   Paradas: '+ventas.length,14,yy);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(147,86,64);
  yy+=6; doc.text('Comunas en la ruta: '+(comunas.join(', ')||'-'),14,yy);
  doc.setFontSize(8); doc.setTextColor(150,150,150);
  doc.text('Hoja de ruta generada con la plataforma Viet Pottery · '+new Date().toLocaleDateString('es-CL'),14,290);
  savePdfDoc(doc, 'hoja-de-ruta-'+fecha+(auto?'-'+auto.toLowerCase().replace(/\s+/g,'-'):'')+'.pdf');
}
function cargaResumenArr(sales){

}

  const list=DB.sales.filter(s=>s.fechaEntrega===fecha && s.origen!=='CA').sort((a,b)=>(a.ciudad||'').localeCompare(b.ciudad||'')||(a.comuna||'').localeCompare(b.comuna||''));

function renderCalendario(){
  if(!CAL){ const n=new Date(); CAL={y:n.getFullYear(),m:n.getMonth()}; }
  const {y,m}=CAL;
  const monthNames=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const dow=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const first=new Date(y,m,1);
  const lead=(first.getDay()+6)%7;            // Lunes como primer día
  const dim=new Date(y,m+1,0).getDate();
  const estColor={pendiente:'bg-amber-100 text-amber-800',en_camino:'bg-blue-100 text-blue-800',entregado:'bg-sage-100 text-sage-700'};

  const byDay={}; const sinFecha=[];
  DB.sales.forEach(s=>{
    if(s.perdido || s.origen==='CA') return;   // Las entregas de Casa Augusta se ven en su propio módulo
    if(!s.fechaEntrega){ sinFecha.push(s); return; }
    const [yy,mm,dd]=s.fechaEntrega.split('-').map(Number);
    if(yy===y && (mm-1)===m){ (byDay[dd]=byDay[dd]||[]).push(s); }
  });
  // Tareas pendientes del mes (se muestran en el calendario sin mezclarse con las entregas)
  const byDayTask={};
  (DB.tasks||[]).forEach(tk=>{ if(tk.estado==='completada'||!tk.fecha) return; const [yy,mm,dd]=tk.fecha.split('-').map(Number); if(yy===y&&(mm-1)===m){ (byDayTask[dd]=byDayTask[dd]||[]).push(tk); } });
  const taskChip=tk=>{const cl=tk.prioridad==='alta'?'bg-red-100 text-red-700':'bg-violet-100 text-violet-700';return `<button onclick="openTaskDetail('${tk.id}')" class="block w-full text-left"><span class="block text-[11px] leading-tight px-1.5 py-1 rounded mb-1 truncate ${cl}" title="Tarea: ${(tk.titulo||'').replace(/"/g,'')}">📋 ${tk.titulo}</span></button>`;};
  const t=new Date(); const isToday=d=> d===t.getDate() && m===t.getMonth() && y===t.getFullYear();
  const entregasMes=Object.values(byDay).reduce((a,l)=>a+l.length,0);

  let cells='';
  for(let i=0;i<lead;i++) cells+='<div class="bg-clay-50/40 rounded-lg"></div>';
  const calChip=s=>{const c=clientById(s.clienteId);const nom=c?c.nombre:(s.clienteNombre||'—');const cl=estColor[s.estadoDespacho]||'bg-clay-100 text-clay-700';const tag=`<span class="block text-[11px] leading-tight px-1.5 py-1 rounded mb-1 truncate ${cl}" title="${nom} · ${s.items.map(i=>i.cantidad+'× '+itemLabel(i)).join(', ')}">${nom}</span>`;return `<button onclick="openSaleDetail('${s.id}')" class="block w-full text-left">${tag}</button>`;};
  for(let d=1; d<=dim; d++){
    const list=byDay[d]||[];
    const tlist=byDayTask[d]||[];
    const dstr=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const extra=list.length-4;
    const tExtra=tlist.length-2;
    cells+=`<div class="bg-white border ${isToday(d)?'border-clay-500 ring-1 ring-clay-300':'border-clay-100'} rounded-lg p-1.5 min-h-[96px]">

        <span class="text-xs font-bold ${isToday(d)?'text-clay-700':'text-clay-500'}">${d}</span>
        ${list.length>0?`<button onclick="openDiaEntregas('${dstr}')" class="inline-flex items-center gap-1 text-[10px] font-bold bg-clay-700 hover:bg-clay-800 text-white px-2 py-0.5 rounded-full" title="Ver resumen del día">${list.length} ${list.length===1?'entrega':'entregas'}</button>`:''}
      </div>
      ${tlist.length>0?`<button onclick="openDiaTareas('${dstr}')" class="flex items-center justify-center gap-1 w-full text-[10px] font-bold bg-violet-100 hover:bg-violet-200 text-violet-700 px-2 py-0.5 rounded-full mt-1" title="Ver tareas del día">📋 ${tlist.length} ${tlist.length===1?'tarea':'tareas'}</button>`:''}
      <div class="mt-1.5"></div>
      ${list.slice(0,4).map(calChip).join('')}
      ${extra>0?`<button onclick="openDiaEntregas('${dstr}')" class="block w-full text-left text-[11px] font-semibold text-clay-600 hover:text-clay-900 px-1.5 py-1 rounded hover:bg-clay-100">+${extra} más</button>`:''}
      ${tlist.slice(0,2).map(taskChip).join('')}
      ${tExtra>0?`<button onclick="openDiaTareas('${dstr}')" class="block w-full text-left text-[11px] font-semibold text-violet-600 hover:text-violet-800 px-1.5 py-1 rounded hover:bg-violet-50">+${tExtra} tarea${tExtra!==1?'s':''}</button>`:''}
    </div>`;
  }
  const trail=(7-((lead+dim)%7))%7;
  for(let i=0;i<trail;i++) cells+='<div class="bg-clay-50/40 rounded-lg"></div>';

  // Vista "Lista" (agenda): una tarjeta por cada día con entregas o tareas
  const dayCards=[];
  for(let d=1; d<=dim; d++){
    const list=byDay[d]||[], tlist=byDayTask[d]||[];
    if(!list.length && !tlist.length) continue;
    const dstr=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const wd=dow[(new Date(y,m,d).getDay()+6)%7];
    dayCards.push(`<div class="card p-3 ${isToday(d)?'ring-1 ring-clay-400':''}">
      <div class="flex items-center gap-3 mb-2">
        <div class="flex flex-col items-center justify-center w-12 h-12 rounded-xl ${isToday(d)?'bg-clay-700 text-white':'bg-clay-100 text-clay-700'} shrink-0"><span class="text-[10px] font-semibold uppercase leading-none">${wd}</span><span class="text-xl font-bold leading-none mt-0.5">${d}</span></div>
        <div class="flex-1 flex flex-wrap gap-1.5">
          ${list.length?`<button onclick="openDiaEntregas('${dstr}')" class="text-[11px] font-bold bg-clay-700 hover:bg-clay-800 text-white px-2.5 py-1 rounded-full">${list.length} ${list.length===1?'entrega':'entregas'}</button>`:''}
          ${tlist.length?`<button onclick="openDiaTareas('${dstr}')" class="text-[11px] font-bold bg-violet-100 hover:bg-violet-200 text-violet-700 px-2.5 py-1 rounded-full">📋 ${tlist.length} ${tlist.length===1?'tarea':'tareas'}</button>`:''}
        </div>
      </div>
      <div class="space-y-1">
        ${list.slice(0,4).map(calChip).join('')}
        ${list.length>4?`<button onclick="openDiaEntregas('${dstr}')" class="block w-full text-left text-[11px] font-semibold text-clay-600 hover:text-clay-900 px-1.5 py-1 rounded hover:bg-clay-100">+${list.length-4} entrega${list.length-4!==1?'s':''} más →</button>`:''}
        ${tlist.slice(0,3).map(taskChip).join('')}
        ${tlist.length>3?`<button onclick="openDiaTareas('${dstr}')" class="block w-full text-left text-[11px] font-semibold text-violet-600 hover:text-violet-800 px-1.5 py-1 rounded hover:bg-violet-50">+${tlist.length-3} tarea${tlist.length-3!==1?'s':''} más →</button>`:''}
      </div>
    </div>`);
  }
  const agendaHTML = dayCards.length? `<div class="space-y-2.5">${dayCards.join('')}</div>` : '<div class="card p-8 text-center text-clay-400 text-sm">No hay entregas ni tareas programadas este mes.</div>';

  <div class="card p-4 mb-4 flex flex-wrap items-center gap-2">

    <button onclick="generateHojaRuta(document.getElementById('rutaFecha').value)" class="bg-clay-700 hover:bg-clay-800 text-white text-sm font-semibold px-4 py-1.5 rounded-lg flex items-center gap-1.5"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Generar PDF</button>
    <button onclick="openModoReparto(document.getElementById('rutaFecha').value)" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-1.5 rounded-lg flex items-center gap-1.5">🚚 Modo reparto</button>

  <div class="flex items-center justify-between mb-4 flex-wrap gap-3">
    <div class="flex items-center gap-2">
      <button onclick="calNav(-1)" class="w-9 h-9 rounded-lg border border-clay-200 hover:bg-clay-100">←</button>
      <div class="text-base sm:text-lg font-bold w-32 sm:w-48 text-center">${monthNames[m]} ${y}</div>
      <button onclick="calNav(1)" class="w-9 h-9 rounded-lg border border-clay-200 hover:bg-clay-100">→</button>
      <button onclick="calToday()" class="px-3 h-9 rounded-lg border border-clay-200 hover:bg-clay-100 text-sm">Hoy</button>
      <div class="inline-flex bg-clay-100 rounded-xl p-1 ml-1">
        <button onclick="setCalView('mes')" class="px-3 py-1 rounded-lg text-sm font-medium ${CAL_VIEW!=='lista'?'bg-white shadow-sm text-clay-800':'text-clay-500'}">Mes</button>
        <button onclick="setCalView('lista')" class="px-3 py-1 rounded-lg text-sm font-medium ${CAL_VIEW==='lista'?'bg-white shadow-sm text-clay-800':'text-clay-500'}">Lista</button>
      </div>
      <span class="text-sm text-clay-500 ml-1 hidden sm:inline">${entregasMes} entrega${entregasMes!==1?'s':''} este mes</span>
    </div>
    <div class="flex items-center gap-2 sm:gap-3 text-[11px] sm:text-xs text-clay-500 flex-wrap">
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-amber-200 inline-block"></span>Pendiente</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-blue-200 inline-block"></span>En camino</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-sage-200 inline-block"></span>Entregado</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-violet-200 inline-block"></span>📋 Tarea</span>
    </div>
  </div>
  ${CAL_VIEW==='lista' ? agendaHTML : `<div class="card p-2 sm:p-3 overflow-x-auto">
    <div class="min-w-[720px] sm:min-w-[760px]">
      <div class="grid grid-cols-7 gap-1 sm:gap-1.5 mb-1 sm:mb-1.5">${dow.map(d=>`<div class="text-xs font-semibold text-clay-500 text-center py-1">${d}</div>`).join('')}</div>
      <div class="grid grid-cols-7 gap-1 sm:gap-1.5">${cells}</div>
    </div>
  </div>`}
  ${sinFecha.length?`<div class="card p-4 mt-4">
    <div class="font-semibold mb-2 flex items-center gap-2">⚠️ Pedidos sin fecha de entrega ${pill(sinFecha.length,'amber')}</div>
    <div class="divide-y divide-clay-100">${sinFecha.map(s=>{const c=clientById(s.clienteId);return `<div class="flex items-center justify-between text-sm py-2 gap-2"><div class="min-w-0"><span class="font-medium">${c?c.nombre:(s.clienteNombre||'—')}</span> <span class="text-clay-400">· ${s.items.map(i=>i.cantidad+'× '+itemLabel(i)).join(', ')}</span></div>${SESSION.rol!=='bodega'?`<button onclick="openSale('${s.id}')" class="shrink-0 text-clay-600 hover:text-clay-900 text-xs font-medium">Asignar fecha →</button>`:''}</div>`;}).join('')}</div>

          ${cs.length?cs.map(s=>`<div onclick="openSaleDetail('${s.id}')" class="border border-clay-100 rounded-xl p-3 cursor-pointer hover:border-clay-300">
            <div class="flex justify-between items-start gap-2"><div class="text-sm font-medium">${s.fecha}</div><div class="font-semibold whitespace-nowrap">${fmt(saleTotal(s))}</div></div>
            <div class="text-xs text-clay-500 mt-1">${s.items.map(i=>i.cantidad+'× '+itemLabel(i)).join(', ')}</div>
            <div class="flex flex-wrap gap-1.5 mt-2">${payPill(s)}${dispPill(s)}</div>

/* ===================== COBRANZAS ===================== */
function diasDesde(iso){ if(!iso) return 0; const d=new Date(iso+'T00:00:00'); return Math.max(0,Math.floor((Date.now()-d.getTime())/86400000)); }
function markPaid(id){ const s=DB.sales.find(x=>x.id===id); if(!s) return; s.pagado=true; save(); go('cobranzas'); }
// Recordatorio de cobranza por WhatsApp para una venta impaga
function recordatorioCobranza(saleId){
  const s=DB.sales.find(x=>x.id===saleId); if(!s) return;
  const c=clientById(s.clienteId);
  const nombre=c?c.nombre:(s.clienteNombre||'');
  const total=saleTotal(s);
  const d=diasDesde(s.fecha);
  const prods=s.items.map(i=>'• '+i.cantidad+'× '+itemLabelCliente(i)).join('\n');
  let msg=`Hola ${nombre}! 🌿\n\nTe escribimos de Viet Pottery para recordarte el pago pendiente de tu pedido del ${s.fecha}`;
  if(d>0) msg+=` (hace ${d} día${d!==1?'s':''})`;
  msg+=`.\n\nDetalle:\n${prods}\n\nMonto pendiente: *${fmt(total)}*`;
  if(s.linkPago) msg+=`\n\nPuedes pagar aquí: ${s.linkPago}`;
  msg+=`\n\n¡Gracias! Cualquier duda nos avisas 🙏`;
  mostrarRecordatorio(msg, telWa(c&&c.telefono?c.telefono:''));
}
// Recordatorio consolidado de todo lo que un cliente debe
function recordatorioClienteDeuda(cid){
  const c=clientById(cid); if(!c) return;
  const ventas=DB.sales.filter(s=>!s.pagado && !s.perdido && s.clienteId===cid).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(!ventas.length) return;
  const total=ventas.reduce((a,s)=>a+saleTotal(s),0);
  let msg=`Hola ${c.nombre}! 🌿\n\nTe escribimos de Viet Pottery por tu saldo pendiente:\n\n`;
  msg+=ventas.map(s=>`• Pedido ${s.fecha}: ${fmt(saleTotal(s))}`).join('\n');
  msg+=`\n\nTotal pendiente: *${fmt(total)}*`;
  const conLink=ventas.find(s=>s.linkPago);
  if(conLink) msg+=`\n\nPuedes pagar aquí: ${conLink.linkPago}`;
  msg+=`\n\n¡Gracias! 🙏`;
  mostrarRecordatorio(msg, telWa(c.telefono||''));
}
// Muestra el mensaje listo para copiar (y pegar en el WhatsApp ya abierto)
function mostrarRecordatorio(msg, tel, titulo){
  const safe=msg.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  modal(`
    <div class="p-5">
      <h3 class="font-bold text-lg">${titulo||'📲 Recordatorio de cobro'}</h3>
      <p class="text-sm text-clay-500 mt-1">Copia el mensaje y pégalo en el chat de tu WhatsApp (ya abierto). Puedes editarlo antes.</p>
      <textarea id="recMsgBox" rows="9" class="w-full border border-clay-200 rounded-xl px-3 py-2 text-sm mt-3">${safe}</textarea>

function copiarRecordatorio(){

let STOCK_SORT={key:'producto',dir:'asc'}, STOCK_Q='', STOCK_EST='';
function setStockSort(key){ STOCK_Q=(document.getElementById('fStock')?.value)??STOCK_Q; STOCK_EST=(document.getElementById('fStockEstado')?.value)??STOCK_EST; if(STOCK_SORT.key===key){ STOCK_SORT.dir=STOCK_SORT.dir==='asc'?'desc':'asc'; } else { STOCK_SORT.key=key; STOCK_SORT.dir=(key==='producto'||key==='sku')?'asc':'desc'; } renderStock(); }

function filterStock(){
  const q=((document.getElementById('fStock')||{}).value||'').toLowerCase();

  document.querySelectorAll('.stcard').forEach(el=>{ const ok=(!q||(el.dataset.text||'').includes(q))&&(!est||el.dataset.estado===est); el.style.display=ok?'':'none'; });

/* ----- Trazabilidad: historial de movimientos de un producto ----- */
function stockMovements(productId){
  const moves=[];
  const p=productById(productId);
  if(p) moves.push({fecha:'', orden:0, tipo:'Stock inicial', detalle:'Carga base del producto', cantidad:p.stockInicial});
  DB.purchases.forEach(c=>c.items.forEach(i=>{ if(i.productId===productId && i.bodega!=='CA') moves.push({fecha:c.fecha, orden:1, tipo:'Compra', detalle:c.proveedor||'Proveedor', cantidad:i.cantidad}); }));
  DB.sales.forEach(s=>{ if(s.bodega==='CA') return; s.items.forEach(i=>{ if(i.productId===productId){const c=clientById(s.clienteId); moves.push({fecha:s.fecha, orden:1, tipo:'Venta', detalle:(c?c.nombre:(s.clienteNombre||'Cliente')), cantidad:-i.cantidad}); }}); });
  (DB.adjustments||[]).forEach(a=>{ if(a.productId===productId) moves.push({fecha:a.fecha, orden:1, tipo:'Ajuste', detalle:a.motivo||'Ajuste manual', cantidad:a.cantidad}); });
  (DB.transfers||[]).forEach(t=>{ if(t.estado==='anulada') return; (t.items||[]).forEach(i=>{ if(i.productId===productId){ if(t.sentido==='aCentral') moves.push({fecha:t.fecha, orden:1, tipo:'Transferencia', detalle:'Recibido desde Casa Augusta', cantidad:i.cantidad}); else moves.push({fecha:t.fecha, orden:1, tipo:'Transferencia', detalle:'Envío a Casa Augusta', cantidad:-i.cantidad}); } }); });
  moves.sort((a,b)=> (a.fecha||'').localeCompare(b.fecha||'') || a.orden-b.orden);
  let bal=0; moves.forEach(m=>{ bal+=m.cantidad; m.saldo=bal; });
  return moves;
}
function openTrazabilidad(productId){
  const p=productById(productId); if(!p) return;
  const moves=stockMovements(productId).reverse(); // más reciente arriba
  const st=stockOf(productId);

  const salidas=moves.filter(m=>m.cantidad<0).reduce((a,m)=>a+Math.abs(m.cantidad),0);
  const tcolor={'Stock inicial':'gray','Compra':'green','Venta':'blue','Ajuste':'amber'};

        <div class="bg-clay-50 rounded-xl p-3"><div class="text-xs text-clay-500">Salidas</div><div class="text-xl font-bold text-red-600">−${salidas}</div></div>
        <div class="bg-clay-50 rounded-xl p-3"><div class="text-xs text-clay-500">Valor actual</div><div class="text-xl font-bold">${fmt(st*p.costo)}</div></div>
      </div>
      <div class="overflow-x-auto border border-clay-100 rounded-xl">
        <table class="w-full text-sm min-w-[480px]">
          <thead class="bg-clay-50 text-clay-500 text-xs uppercase"><tr>
            <th class="text-left font-semibold px-4 py-2.5">Fecha</th>

            <th class="text-left font-semibold px-3 py-2.5">Detalle</th>

          </tr></thead><tbody>
          ${moves.map(m=>`<tr class="border-t border-clay-100">
            <td class="px-4 py-2.5 whitespace-nowrap text-clay-500">${m.fecha||'inicial'}</td>

          </tr>`).join('')}

      ${SESSION.rol!=='vendedor'?`<button onclick="openAdjust('${p.id}')" class="px-4 py-2 rounded-xl border border-clay-200 text-sm">Ajustar stock</button>`:''}
      <button onclick="closeModal()" class="bg-clay-700 text-white font-semibold px-5 py-2 rounded-xl">Cerrar</button>
    </div>
  `);
}

function sizeRank(t){ const k=String(t||'').trim().toUpperCase(); if(k in SIZE_RANK) return SIZE_RANK[k]; if(k.includes('ÚNIC')||k.includes('UNIC')) return 8; return 6; }
let PROD_SORT={key:'modelo', dir:'asc'};

const prodMargenPct = p => p.precioRef? (p.precioRef-p.costo)/p.precioRef*100 : 0;
const prodMargenDinero = p => (p.precioRef||0)-(p.costo||0);

    prods=[...DB.products].sort((a,b)=> dir*(modeloNuevo(a.modelo).localeCompare(modeloNuevo(b.modelo),undefined,{sensitivity:'base',numeric:true}) || sizeRank(a.tamano)-sizeRank(b.tamano) || (a.color||'').localeCompare(b.color||'',undefined,{sensitivity:'base'})));
  } else {
    const val=p=>{const k=PROD_SORT.key; if(k==='sku')return p.sku; if(k==='tamano')return sizeRank(p.tamano); if(k==='color')return p.color; if(k==='costo')return p.costo; if(k==='precio')return p.precioRef; if(k==='margen')return prodMargenPct(p); if(k==='margendinero')return prodMargenDinero(p); if(k==='stock')return stockOf(p.id); return 0;};
    prods=[...DB.products].sort((a,b)=>{const va=val(a),vb=val(b); return (typeof va==='string')? dir*String(va).localeCompare(String(vb),undefined,{sensitivity:'base'}) : dir*(va-vb);});
  }
  // Los productos "solo cotización" no son stock habitual: van SIEMPRE al final,

    </tbody></table></div>

function deleteProduct(id){

function oTotal(){const t=EDITO.items.reduce((a,i)=>a+i.cantidad*i.costo,0);const neto=Math.round(t/1.19);const set=(id,val)=>{const e=document.getElementById(id);if(e)e.textContent=val;};set('o_total',fmt(t));set('o_neto',fmt(neto));set('o_iva',fmt(t-neto));}
function onOProd(ix,pid){syncO();const p=productById(pid);EDITO.items[ix].productId=pid;if(p)EDITO.items[ix].costo=p.costo;renderOrderModal();}
function addOItem(){syncO();const p=DB.products[0];EDITO.items.push({productId:p.id,cantidad:1,costo:p.costo});renderOrderModal();}
function removeOItem(ix){if(EDITO.items.length<=1)return;syncO();EDITO.items.splice(ix,1);renderOrderModal();}
function syncO(){EDITO.proveedor=val('o_prov');EDITO.fecha=val('o_fecha');EDITO.fechaEntrega=val('o_entrega');EDITO.notas=val('o_notas');}
function saveOrder(genPDF){
  syncO();
  if(!EDITO.proveedor){alert('Ingresa el proveedor');return;}
  if(!DB.orders) DB.orders=[];
  if(typeof DB.counter.oc!=='number') DB.counter.oc=0;
  if(EDITO.id){const ix=DB.orders.findIndex(o=>o.id===EDITO.id);DB.orders[ix]=EDITO;}
  else{ DB.counter.oc++; EDITO.numero='OC-'+String(DB.counter.oc).padStart(4,'0'); EDITO.id=uid('o'); DB.orders.push(EDITO); }
  const oid=EDITO.id;
  save();closeModal();go('compras');
  if(genPDF) downloadOrderPDF(oid);
}
function deleteOrder(id){
  const o=DB.orders.find(x=>x.id===id); if(!o) return;
  confirmModal({titulo:'¿Eliminar esta orden de compra?', mensaje:'Tendrás unos segundos para deshacerlo.', confirmar:'Eliminar', danger:true, icon:'🗑️', onConfirm:()=>{
    const idx=DB.orders.indexOf(o);
    DB.orders=DB.orders.filter(x=>x.id!==id); save(); closeModal(); go('compras');
    toastUndo('Orden de compra eliminada', ()=>{ DB.orders.splice(Math.min(idx,DB.orders.length),0,o); save(); if(CURRENT==='compras') renderCompras(); else go(CURRENT); });

let RECV=null;

  const o=DB.orders.find(x=>x.id===id); if(!o) return;

        items:o.items.map(i=>{ const p=productById(i.productId); const bd=(p&&p.bodegaDefault==='CA')?'CA':(p&&p.bodegaDefault==='REQ')?'REQ':(i.bodega==='CA'?'CA':'REQ'); return {productId:i.productId, costo:i.costo, pedida:i.cantidad, recibida:i.cantidad, bodega:bd, sel:false}; })};

}
function recvItemRow(it,ix){

    <div class="col-span-3"><select onchange="onRecvBodega(${ix},this.value)" class="w-full border ${it.bodega==='CA'?'border-sage-300 bg-sage-50':'border-clay-200'} rounded-lg px-2 py-2 text-sm bg-white"><option value="REQ" ${it.bodega!=='CA'?'selected':''}>Requinoa</option><option value="CA" ${it.bodega==='CA'?'selected':''}>Casa Augusta</option></select></div>

function renderRecvModal(){
  const r=RECV;

  modal(`
    <div class="p-5 border-b border-clay-100 flex items-center justify-between sticky top-0 bg-white"><div><h3 class="text-lg font-bold">Confirmar recepción · ${r.numero}</h3><div class="text-xs text-clay-400">${r.proveedor}</div></div><button onclick="closeModal()" class="text-clay-400 hover:text-clay-700 text-xl">✕</button></div>

      <div class="grid grid-cols-12 gap-2 text-xs font-medium text-clay-400 px-1"><div class="col-span-5">Producto</div><div class="col-span-2 text-center">Pedido</div><div class="col-span-2 text-center">Recibido</div><div class="col-span-3 text-center">Bodega destino</div></div>

      <button onclick="confirmarRecepcion()" class="bg-clay-700 text-white font-semibold px-5 py-2.5 rounded-xl">Confirmar y sumar al stock</button>
    </div>`);

function onRecvQty(ix,v){RECV.items[ix].recibida=Math.max(0,+v||0);const el=document.getElementById('recv_total');if(el)el.textContent=fmt(RECV.items.reduce((a,i)=>a+(i.recibida||0)*i.costo,0));}
function onRecvBodega(ix,v){ if(RECV&&RECV.items[ix]){ RECV.items[ix].bodega=(v==='CA'?'CA':'REQ'); const el=document.getElementById('recv_items'); if(el) el.innerHTML=RECV.items.map((it,i)=>recvItemRow(it,i)).join(''); } }
function setAllRecvBodega(v){ if(!RECV)return; const b=(v==='CA'?'CA':'REQ'); RECV.items.forEach(i=>i.bodega=b); const el=document.getElementById('recv_items'); if(el) el.innerHTML=RECV.items.map((it,i)=>recvItemRow(it,i)).join(''); }
function confirmarRecepcion(){
  const r=RECV; if(!r) return;
  const items=r.items.filter(i=>(i.recibida||0)>0).map(i=>({productId:i.productId,cantidad:i.recibida,costo:i.costo,bodega:(i.bodega==='CA'?'CA':'REQ')}));
  if(items.length===0){ alert('No marcaste ninguna unidad como recibida.'); return; }
  const nota=(document.getElementById('recv_nota')?.value||'').trim();
  const hayDif=r.items.some(i=>(i.recibida||0)!==i.pedida);
  const uCA=items.filter(i=>i.bodega==='CA').reduce((a,i)=>a+i.cantidad,0);
  const uREQ=items.filter(i=>i.bodega!=='CA').reduce((a,i)=>a+i.cantidad,0);
  const destinoNota = (uCA>0&&uREQ>0)?' · '+uREQ+' u a Requinoa y '+uCA+' u a Casa Augusta':(uCA>0?' · a Casa Augusta':'');
  DB.purchases.push({id:uid('pu'),fecha:todayISO(),proveedor:r.proveedor,items,notas:'Recepción de '+r.numero+(hayDif?' (cantidades ajustadas)':'')+destinoNota+(nota?' · '+nota:'')});
  const o=DB.orders.find(x=>x.id===r.id);
  if(o){ o.estado='recibido'; o.recibido={fecha:todayISO(), items:r.items.map(i=>({productId:i.productId,pedida:i.pedida,recibida:i.recibida,bodega:(i.bodega==='CA'?'CA':'REQ')})), nota}; }
  const ocId=r.id; RECV=null; save(); closeModal(); go('compras');
  const resumenBodega=(uCA>0&&uREQ>0)?('\n'+uREQ+' u a Bodega Requinoa · '+uCA+' u a Casa Augusta.'):(uCA>0?('\nTodo a Casa Augusta ('+uCA+' u).'):('\nTodo a Bodega Requinoa ('+uREQ+' u).'));
  if(o&&!o.facturaId){
    if(confirm('✓ Recepción confirmada y sumada al stock.'+resumenBodega+'\n\n¿Quieres convertir la orden '+o.numero+' en una factura de compra ahora? Podrás confirmar el plazo, monto y adjuntar el PDF.')){
      convertirOCaFactura(ocId);
    }
  }
}
function downloadOrderPDF(id){
  const o=DB.orders.find(x=>x.id===id); if(!o) return;
  if(!window.jspdf||!window.jspdf.jsPDF){ alert('No se pudo generar el PDF. Verifica tu conexión e inténtalo de nuevo.'); return; }
  const { jsPDF }=window.jspdf;
  const doc=new jsPDF();
  const total=o.items.reduce((a,i)=>a+i.cantidad*i.costo,0);
  const unidades=o.items.reduce((a,i)=>a+i.cantidad,0);
  const y0=pdfProHeader(doc,'ORDEN DE COMPRA', o.numero, o.fecha);
  const prov=[o.proveedor||'-'];
  const meta=[]; if(o.fecha) meta.push(['Emisión', o.fecha]); if(o.fechaEntrega) meta.push(['Entrega estimada', o.fechaEntrega]);
  const yp=pdfProParty(doc, y0, 'Proveedor', prov, meta);
  doc.autoTable({
    startY:yp+4,
    head:[['Cód. proveedor','Producto','Cant.','Costo unit.','Subtotal']],
    body:o.items.map(i=>{const p=productById(i.productId);return [p?(p.skuProveedor||p.sku):'-', p?productNameProveedor(p):'(producto)', String(i.cantidad), fmt(i.costo), fmt(i.cantidad*i.costo)];}),
    styles:{fontSize:9.5,cellPadding:3.5,lineColor:[245,233,225],lineWidth:0.1,textColor:[74,44,35]},
    headStyles:{fillColor:[125,72,54],textColor:[255,255,255],fontStyle:'bold'},
    alternateRowStyles:{fillColor:[247,250,247]},
    columnStyles:{0:{cellWidth:24},1:{fontStyle:'bold'},2:{halign:'center',cellWidth:18},3:{halign:'right',cellWidth:30},4:{halign:'right',cellWidth:30}},
    margin:{left:14,right:14}
  });
  const neto=Math.round(total/1.19); const iva=total-neto;
  let y=doc.lastAutoTable.finalY+10;
  doc.setFontSize(10); doc.setTextColor(147,86,64); doc.setFont('helvetica','bold'); doc.text('Total de unidades: '+unidades,14,y);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(150,150,150); doc.text('Valores en pesos chilenos, IVA incluido.',14,y+6);
  y=pdfProTotals(doc, y, [['Neto', fmt(neto)],['IVA (19%)', fmt(iva)]], 'Total', fmt(total));
  y+=6;
  if(o.notas){ y+=2; doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(125,72,54); doc.text('Notas',14,y); doc.setFont('helvetica','normal'); doc.setTextColor(90,90,90); doc.text(doc.splitTextToSize(o.notas,182),14,y+5); }
  pdfProFooter(doc, 'Orden de compra · '+new Date().toLocaleDateString('es-CL'));
  savePdfDoc(doc, 'orden-compra-'+o.numero+'.pdf');
}

let FINV=null; // factura en edición
function facturaEstadoCalc(f){
  if(f.estado==='pagado') return 'pagado';
  if(f.vencimiento && f.vencimiento < todayISO()) return 'vencida';
  return 'por_pagar';
}
function facturaEstadoPill(f){ const e=facturaEstadoCalc(f); return e==='pagado'?pill('Pagada','green'):e==='vencida'?pill('Vencida','red'):pill('Por pagar','amber'); }
// Formatea un RUT como 76.863.280-4
function formatRut(rut){
  if(!rut) return '';
  let s=String(rut).replace(/[.\-\s]/g,'').toUpperCase();
  if(s.length<2) return rut;
  const dv=s.slice(-1); let num=s.slice(0,-1);
  if(!/^\d+$/.test(num)) return rut;
  num=num.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return num+'-'+dv;
}
// Badge destacado con los días que faltan / lleva vencida
function diasVencBadge(f){
  if(f.estado==='pagado'||!f.vencimiento) return '';
  const d=Math.round((new Date(f.vencimiento)-new Date(todayISO()))/86400000);
  let cls,txt;
  if(d<0){ cls='bg-red-100 text-red-700'; txt='Vencida hace '+(-d)+' día'+(-d!==1?'s':''); }
  else if(d===0){ cls='bg-amber-100 text-amber-800'; txt='Vence hoy'; }
  else if(d<=7){ cls='bg-amber-100 text-amber-800'; txt='En '+d+' día'+(d!==1?'s':''); }
  else { cls='bg-clay-100 text-clay-600'; txt='En '+d+' día'+(d!==1?'s':''); }
  return `<span class="inline-block text-xs font-semibold px-2 py-0.5 rounded-full ${cls}">${txt}</span>`;
}

function subirAdjuntoFactura(tipo){
  if(!window.FB||!FB.saveBlob){ alert('Se requiere conexión con la base de datos.'); return; }
  syncFacturaForm();
  const inp=document.createElement('input');
  inp.type='file'; inp.accept= tipo==='factura'?'application/pdf':'application/pdf,image/*';
  inp.onchange=async ()=>{ const file=inp.files&&inp.files[0]; if(!file) return;
    const slot=document.getElementById('f_'+tipo+'_slot'); if(slot) slot.innerHTML='<div class="text-sm text-clay-400 py-2 text-center">Guardando… ⏳</div>';
    try{
      let dataUrl, mime=file.type||'application/octet-stream';
      if(file.type && file.type.startsWith('image/')){ dataUrl=await compressImage(file, 1500, 0.7); mime='image/jpeg'; }
      else { dataUrl=await fileToDataURL(file); }
      const approxBytes=Math.round((dataUrl.length-(dataUrl.indexOf(',')+1))*0.75);
      if(approxBytes > 850*1024){ alert('El archivo pesa demasiado para guardarlo ('+Math.round(approxBytes/1024)+' KB). Máximo ~850 KB.\nSi es una foto, tómala con menor resolución; si es un PDF, comprímelo antes de subirlo.'); renderFacturaModal(); return; }
      const fileId=uid('file');
      await FB.saveBlob(fileId, {data:dataUrl, name:file.name, mime, ts:Date.now()});
      const key=tipo==='factura'?'pdfFactura':'pdfPago';
      const prev=FINV[key]; if(prev&&prev.fileId&&FB.deleteBlob) FB.deleteBlob(prev.fileId);
      FINV[key]={fileId, name:file.name, mime};
      renderFacturaModal();
    }catch(e){ alert('No se pudo guardar el archivo.\n'+((e&&e.message)||'')); renderFacturaModal(); }
  };
  inp.click();
}
async function verAdjuntoFactura(fileId, name){
  if(!window.FB||!FB.loadBlob){ return; }
  try{
    const rec=await FB.loadBlob(fileId);
    if(!rec||!rec.data){ alert('No se encontró el archivo.'); return; }
    const blob=await (await fetch(rec.data)).blob();
    const file=new File([blob], name||rec.name||'archivo', {type:rec.mime||blob.type});
    if(isMobileDevice() && navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file], title:file.name}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
    const url=URL.createObjectURL(blob); window.open(url,'_blank');
  }catch(e){ alert('No se pudo abrir el archivo.'); }
}
function quitarAdjuntoFactura(tipo){
  syncFacturaForm();
  const key=tipo==='factura'?'pdfFactura':'pdfPago';
  const m=FINV[key];
  if(m&&m.fileId&&window.FB&&FB.deleteBlob) FB.deleteBlob(m.fileId);
  FINV[key]=null; renderFacturaModal();
}
function upsertSupplier(nombre, rut){
  if(!nombre) return; if(!DB.suppliers) DB.suppliers=[];
  const key=nombre.trim().toLowerCase();
  const ex=DB.suppliers.find(s=>(s.nombre||'').trim().toLowerCase()===key);
  if(ex){ if(rut) ex.rut=rut; }
  else DB.suppliers.push({nombre:nombre.trim(), rut:rut||''});
}
function saveFactura(){
  syncFacturaForm();
  if(!FINV.numero){ alert('Ingresa el número de factura.'); return; }
  if(!FINV.proveedor){ alert('Ingresa el proveedor.'); return; }
  if(FINV.estado==='pagado'&&!FINV.fechaPago) FINV.fechaPago=todayISO();
  if(FINV.rut) FINV.rut=formatRut(FINV.rut);
  upsertSupplier(FINV.proveedor, FINV.rut);
  const ix=DB.invoices.findIndex(x=>x.id===FINV.id);
  if(ix>=0) DB.invoices[ix]=FINV; else DB.invoices.push(FINV);
  if(FINV.ocId){ const oc=DB.orders.find(x=>x.id===FINV.ocId); if(oc){ oc.facturaId=FINV.id; oc.facturaNumero=FINV.numero; } }
  save(); closeModal();
  if(CURRENT==='facturas') renderFacturas(); else if(CURRENT==='compras') renderCompras();
}

function subirPagoFactura(id, reopenDetail){
  const f=DB.invoices.find(x=>x.id===id); if(!f) return;

    try{

      if(file.type && file.type.startsWith('image/')){ dataUrl=await compressImage(file, 1500, 0.7); mime='image/jpeg'; }
      else { dataUrl=await fileToDataURL(file); }
      const approxBytes=Math.round((dataUrl.length-(dataUrl.indexOf(',')+1))*0.75);
      if(approxBytes > 850*1024){ alert('El archivo pesa demasiado para guardarlo ('+Math.round(approxBytes/1024)+' KB). Máximo ~850 KB.'); return; }
      const fileId=uid('file');

function deleteFactura(id){
  if(!confirm('¿Eliminar esta factura? También se borrarán sus archivos adjuntos.')) return;
  const f=DB.invoices.find(x=>x.id===id);
  const otras=fid=>fid&&DB.invoices.some(x=>x.id!==id&&((x.pdfFactura&&x.pdfFactura.fileId===fid)||(x.pdfPago&&x.pdfPago.fileId===fid)));
  if(f){
    if(f.pdfFactura&&f.pdfFactura.fileId&&window.FB&&FB.deleteBlob&&!otras(f.pdfFactura.fileId)) FB.deleteBlob(f.pdfFactura.fileId);
    if(f.pdfPago&&f.pdfPago.fileId&&window.FB&&FB.deleteBlob&&!otras(f.pdfPago.fileId)) FB.deleteBlob(f.pdfPago.fileId);
  }
  DB.invoices=DB.invoices.filter(x=>x.id!==id);
  (DB.orders||[]).forEach(o=>{ if(o.facturaId===id){ delete o.facturaId; delete o.facturaNumero; } });
  save(); closeModal();
  if(CURRENT==='facturas') renderFacturas(); else if(CURRENT==='compras') renderCompras();
}
/* ==================== CONTABILIDAD ====================
   Módulo de contabilidad estilo Chipax, en 3 partes:
   · Plan de cuentas: catálogo de cuentas donde se clasifica cada egreso.
   · Egresos: unifica los gastos manuales + las facturas de compra, y permite
     clasificar cada uno a una cuenta (sin volver a digitarlos).
   · Resultado operacional (Parte 2): cruzará ventas y costos automáticamente.
   ===================================================== */
const CUENTA_GRUPOS = ['Costos Directos','Gastos de Operación','Marketing y Ventas','Remuneraciones','Administración','Impuestos','Otros'];
// Naturaleza de cada cuenta y cómo se comporta en el Resultado Operacional (que va NETO de IVA):
//  · mercaderia → compra de stock. NO afecta el resultado (su costo entra por el margen de la venta).
//  · costo      → costo directo operacional (ej: flete de despacho). Resta en el resultado, en monto neto.
//  · gasto      → gasto operacional fijo (sueldos, arriendo, publicidad). Resta en el resultado, en monto neto.
//  · impuesto   → IVA / SII. NO afecta el resultado (es un impuesto que se recauda/paga por cuenta del SII).
const TIPO_CUENTA = {
  mercaderia:{label:'Compra de mercadería (inventario)', corto:'Mercadería', pill:'blue',  afecta:false, hint:'Es inventario. No afecta el resultado: el costo del macetero ya entra por el margen cuando se vende.'},
  costo:     {label:'Costo directo',                    corto:'Costo directo', pill:'amber', afecta:true,  hint:'Costo que escala con las ventas (ej: flete de despacho). Resta en el resultado, en monto neto.'},
  gasto:     {label:'Gasto operacional',                corto:'Gasto',         pill:'gray',  afecta:true,  hint:'Gasto fijo del negocio (sueldos, arriendo, publicidad). Resta en el resultado, en monto neto.'},
  impuesto:  {label:'Impuesto (IVA / SII)',             corto:'Impuesto',      pill:'red',   afecta:false, hint:'El IVA es un impuesto que recaudas/pagas por cuenta del SII. No afecta el resultado (que va neto de IVA); es solo flujo de caja.'}
};
const tipoCuenta = t => TIPO_CUENTA[t] || TIPO_CUENTA.gasto;

// Ajusta planes ya guardados de versiones anteriores a la nueva naturaleza de cuentas.
function migrarCuentas(){
  let ch=false;
  (DB.cuentas||[]).forEach(c=>{

// Monto NETO (sin IVA) de un egreso, para el Resultado Operacional. Los documentos con IVA
// (facturas de compra o gastos con factura) se llevan a neto dividiendo por 1,19; los sin factura van completos.
function netoEgreso(e){
  const conIva = e.tipo==='factura' || (e.ref && e.ref.conFactura);
  return conIva ? Math.round((e.monto||0)/1.19) : (e.monto||0);
}
const mesLabel = p => { if(!p) return 'Todos los meses'; const m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; const [y,mm]=p.split('-'); return (m[parseInt(mm,10)-1]||mm)+' '+y; };
const egresoPeriodo = f => (f||'').slice(0,7);
// Lista unificada de egresos: gastos manuales (DB.egresos) + facturas de compra (DB.invoices).
function unifiedEgresos(){
  const out=[];
  (DB.egresos||[]).forEach(e=>out.push({tipo:'gasto', id:e.id, fecha:e.fecha, monto:e.monto||0, proveedor:e.proveedor||'', doc:e.numDoc||'', desc:e.descripcion||'', cuentaId:e.cuentaId||'', conFactura:!!e.conFactura, ref:e}));
  (DB.invoices||[]).forEach(f=>out.push({tipo:'factura', id:f.id, fecha:f.emision, monto:f.monto||0, proveedor:f.proveedor||'', doc:f.numero||'', desc:(f.notas||''), cuentaId:f.cuentaId||'', estado:f.estado, ref:f}));
  return out;
}
