function cuentaOptions(sel){
  const act=(DB.cuentas||[]).filter(c=>!c.archivada);
  const grupos=CUENTA_GRUPOS.filter(gr=>act.some(c=>c.grupo===gr));
  return '<option value="">— Sin clasificar —</option>'+grupos.map(gr=>`<optgroup label="${gr}">`+act.filter(c=>c.grupo===gr).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${c.nombre}</option>`).join('')+'</optgroup>').join('');
}
function clasificarEgreso(tipo,id,cuentaId){
  if(tipo==='gasto'){ const e=(DB.egresos||[]).find(x=>x.id===id); if(e) e.cuentaId=cuentaId||''; }
  else { const f=(DB.invoices||[]).find(x=>x.id===id); if(f) f.cuentaId=cuentaId||''; }
  save(); renderEgresos();
}

/* ---------- EGRESOS ---------- */
let EGR_MES=null;   // 'YYYY-MM' o '' para todos
let EGR_IVA='';     // '' todos | 'con' con IVA (factura) | 'sin' sin IVA
let EGR_EXCL=new Set(); // ids de egresos DESmarcados (excluidos de la selección)
let EGR_VISIBLE=[]; // [{id, monto}] de la lista visible actual, para recalcular la selección
let EGRE=null;      // egreso en edición
function setEgrMes(p){ EGR_MES=p; renderEgresos(); }
function setEgrIva(v){ EGR_IVA=v; renderEgresos(); }
const egresoConIva = e => e.tipo==='factura' || (e.ref && e.ref.conFactura);
// Selección de egresos: marcar/desmarcar y recalcular el monto seleccionado sin re-renderizar todo.
function toggleEgrSel(id){
  if(EGR_EXCL.has(id)) EGR_EXCL.delete(id); else EGR_EXCL.add(id);
  const r=document.getElementById('egr-row-'+id); if(r) r.classList.toggle('opacity-40', EGR_EXCL.has(id));
  actualizarTotalSel();
}
function actualizarTotalSel(){
  const sel=EGR_VISIBLE.filter(x=>!EGR_EXCL.has(x.id));
  const suma=sel.reduce((a,x)=>a+(x.monto||0),0);
  const mEl=document.getElementById('egr_sel_monto'); if(mEl) mEl.textContent=fmt(suma);
  const cEl=document.getElementById('egr_sel_count'); if(cEl) cEl.textContent=sel.length+' de '+EGR_VISIBLE.length+' egresos seleccionados';
}
function egrSelTodos(){ EGR_EXCL.clear(); renderEgresos(); }
function egrSelNinguno(){ EGR_VISIBLE.forEach(x=>EGR_EXCL.add(x.id)); renderEgresos(); }
function renderEgresos(){
  const v=document.getElementById('view');
  if(!DB.egresos) DB.egresos=[];
  if(!DB.cuentas||!DB.cuentas.length) DB.cuentas=seedCuentas();
  const all=unifiedEgresos();
  const periodos=[...new Set(all.map(e=>egresoPeriodo(e.fecha)).filter(Boolean))].sort().reverse();
  if(EGR_MES===null) EGR_MES = periodos[0]||todayISO().slice(0,7);
  const listMes=all.filter(e=> !EGR_MES || egresoPeriodo(e.fecha)===EGR_MES).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  const list=listMes.filter(e=> !EGR_IVA || (EGR_IVA==='con'?egresoConIva(e):!egresoConIva(e))); // filtro con/sin IVA solo para la lista
  EGR_VISIBLE=list.map(e=>({id:e.id, monto:e.monto||0}));
  const selList=list.filter(e=>!EGR_EXCL.has(e.id));
  const selSuma=selList.reduce((a,e)=>a+(e.monto||0),0);
  const total=listMes.reduce((a,e)=>a+(e.monto||0),0);
  const clasif=listMes.filter(e=>e.cuentaId), sinClasif=listMes.filter(e=>!e.cuentaId);
  // Lo que efectivamente entra al Resultado Operacional va NETO de IVA y solo si la cuenta afecta el resultado.
  const afectaList=clasif.filter(e=>{const c=cuentaById(e.cuentaId);return c&&tipoCuenta(c.tipo).afecta;});
  const noAfectaList=clasif.filter(e=>{const c=cuentaById(e.cuentaId);return c&&!tipoCuenta(c.tipo).afecta;});
  const gastoNeto=afectaList.reduce((a,e)=>a+netoEgreso(e),0);
  const flujoNoAfecta=noAfectaList.reduce((a,e)=>a+(e.monto||0),0);
  const row=e=>{
    const c=cuentaById(e.cuentaId);
    const tc=c?tipoCuenta(c.tipo):null;
    const afecta=tc?tc.afecta:true;
    const conIva=e.tipo==='factura'||(e.ref&&e.ref.conFactura);
    const accent=!e.cuentaId?'#d97706':(afecta?'#5f7f4d':'#94a3b8');
    const sel=!EGR_EXCL.has(e.id);
    return `<div id="egr-row-${e.id}" class="card p-0 overflow-hidden ${sel?'':'opacity-40'}">
      <div class="flex items-stretch">
        <div class="shrink-0" style="width:5px;background:${accent};"></div>
        <label class="flex items-center pl-3 pr-1 shrink-0 cursor-pointer" title="Incluir en el monto seleccionado"><input type="checkbox" ${sel?'checked':''} onchange="toggleEgrSel('${e.id}')" class="rounded w-4 h-4 accent-sage-600"></label>
        <div class="flex-1 min-w-0 p-3.5 flex flex-col sm:flex-row sm:items-center gap-3">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="font-semibold truncate">${e.proveedor||e.desc||'Gasto'}</span>
              ${e.tipo==='factura'?pill('Factura','blue'):pill('Gasto','gray')}
              ${e.tipo==='factura'&&e.estado!=='pagado'?pill('Por pagar','amber'):''}
              ${e.tipo==='gasto'&&e.conFactura?'<span title="Con factura">📄</span>':''}
              ${c&&!afecta?'<span class="text-[10px] text-clay-500 border border-clay-200 rounded px-1.5 py-0.5" title="No entra al resultado operacional; es solo flujo de caja">no afecta resultado</span>':''}
            </div>
            <div class="text-xs text-clay-500 mt-0.5">${fechaAmig(e.fecha)}${e.doc?' · Doc '+e.doc:''}${e.desc&&e.desc!==e.proveedor?' · '+e.desc:''}</div>
          </div>
          <div class="sm:w-56 shrink-0">
            <div class="text-[10px] text-clay-400 uppercase tracking-wide mb-0.5">Cuenta</div>
            <select onchange="clasificarEgreso('${e.tipo}','${e.id}',this.value)" class="w-full border ${e.cuentaId?'border-sage-300 bg-sage-50':'border-amber-300 bg-amber-50'} rounded-xl px-2 py-1.5 text-xs">${cuentaOptions(e.cuentaId)}</select>
          </div>
          <div class="sm:text-right shrink-0">
            <div class="font-bold text-lg whitespace-nowrap">${fmt(e.monto)}</div>
            <div class="text-[10px] text-clay-400">${conIva?'IVA incl · neto '+fmt(netoEgreso(e)):'sin IVA'}</div>
            ${e.tipo==='gasto'
              ? `<div class="flex gap-1.5 mt-1 sm:justify-end"><button onclick="openEgreso('${e.id}')" class="text-xs text-clay-600 border border-clay-200 hover:bg-clay-50 px-2 py-1 rounded-lg">Editar</button><button onclick="deleteEgreso('${e.id}')" class="text-xs text-red-600 border border-red-200 hover:bg-red-50 px-2 py-1 rounded-lg">Eliminar</button></div>`
              : `<button onclick="openFacturaDetail('${e.id}')" class="text-xs text-clay-600 border border-clay-200 hover:bg-clay-50 px-2 py-1 rounded-lg mt-1">Ver factura</button>`}
          </div>
        </div>
      </div>
    </div>`;
  };
  const mesSel=`<select onchange="setEgrMes(this.value)" class="border border-clay-200 rounded-xl px-3 py-2 text-sm bg-white">
    ${periodos.map(p=>`<option value="${p}" ${p===EGR_MES?'selected':''}>${mesLabel(p)}</option>`).join('')}
    <option value="" ${EGR_MES===''?'selected':''}>Todos los meses</option>
  </select>`;
  const ivaSel=`<select onchange="setEgrIva(this.value)" class="border ${EGR_IVA?'border-sage-300 bg-sage-50':'border-clay-200'} rounded-xl px-3 py-2 text-sm bg-white">
    <option value="" ${EGR_IVA===''?'selected':''}>Con y sin IVA</option>
    <option value="con" ${EGR_IVA==='con'?'selected':''}>Solo con IVA (factura)</option>
    <option value="sin" ${EGR_IVA==='sin'?'selected':''}>Solo sin IVA</option>
  </select>`;
  v.innerHTML=`
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
    ${statCard('Total del mes (flujo)', fmt(total), list.length+' movimiento'+(list.length!==1?'s':'')+' · con IVA','text-clay-800','Todo lo que salió de caja en el mes, con IVA incluido.')}
    ${statCard('Sin clasificar', fmt(sinClasif.reduce((a,e)=>a+(e.monto||0),0)), sinClasif.length+' pendiente'+(sinClasif.length!==1?'s':''), sinClasif.length?'text-amber-600':'text-clay-400')}
    ${statCard('Gastos y costos (neto)', fmt(gastoNeto), afectaList.length+' movimiento'+(afectaList.length!==1?'s':'')+' · afecta resultado','text-sage-600','Suma neta (sin IVA) de gastos y costos directos. Esto es lo que resta en el Resultado Operacional.')}
    ${statCard('Mercadería + IVA', fmt(flujoNoAfecta), 'no afecta resultado', 'text-clay-500','Compra de stock y pago de IVA: son flujo de caja, no entran al resultado (el costo del stock ya va por el margen).')}
  </div>
  <div class="card p-3 mb-4 bg-clay-50 border-clay-200 text-xs text-clay-600 leading-relaxed">
    Los montos se muestran <b>con IVA</b>, como en tus documentos. El <b>Resultado Operacional</b> (Parte 2) irá en <b>montos netos</b> (sin IVA). Además, la <b>compra de mercadería</b> y el <b>pago de IVA</b> no afectan el resultado: son flujo de caja. El costo de los maceteros entra al resultado por el <b>margen de cada venta</b>, no por la factura de compra.
  </div>
  <div class="flex items-center justify-between gap-2 mb-4 flex-wrap">
    <div class="flex items-center gap-2 flex-wrap"><span class="text-sm text-clay-500">Período:</span>${mesSel}<span class="text-sm text-clay-500 ml-1">IVA:</span>${ivaSel}</div>
    <div class="text-xs text-clay-400">Las facturas de compra aparecen aquí automáticamente. Clasifica cada egreso a una cuenta.</div>
  </div>
  ${EGR_IVA?`<div class="text-xs text-clay-500 mb-2.5">Mostrando <b>${list.length}</b> de ${listMes.length} egresos · ${EGR_IVA==='con'?'solo <b>con IVA</b> (factura)':'solo <b>sin IVA</b>'} · suma ${fmt(list.reduce((a,e)=>a+(e.monto||0),0))} <button onclick="setEgrIva('')" class="ml-1 text-clay-600 underline hover:text-clay-900">quitar filtro</button></div>`:''}
  ${list.length?`<div class="card p-4 mb-4 bg-sage-50 border-sage-200 flex flex-wrap items-center justify-between gap-3 sticky top-2 z-10">
    <div>
      <div class="text-xs text-clay-500 uppercase tracking-wide">Monto seleccionado</div>
      <div id="egr_sel_monto" class="text-3xl font-bold text-sage-700 leading-tight">${fmt(selSuma)}</div>
      <div id="egr_sel_count" class="text-xs text-clay-500 mt-0.5">${selList.length} de ${list.length} egresos seleccionados</div>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-xs text-clay-400 mr-1 hidden sm:inline">Destilda los que no quieras contar (SII, sueldos, etc.)</span>
      <button onclick="egrSelTodos()" class="text-xs font-medium border border-clay-300 bg-white hover:bg-clay-50 px-3 py-1.5 rounded-lg">Seleccionar todos</button>
      <button onclick="egrSelNinguno()" class="text-xs font-medium border border-clay-300 bg-white hover:bg-clay-50 px-3 py-1.5 rounded-lg">Ninguno</button>
    </div>
  </div>`:''}
  ${list.length===0
    ? emptyState({icon:'M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6', titulo:EGR_IVA?'Sin egresos con este filtro':'Sin egresos en este período', detalle:EGR_IVA?'Ningún egreso de este mes coincide con el filtro de IVA seleccionado.':'Agrega un gasto con "Nuevo gasto" o crea facturas de compra; aparecerán aquí para clasificarlas.', accion:`<button onclick="openEgreso()" class="bg-clay-700 hover:bg-clay-800 text-white text-sm font-semibold px-4 py-2 rounded-xl">+ Nuevo gasto</button>`})
    : `<div class="space-y-2.5">${list.map(row).join('')}</div>`}
  `;
}
function openEgreso(id, backRes){
  const e=id?(DB.egresos||[]).find(x=>x.id===id):null;
  EGRE = e ? {...e} : {id:uid('egr'), fecha:todayISO(), monto:0, proveedor:'', numDoc:'', descripcion:'', responsable:(SESSION&&SESSION.nombre)||'', cuentaId:'', conFactura:false};
  const nuevo=!e;
  modal(`
    <div class="p-5 border-b border-clay-100 sticky top-0 bg-white z-10">
      ${backRes?`<button onclick="resBack('${backRes}')" class="text-sm text-clay-600 hover:text-clay-900 font-medium flex items-center gap-1 mb-2">← Volver al detalle</button>`:''}
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold">${nuevo?'Nuevo gasto':'Editar gasto'}</h3>
        <button onclick="closeModal()" class="text-clay-400 hover:text-clay-700 text-xl">✕</button>
      </div>
    </div>
    <div class="p-5 space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs text-clay-500">Fecha</label><input id="eg_fecha" type="date" value="${EGRE.fecha||todayISO()}" class="w-full border border-clay-200 rounded-xl px-3 py-2 mt-1"></div>
        <div><label class="text-xs text-clay-500">Monto (lo que pagaste)</label><input id="eg_monto" type="text" inputmode="numeric" value="${milesIn(EGRE.monto)}" oninput="moneyInput(this);egNetoHint()" placeholder="0" class="w-full border border-clay-200 rounded-xl px-3 py-2 mt-1 text-right"></div>
      </div>
      <div><label class="text-xs text-clay-500">Proveedor / a quién se pagó</label><input id="eg_prov" value="${(EGRE.proveedor||'').replace(/"/g,'&quot;')}" placeholder="Ej: Bencinera, Contador, Feria..." class="w-full border border-clay-200 rounded-xl px-3 py-2 mt-1"></div>
      <div><label class="text-xs text-clay-500">Descripción</label><input id="eg_desc" value="${(EGRE.descripcion||'').replace(/"/g,'&quot;')}" placeholder="Ej: Bencina reparto Santiago" class="w-full border border-clay-200 rounded-xl px-3 py-2 mt-1"></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs text-clay-500">N° documento (opcional)</label><input id="eg_doc" value="${(EGRE.numDoc||'').replace(/"/g,'&quot;')}" placeholder="Boleta / factura N°" class="w-full border border-clay-200 rounded-xl px-3 py-2 mt-1"></div>
        <div><label class="text-xs text-clay-500">Responsable</label><input id="eg_resp" value="${(EGRE.responsable||'').replace(/"/g,'&quot;')}" class="w-full border border-clay-200 rounded-xl px-3 py-2 mt-1"></div>
      </div>
      <div><label class="text-xs text-clay-500">Cuenta contable</label><select id="eg_cuenta" class="w-full border border-clay-200 rounded-xl px-3 py-2 mt-1 bg-white">${cuentaOptions(EGRE.cuentaId)}</select></div>
      <div class="bg-clay-50 border border-clay-200 rounded-xl p-3">
        <label class="flex items-center gap-2 text-sm text-clay-700 font-medium"><input id="eg_conf" type="checkbox" onchange="egNetoHint()" ${EGRE.conFactura?'checked':''} class="rounded"> Tiene factura con IVA</label>
        <div id="eg_hint" class="text-xs text-clay-500 mt-1.5">${EGRE.monto?(EGRE.conFactura?'Con factura: se descuenta el IVA. Al resultado entra el neto <b>'+fmt(Math.round(EGRE.monto/1.19))+'</b>.':'Sin factura (boleta o sin documento): entra el <b>monto completo ('+fmt(EGRE.monto)+')</b>, sin descontar IVA.'):'Marca esta casilla solo si tienes factura afecta (con IVA recuperable). Si es boleta o no te dan documento, déjala en blanco y entra el monto completo.'}</div>
      </div>
    </div>
    <div class="p-5 border-t border-clay-100 flex justify-end gap-2 sticky bottom-0 bg-white">
      <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-clay-200 text-sm font-medium">Cancelar</button>
      <button onclick="saveEgreso()" class="bg-clay-700 hover:bg-clay-800 text-white font-semibold px-5 py-2 rounded-xl text-sm">Guardar gasto</button>
    </div>`);
}
function egNetoHint(){
  const mEl=document.getElementById('eg_monto'), cEl=document.getElementById('eg_conf'), el=document.getElementById('eg_hint');
  if(!el) return;
  const m=milesParse((mEl&&mEl.value)||'');
  if(!m){ el.innerHTML='Marca <b>Tiene factura con IVA</b> solo si tienes factura afecta. Si es boleta o no te dan documento, déjala en blanco y entra el monto completo.'; return; }
  el.innerHTML = (cEl&&cEl.checked)
    ? 'Con factura: se descuenta el IVA. Al resultado entra el neto <b>'+fmt(Math.round(m/1.19))+'</b>.'
    : 'Sin factura (boleta o sin documento): entra el <b>monto completo ('+fmt(m)+')</b>, sin descontar IVA.';
}
function saveEgreso(){
  const g=id=>document.getElementById(id);
  EGRE.fecha=g('eg_fecha').value||todayISO();
  EGRE.monto=milesParse(g('eg_monto').value);
  EGRE.proveedor=g('eg_prov').value.trim();
  EGRE.descripcion=g('eg_desc').value.trim();
  EGRE.numDoc=g('eg_doc').value.trim();
  EGRE.responsable=g('eg_resp').value.trim();
  EGRE.cuentaId=g('eg_cuenta').value;
  EGRE.conFactura=g('eg_conf').checked;
  if(!EGRE.monto){ alert('Ingresa el monto del gasto.'); return; }
  if(!EGRE.descripcion && !EGRE.proveedor){ alert('Ingresa una descripción o el proveedor.'); return; }
  const ix=(DB.egresos||[]).findIndex(x=>x.id===EGRE.id);
  if(ix>=0) DB.egresos[ix]=EGRE; else { EGRE.creadoAt=Date.now(); DB.egresos.push(EGRE); }
  save(); closeModal(); EGR_MES=egresoPeriodo(EGRE.fecha); if(CURRENT==='egresos') renderEgresos();
}
function deleteEgreso(id){
  const e=(DB.egresos||[]).find(x=>x.id===id); if(!e) return;
  if(!confirm('¿Eliminar este gasto ('+fmt(e.monto)+')?')) return;
  DB.egresos=DB.egresos.filter(x=>x.id!==id);
  save(); if(CURRENT==='egresos') renderEgresos();
  toastInfo('Gasto eliminado');
}

/* ---------- PLAN DE CUENTAS ---------- */
let CTAE=null; // cuenta en edición
function renderPlanCuentas(){
  const v=document.getElementById('view');
  if(!DB.cuentas||!DB.cuentas.length) DB.cuentas=seedCuentas();
  const all=unifiedEgresos();
  const usoDe=cid=>all.filter(e=>e.cuentaId===cid);
  const grupos=CUENTA_GRUPOS.filter(gr=>(DB.cuentas||[]).some(c=>c.grupo===gr));
  const otros=(DB.cuentas||[]).filter(c=>!CUENTA_GRUPOS.includes(c.grupo));
  const gruposFull=[...grupos, ...(otros.length?['(otros)']:[])];
  const seccion=gr=>{
    const cuentas=(DB.cuentas||[]).filter(c=> gr==='(otros)' ? !CUENTA_GRUPOS.includes(c.grupo) : c.grupo===gr).filter(c=>!c.archivada);
    if(!cuentas.length) return '';
    const totGr=cuentas.reduce((a,c)=>a+usoDe(c.id).reduce((s,e)=>s+(e.monto||0),0),0);
    return `<div class="mb-5">
      <div class="flex items-center justify-between px-1 mb-2">
        <div class="text-xs font-semibold uppercase tracking-wider text-clay-500">${gr==='(otros)'?'Otros':gr}</div>
        <div class="text-xs text-clay-400">${fmt(totGr)}</div>
      </div>
      <div class="space-y-2">${cuentas.map(c=>{
        const n=usoDe(c.id).length, mt=usoDe(c.id).reduce((s,e)=>s+(e.monto||0),0);
        const tc=tipoCuenta(c.tipo);
        return `<div class="card p-3.5 flex items-center gap-3">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="font-semibold truncate">${c.nombre}</span>
              ${pill(tc.corto, tc.pill)}
              ${!tc.afecta?'<span class="text-[10px] text-clay-400 border border-clay-200 rounded px-1.5 py-0.5">no afecta resultado</span>':''}
            </div>
            <div class="text-xs text-clay-400 mt-0.5">Código ${c.codigo||'—'} · ${n} movimiento${n!==1?'s':''}${n?' · '+fmt(mt):''}</div>
          </div>
          <button onclick="openCuenta('${c.id}')" class="text-xs text-clay-600 border border-clay-200 hover:bg-clay-50 px-2.5 py-1.5 rounded-lg">Editar</button>
          <button onclick="deleteCuenta('${c.id}')" class="text-xs text-red-600 border border-red-200 hover:bg-red-50 px-2.5 py-1.5 rounded-lg">${n?'Archivar':'Eliminar'}</button>
        </div>`;
      }).join('')}</div>
    </div>`;
  };
  v.innerHTML=`
    <div class="card p-4 mb-5 bg-sage-50 border-sage-200">
      <div class="text-sm text-clay-700">Este es el <b>plan de cuentas sugerido</b> para tu negocio de maceteros. Cada egreso y cada factura de compra se clasifica a una de estas cuentas para poder ver en qué se va la plata. Puedes editar, crear o archivar cuentas según tu realidad.</div>
    </div>
    ${gruposFull.map(seccion).join('')}
  `;
}
function openCuenta(id){
  const c=id?(DB.cuentas||[]).find(x=>x.id===id):null;
  CTAE = c ? {...c} : {id:uid('cta'), codigo:'', nombre:'', grupo:'Gastos de Operación', tipo:'gasto', archivada:false};
  const nuevo=!c;
  const grupoOpts=CUENTA_GRUPOS.map(gr=>`<option value="${gr}" ${gr===CTAE.grupo?'selected':''}>${gr}</option>`).join('');
  modal(`
    <div class="p-5 border-b border-clay-100 flex items-center justify-between sticky top-0 bg-white z-10">
      <h3 class="text-lg font-bold">${nuevo?'Nueva cuenta':'Editar cuenta'}</h3>
      <button onclick="closeModal()" class="text-clay-400 hover:text-clay-700 text-xl">✕</button>
    </div>
    <div class="p-5 space-y-4">
      <div><label class="text-xs text-clay-500">Nombre de la cuenta</label><input id="ct_nombre" value="${(CTAE.nombre||'').replace(/"/g,'&quot;')}" placeholder="Ej: Publicidad y redes" class="w-full border border-clay-200 rounded-xl px-3 py-2 mt-1"></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs text-clay-500">Código (opcional)</label><input id="ct_codigo" value="${(CTAE.codigo||'').replace(/"/g,'&quot;')}" placeholder="Ej: 6100" class="w-full border border-clay-200 rounded-xl px-3 py-2 mt-1"></div>
        <div><label class="text-xs text-clay-500">Tipo</label><select id="ct_tipo" onchange="document.getElementById('ct_tipo_hint').textContent=({mercaderia:'${TIPO_CUENTA.mercaderia.hint}',costo:'${TIPO_CUENTA.costo.hint}',gasto:'${TIPO_CUENTA.gasto.hint}',impuesto:'${TIPO_CUENTA.impuesto.hint}'})[this.value]||''" class="w-full border border-clay-200 rounded-xl px-3 py-2 mt-1 bg-white">${Object.keys(TIPO_CUENTA).map(k=>`<option value="${k}" ${CTAE.tipo===k?'selected':''}>${TIPO_CUENTA[k].label}</option>`).join('')}</select></div>
      </div>
      <div><label class="text-xs text-clay-500">Grupo</label><select id="ct_grupo" class="w-full border border-clay-200 rounded-xl px-3 py-2 mt-1 bg-white">${grupoOpts}</select></div>
      <p id="ct_tipo_hint" class="text-xs text-clay-400">${tipoCuenta(CTAE.tipo).hint}</p>
    </div>
    <div class="p-5 border-t border-clay-100 flex justify-end gap-2 sticky bottom-0 bg-white">
      <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-clay-200 text-sm font-medium">Cancelar</button>
      <button onclick="saveCuenta()" class="bg-clay-700 hover:bg-clay-800 text-white font-semibold px-5 py-2 rounded-xl text-sm">Guardar cuenta</button>
    </div>`);
}
function saveCuenta(){
  const g=id=>document.getElementById(id);
  CTAE.nombre=g('ct_nombre').value.trim();
  CTAE.codigo=g('ct_codigo').value.trim();
  CTAE.tipo=g('ct_tipo').value;
  CTAE.grupo=g('ct_grupo').value;
  if(!CTAE.nombre){ alert('Ingresa el nombre de la cuenta.'); return; }
  const ix=(DB.cuentas||[]).findIndex(x=>x.id===CTAE.id);
  if(ix>=0) DB.cuentas[ix]=CTAE; else DB.cuentas.push(CTAE);
  save(); closeModal(); if(CURRENT==='plancuentas') renderPlanCuentas();
}
function deleteCuenta(id){
  const c=(DB.cuentas||[]).find(x=>x.id===id); if(!c) return;
  const usados=unifiedEgresos().filter(e=>e.cuentaId===id).length;
  if(usados){
    if(!confirm('La cuenta "'+c.nombre+'" tiene '+usados+' movimiento'+(usados!==1?'s':'')+' clasificado'+(usados!==1?'s':'')+'. No se puede eliminar, pero se puede archivar para que deje de aparecer al clasificar. ¿Archivarla?')) return;
    c.archivada=true;
  } else {
    if(!confirm('¿Eliminar la cuenta "'+c.nombre+'"?')) return;
    DB.cuentas=DB.cuentas.filter(x=>x.id!==id);
  }
  save(); if(CURRENT==='plancuentas') renderPlanCuentas();
}

/* ---------- RESULTADO OPERACIONAL ----------
   Estado de resultados NETO de IVA, por mes (según fecha del pedido, devengado):
     Ventas netas (÷1,19)  −  Costo de venta (del margen)  =  Margen bruto
     −  Costos directos y gastos operacionales clasificados (neto)  =  Resultado operacional
   La compra de mercadería y el pago de IVA no entran (son flujo de caja). */
let RES_MES=null;
function setResMes(p){ RES_MES=p; renderResultado(); }
function renderResultado(){
  const v=document.getElementById('view');
  if(!DB.cuentas||!DB.cuentas.length) DB.cuentas=seedCuentas();
  const ventasAll=(DB.sales||[]).filter(s=>!s.perdido);
  const egr=unifiedEgresos();
  const periodos=[...new Set([...ventasAll.map(s=>egresoPeriodo(s.fecha)), ...egr.map(e=>egresoPeriodo(e.fecha))].filter(Boolean))].sort().reverse();
  if(RES_MES===null) RES_MES = periodos[0]||todayISO().slice(0,7);
  const mes=RES_MES;
  // --- Ventas y costo de venta (del margen) ---
  const ventasMes=ventasAll.filter(s=>egresoPeriodo(s.fecha)===mes);
  const ventasBrutas=ventasMes.reduce((a,s)=>a+saleTotal(s),0);   // con IVA (incluye envío)
  const ventasNetas=Math.round(ventasBrutas/1.19);
  const envioBruto=ventasMes.reduce((a,s)=>a+(s.costoEnvio||0),0);   // lo que se cobra al cliente por despacho (con IVA)
  const envioNeto=Math.round(envioBruto/1.19);
  const ventasProdNeto=ventasNetas-envioNeto;                        // ventas de productos = ventas netas − ingreso por despacho
  const costoVentaBruto=ventasMes.reduce((a,s)=>a+saleCost(s),0); // costo con IVA (como se ingresa en el producto)
  const costoVenta=Math.round(costoVentaBruto/1.19);              // neteado ÷1,19 para comparar con ventas netas
  const margenBruto=ventasNetas-costoVenta;
  // --- Egresos clasificados del mes (neto) ---
  const egrMes=egr.filter(e=>egresoPeriodo(e.fecha)===mes);
  const afecta=egrMes.filter(e=>{const c=cuentaById(e.cuentaId);return c&&tipoCuenta(c.tipo).afecta;});
  const sinClasif=egrMes.filter(e=>!e.cuentaId);
  const noAfecta=egrMes.filter(e=>{const c=cuentaById(e.cuentaId);return c&&!tipoCuenta(c.tipo).afecta;});
  const sinClasifMonto=sinClasif.reduce((a,e)=>a+(e.monto||0),0);
  const noAfectaMonto=noAfecta.reduce((a,e)=>a+(e.monto||0),0);
  // Neto por cuenta (solo cuentas que afectan resultado)
  const netoCuenta={};
  afecta.forEach(e=>{ netoCuenta[e.cuentaId]=(netoCuenta[e.cuentaId]||0)+netoEgreso(e); });
  const costosDir=(DB.cuentas||[]).filter(c=>c.tipo==='costo' && netoCuenta[c.id]);
  const totCostosDir=costosDir.reduce((a,c)=>a+netoCuenta[c.id],0);
  const gruposGasto=CUENTA_GRUPOS.filter(gr=>(DB.cuentas||[]).some(c=>c.grupo===gr && c.tipo==='gasto' && netoCuenta[c.id]));
  const totGastos=(DB.cuentas||[]).filter(c=>c.tipo==='gasto').reduce((a,c)=>a+(netoCuenta[c.id]||0),0);
  const resultado=margenBruto-totCostosDir-totGastos;
  const pct=(x)=> ventasNetas? Math.round(x/ventasNetas*100):0;
  const line=(label,val,o={})=>`<div ${o.click?`onclick="${o.click}" title="Ver detalle"`:''} class="flex justify-between items-baseline py-1.5 ${o.border?'border-t border-clay-200 mt-1 pt-2':''} ${o.click?'cursor-pointer hover:bg-clay-50 -mx-2 px-2 rounded-lg transition':''}">
      <span class="${o.indent?'pl-4 text-sm text-clay-500':(o.bold?'font-bold':o.strong?'font-semibold':'')}">${label}${o.click?' <span class="text-clay-300">›</span>':''}</span>
      <span class="tabular-nums whitespace-nowrap ${o.bold?'font-bold text-base':o.strong?'font-semibold':''} ${o.color||''}">${o.neg&&val>0?'('+fmt(val)+')':fmt(val)}</span>
    </div>`;
  const cuentaLine=c=>line(c.nombre, netoCuenta[c.id], {indent:true, click:`openCuentaDetalle('${c.id}')`});
  const mesSel=`<select onchange="setResMes(this.value)" class="border border-clay-200 rounded-xl px-3 py-2 text-sm bg-white">
    ${periodos.map(p=>`<option value="${p}" ${p===mes?'selected':''}>${mesLabel(p)}</option>`).join('')}
    ${periodos.length?'':`<option value="${mes}" selected>${mesLabel(mes)}</option>`}
  </select>`;
  const resColor=resultado>=0?'text-sage-700':'text-red-600';
  v.innerHTML=`
  <div class="flex items-center justify-between gap-2 mb-4 flex-wrap">
    <div class="flex items-center gap-2"><span class="text-sm text-clay-500">Mes:</span>${mesSel}</div>
    <div class="text-xs text-clay-400">Neto de IVA · según fecha del pedido · <span class="text-clay-500">toca una tarjeta o una línea para ver su detalle ›</span></div>
  </div>
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-5">
    ${resCard('Ventas netas', fmt(ventasNetas), ventasMes.length+' pedido'+(ventasMes.length!==1?'s':''),'text-clay-800','ventas')}
    ${resCard('Margen bruto', fmt(margenBruto), pct(margenBruto)+'% de ventas','text-sage-600','margen')}
    ${resCard('Costos + gastos', fmt(totCostosDir+totGastos), afecta.length+' egreso'+(afecta.length!==1?'s':'')+' (neto)','text-clay-700','costos')}
    ${resCard('Resultado operacional', fmt(resultado), pct(resultado)+'% de ventas', resColor,'resultado')}
  </div>
  <div class="card p-5 max-w-2xl">
    <div class="text-xs font-semibold uppercase tracking-wider text-clay-500 mb-2">Estado de resultados · ${mesLabel(mes)}</div>
    ${line('Ventas de productos', ventasProdNeto, {click:`resDetalle('ventas')`})}
    ${envioNeto?line('Ingreso por despachos', envioNeto, {click:`resDetalle('despachos')`}):''}
    ${line('Ventas netas', ventasNetas, {strong:true, border:true, click:`resDetalle('ventas')`})}
    ${line('Costo de venta (productos vendidos)', costoVenta, {neg:true, color:'text-clay-600', click:`resDetalle('margen')`})}
    ${line('Margen bruto', margenBruto, {border:true, strong:true, color:'text-sage-700', click:`resDetalle('margen')`})}
    ${costosDir.length?`<div class="text-[11px] uppercase tracking-wide text-clay-400 mt-3 mb-0.5">Costos directos</div>${costosDir.map(cuentaLine).join('')}${line('Total costos directos', totCostosDir, {neg:true, strong:true, color:'text-clay-600', click:`resDetalle('costos')`})}`:''}
    ${gruposGasto.map(gr=>{
      const cuentas=(DB.cuentas||[]).filter(c=>c.grupo===gr && c.tipo==='gasto' && netoCuenta[c.id]);
      return `<div class="text-[11px] uppercase tracking-wide text-clay-400 mt-3 mb-0.5">${gr}</div>${cuentas.map(cuentaLine).join('')}`;
    }).join('')}
    ${totGastos?line('Total gastos operacionales', totGastos, {neg:true, strong:true, color:'text-clay-600', click:`resDetalle('costos')`}):''}
    ${line('Resultado operacional', resultado, {border:true, bold:true, color:resColor, click:`resDetalle('resultado')`})}
    <div class="text-right text-xs text-clay-400 mt-0.5">${pct(resultado)}% sobre ventas netas</div>
  </div>
  ${sinClasif.length?`<div class="card p-3.5 mt-4 bg-amber-50 border-amber-200 flex items-center justify-between gap-3 max-w-2xl">
    <div class="text-sm text-amber-800">Tienes <b>${sinClasif.length}</b> egreso${sinClasif.length!==1?'s':''} sin clasificar este mes (${fmt(sinClasifMonto)}) que aún no entran al resultado.</div>
    <button onclick="go('egresos')" class="shrink-0 text-xs font-semibold text-amber-800 bg-white border border-amber-300 hover:bg-amber-100 px-3 py-1.5 rounded-lg">Clasificar</button>
  </div>`:''}
  <div class="text-xs text-clay-400 mt-4 max-w-2xl leading-relaxed space-y-1">
    <div>• <b>No incluidos (flujo de caja):</b> compra de mercadería y pago de IVA${noAfectaMonto?' ('+fmt(noAfectaMonto)+' este mes)':''}. No afectan el resultado; el costo de los productos ya entra por el margen.</div>
    <div>• <b>Supuestos:</b> ventas con IVA neteadas ÷1,19 (incluye envío); costo de venta tomado del costo de cada producto (con IVA) y también neteado ÷1,19; gastos y costos <b>con factura</b> llevados a neto ÷1,19; gastos <b>sin factura</b> (boleta o sin documento) entran por su <b>monto completo</b>. Todo queda comparable.</div>
  </div>
  `;
}
// Tarjeta clickeable del Resultado: abre el detalle de esa cifra.
const resCard=(label,value,sub,color,which)=>`<div onclick="resDetalle('${which}')" class="cursor-pointer transition hover:-translate-y-0.5 hover:ring-2 hover:ring-clay-300 rounded-2xl" title="Clic para ver el detalle">${statCard(label,value,sub,color)}</div>`;
const TITULO_RES={ventas:'Detalle de ventas netas', margen:'Detalle de margen bruto', costos:'Detalle de costos y gastos', resultado:'Detalle del resultado operacional', despachos:'Ingreso y margen por despachos'};
// Botón "volver" de los detalles: si el destino es una cuenta (cta-*) reabre esa cuenta; si no, la tarjeta del Resultado.
function resBack(k){ if(!k) return; if(String(k).indexOf('cta-')===0){ openCuentaDetalle(k); } else { resDetalle(k); } }
// Detalle de una línea/cuenta del Estado de Resultados: lista los egresos de esa cuenta en el mes (RES_MES), cada uno clickeable.
function openCuentaDetalle(cuentaId){
  const mes=RES_MES||todayISO().slice(0,7);
  const c=cuentaById(cuentaId);
  const items=unifiedEgresos().filter(e=>e.cuentaId===cuentaId && egresoPeriodo(e.fecha)===mes).slice().sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
  const totNeto=items.reduce((a,e)=>a+netoEgreso(e),0);
  const totBruto=items.reduce((a,e)=>a+(e.monto||0),0);
  const head=`<div class="p-5 border-b border-clay-100 sticky top-0 bg-white z-10"><div class="flex items-center justify-between"><div><h3 class="text-lg font-bold">${c?c.nombre:'Cuenta'}</h3><div class="text-xs text-clay-400 mt-0.5">${mesLabel(mes)} · ${items.length} egreso${items.length!==1?'s':''}</div></div><button onclick="closeModal()" class="text-clay-400 hover:text-clay-700 text-xl">✕</button></div></div>`;
  const foot=`<div class="p-4 border-t border-clay-100 flex justify-end sticky bottom-0 bg-white"><button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-clay-200 text-sm font-medium">Cerrar</button></div>`;
  let body;
  if(!items.length){ body='<div class="p-6 text-sm text-clay-500">No hay egresos en esta cuenta este mes.</div>'; }
  else{
    const rows=items.map(e=>{
      const conIva=e.tipo==='factura'||(e.ref&&e.ref.conFactura);
      const onc=e.tipo==='gasto'?`openEgreso('${e.id}','${cuentaId}')`:`openFacturaDetail('${e.id}','${cuentaId}')`;
      return `<tr onclick="${onc}" class="border-t border-clay-100 cursor-pointer hover:bg-clay-50"><td class="px-4 py-2">${fechaAmig(e.fecha)}</td><td class="px-4 py-2 text-clay-700">${e.proveedor||e.desc||'Gasto'} <span class="text-clay-300">›</span></td><td class="px-4 py-2 text-center text-[11px] text-clay-500">${conIva?'con factura':'sin factura'}</td><td class="px-4 py-2 text-right text-clay-400">${fmt(e.monto)}</td><td class="px-4 py-2 text-right font-medium">${fmt(netoEgreso(e))}</td></tr>`;
    }).join('');
    body=`<div class="p-5 overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-xs text-clay-400 text-left"><th class="px-4 py-2 font-medium">Fecha</th><th class="px-4 py-2 font-medium">Proveedor</th><th class="px-4 py-2 text-center font-medium">Doc</th><th class="px-4 py-2 text-right font-medium">Pagado</th><th class="px-4 py-2 text-right font-medium">Neto</th></tr></thead><tbody>${rows}</tbody><tfoot><tr class="border-t-2 border-clay-200 font-bold"><td class="px-4 py-2" colspan="3">Total (${items.length})</td><td class="px-4 py-2 text-right text-clay-400">${fmt(totBruto)}</td><td class="px-4 py-2 text-right text-clay-800">${fmt(totNeto)}</td></tr></tfoot></table><div class="text-xs text-clay-400 mt-3">Lo <b>con factura</b> entra neto (÷1,19); lo <b>sin factura</b> entra completo.</div></div>`;
  }
  modal(head+body+foot);
}
// Modal con el desglose de cada tarjeta del Resultado Operacional, para el mes seleccionado (RES_MES).
function resDetalle(which){
  const mes=RES_MES||todayISO().slice(0,7);
  const ventasMes=(DB.sales||[]).filter(s=>!s.perdido && egresoPeriodo(s.fecha)===mes);
  const egr=unifiedEgresos().filter(e=>egresoPeriodo(e.fecha)===mes);
  const afecta=egr.filter(e=>{const c=cuentaById(e.cuentaId);return c&&tipoCuenta(c.tipo).afecta;});
  const noAfecta=egr.filter(e=>{const c=cuentaById(e.cuentaId);return c&&!tipoCuenta(c.tipo).afecta;});
  const nombreCli=s=>{const c=clientById(s.clienteId);return c?c.nombre:(s.clienteNombre||'Cliente');};
  const head=`<div class="p-5 border-b border-clay-100 flex items-center justify-between sticky top-0 bg-white z-10"><div><h3 class="text-lg font-bold">${TITULO_RES[which]||'Detalle'}</h3><div class="text-xs text-clay-400 mt-0.5">${mesLabel(mes)}</div></div><button onclick="closeModal()" class="text-clay-400 hover:text-clay-700 text-xl">✕</button></div>`;
  const foot=`<div class="p-4 border-t border-clay-100 flex justify-end sticky bottom-0 bg-white"><button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-clay-200 text-sm font-medium">Cerrar</button></div>`;
  let body='';
  if(which==='ventas'){
    if(!ventasMes.length) body='<div class="p-6 text-sm text-clay-500">No hay ventas este mes.</div>';
    else{
      const rows=ventasMes.slice().sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')).map(s=>{
        const t=saleTotal(s), n=Math.round(t/1.19);
        return `<tr onclick="openSaleDetail('${s.id}',null,'ventas')" class="border-t border-clay-100 cursor-pointer hover:bg-clay-50"><td class="px-4 py-2">${fechaAmig(s.fecha)}</td><td class="px-4 py-2 text-clay-700">${nombreCli(s)} <span class="text-clay-300">›</span></td><td class="px-4 py-2 text-right text-clay-400">${fmt(t)}</td><td class="px-4 py-2 text-right font-semibold">${fmt(n)}</td></tr>`;
      }).join('');
      const totT=ventasMes.reduce((a,s)=>a+saleTotal(s),0), totN=Math.round(totT/1.19);
      body=`<div class="p-5 overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-xs text-clay-400 text-left"><th class="px-4 py-2 font-medium">Fecha</th><th class="px-4 py-2 font-medium">Cliente</th><th class="px-4 py-2 text-right font-medium">Con IVA</th><th class="px-4 py-2 text-right font-medium">Neto</th></tr></thead><tbody>${rows}</tbody><tfoot><tr class="border-t-2 border-clay-200 font-bold"><td class="px-4 py-2" colspan="2">Total (${ventasMes.length})</td><td class="px-4 py-2 text-right text-clay-400">${fmt(totT)}</td><td class="px-4 py-2 text-right text-clay-800">${fmt(totN)}</td></tr></tfoot></table><div class="text-xs text-clay-400 mt-3">Las ventas entran al resultado <b>netas de IVA</b> (÷1,19) e incluyen el envío.</div></div>`;
    }
  }
  else if(which==='margen'){
    const vn=Math.round(ventasMes.reduce((a,s)=>a+saleTotal(s),0)/1.19);
    const cv=Math.round(ventasMes.reduce((a,s)=>a+saleCost(s),0)/1.19);
    const rows=ventasMes.slice().sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')).map(s=>{
      const n=Math.round(saleTotal(s)/1.19), c=Math.round(saleCost(s)/1.19), m=n-c;
      return `<tr onclick="openSaleDetail('${s.id}',null,'margen')" class="border-t border-clay-100 cursor-pointer hover:bg-clay-50"><td class="px-4 py-2">${fechaAmig(s.fecha)}</td><td class="px-4 py-2 text-clay-700">${nombreCli(s)} <span class="text-clay-300">›</span></td><td class="px-4 py-2 text-right">${fmt(n)}</td><td class="px-4 py-2 text-right text-clay-400">${fmt(c)}</td><td class="px-4 py-2 text-right font-semibold text-sage-600">${fmt(m)}</td></tr>`;
    }).join('');
    body=`<div class="p-5 overflow-x-auto">
      <div class="grid grid-cols-3 gap-3 mb-4 text-center">
        <div class="bg-clay-50 rounded-xl p-3"><div class="text-[11px] text-clay-500">Ventas netas</div><div class="font-bold">${fmt(vn)}</div></div>
        <div class="bg-clay-50 rounded-xl p-3"><div class="text-[11px] text-clay-500">− Costo venta (neto)</div><div class="font-bold text-clay-600">${fmt(cv)}</div></div>
        <div class="bg-sage-50 rounded-xl p-3"><div class="text-[11px] text-clay-500">= Margen bruto</div><div class="font-bold text-sage-600">${fmt(vn-cv)}</div></div>
      </div>
      ${ventasMes.length?`<table class="w-full text-sm"><thead><tr class="text-xs text-clay-400 text-left"><th class="px-4 py-2 font-medium">Fecha</th><th class="px-4 py-2 font-medium">Cliente</th><th class="px-4 py-2 text-right font-medium">Venta neta</th><th class="px-4 py-2 text-right font-medium">Costo neto</th><th class="px-4 py-2 text-right font-medium">Margen</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="text-sm text-clay-500">No hay ventas este mes.</div>'}
      <div class="text-xs text-clay-400 mt-3">Margen bruto = ventas netas − costo de los productos vendidos (ambos sin IVA).</div>
    </div>`;
  }
  else if(which==='despachos'){
    const conEnvio=ventasMes.filter(s=>(s.costoEnvio||0)>0).slice().sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
    const envBrutoTot=ventasMes.reduce((a,s)=>a+(s.costoEnvio||0),0);
    const envNetoTot=Math.round(envBrutoTot/1.19);
    // Fletes pagados del mes: egresos afectos cuya cuenta es de fletes/despachos/reparto.
    const fleteNeto=afecta.filter(e=>{const c=cuentaById(e.cuentaId);return c && /flete|despacho|repart/i.test(c.nombre);}).reduce((a,e)=>a+netoEgreso(e),0);
    const margenDesp=envNetoTot-fleteNeto;
    const rows=conEnvio.map(s=>{
      const eb=s.costoEnvio||0, en=Math.round(eb/1.19);

      <div class="text-xs text-clay-400 mt-3">El <b>ingreso por despacho</b> es lo que le cobras al cliente por el envío (entra en Ventas netas, sin IVA). Los <b>fletes pagados</b> son lo que te cobra el transportista, en la cuenta "Fletes y despachos". La diferencia es tu <b>margen del despacho</b>.</div>
    </div>`;
  }
  else if(which==='costos'){
    if(!afecta.length) body='<div class="p-6 text-sm text-clay-500">No hay gastos ni costos clasificados este mes.</div>';
    else{
      const byCuenta={}; afecta.forEach(e=>{ (byCuenta[e.cuentaId]=byCuenta[e.cuentaId]||[]).push(e); });
      const bloques=Object.keys(byCuenta).map(cid=>{
        const c=cuentaById(cid); const items=byCuenta[cid].slice().sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
        const tot=items.reduce((a,e)=>a+netoEgreso(e),0);
        const rows=items.map(e=>{
          const conIva=e.tipo==='factura'||(e.ref&&e.ref.conFactura);
          const onc=e.tipo==='gasto'?`openEgreso('${e.id}','costos')`:`openFacturaDetail('${e.id}','costos')`;
          return `<tr onclick="${onc}" class="border-t border-clay-100 cursor-pointer hover:bg-clay-50"><td class="px-4 py-2">${fechaAmig(e.fecha)}</td><td class="px-4 py-2 text-clay-700">${e.proveedor||e.desc||'Gasto'} <span class="text-clay-300">›</span></td><td class="px-4 py-2 text-center text-[11px] text-clay-500">${conIva?'con factura':'sin factura'}</td><td class="px-4 py-2 text-right text-clay-400">${fmt(e.monto)}</td><td class="px-4 py-2 text-right font-medium">${fmt(netoEgreso(e))}</td></tr>`;
        }).join('');
        return `<div class="mb-4"><div class="flex justify-between items-baseline mb-1"><div class="font-semibold text-sm">${c?c.nombre:'(cuenta)'}</div><div class="font-bold text-sm">${fmt(tot)}</div></div><table class="w-full text-sm"><thead><tr class="text-[11px] text-clay-400 text-left"><th class="px-4 py-1 font-medium">Fecha</th><th class="px-4 py-1 font-medium">Proveedor</th><th class="px-4 py-1 text-center font-medium">Doc</th><th class="px-4 py-1 text-right font-medium">Pagado</th><th class="px-4 py-1 text-right font-medium">Neto</th></tr></thead><tbody>${rows}</tbody></table></div>`;
      }).join('');
      const totNeto=afecta.reduce((a,e)=>a+netoEgreso(e),0);
      body=`<div class="p-5 overflow-x-auto">${bloques}<div class="border-t-2 border-clay-200 pt-2 flex justify-between font-bold"><span>Total costos + gastos (neto)</span><span>${fmt(totNeto)}</span></div><div class="text-xs text-clay-400 mt-3">Lo <b>con factura</b> entra neto (÷1,19); lo <b>sin factura</b> entra completo. Solo se muestran las cuentas que afectan el resultado.</div></div>`;
    }
  }
  else{
    const vn=Math.round(ventasMes.reduce((a,s)=>a+saleTotal(s),0)/1.19);
    const cv=Math.round(ventasMes.reduce((a,s)=>a+saleCost(s),0)/1.19);
    const mb=vn-cv;
    const netoCuenta={}; afecta.forEach(e=>{netoCuenta[e.cuentaId]=(netoCuenta[e.cuentaId]||0)+netoEgreso(e);});
    const totCostosDir=(DB.cuentas||[]).filter(c=>c.tipo==='costo').reduce((a,c)=>a+(netoCuenta[c.id]||0),0);
    const totGastos=(DB.cuentas||[]).filter(c=>c.tipo==='gasto').reduce((a,c)=>a+(netoCuenta[c.id]||0),0);
    const res=mb-totCostosDir-totGastos;
    const noAfectaMonto=noAfecta.reduce((a,e)=>a+(e.monto||0),0);
    const rr=(l,val,o={})=>`<div class="flex justify-between py-1.5 ${o.strong?'border-t border-clay-200 mt-1 pt-2':''}"><span class="${o.strong?'font-semibold':''}">${l}</span><span class="tabular-nums ${o.strong?'font-semibold':''} ${o.color||''}">${o.neg&&val>0?'('+fmt(val)+')':fmt(val)}</span></div>`;
    body=`<div class="p-5">
      ${rr('Ventas netas',vn)}
      ${rr('Costo de venta',cv,{neg:true,color:'text-clay-600'})}
      ${rr('Margen bruto',mb,{strong:true,color:'text-sage-700'})}
      ${totCostosDir?rr('Costos directos',totCostosDir,{neg:true,color:'text-clay-600'}):''}
      ${totGastos?rr('Gastos operacionales',totGastos,{neg:true,color:'text-clay-600'}):''}
      ${rr('Resultado operacional',res,{strong:true,color:res>=0?'text-sage-700':'text-red-600'})}
      <div class="text-xs text-clay-400 mt-3">No incluye compra de mercadería ni pago de IVA${noAfectaMonto?' ('+fmt(noAfectaMonto)+' este mes)':''}: son flujo de caja, no afectan el resultado.</div>
    </div>`;
  }
  modal(head+body+foot);
}

let SIMPAGO=null;
function simularPago(){ SIMPAGO={sel:{}}; renderSimularPago(); }
function toggleSimSel(id,checked){ if(checked)SIMPAGO.sel[id]=true; else delete SIMPAGO.sel[id]; actualizarSimResumen(); }
function simSelectedFacturas(){ return Object.keys(SIMPAGO.sel).map(id=>DB.invoices.find(f=>f.id===id)).filter(Boolean); }
function copiarTexto(t){ t=String(t); const ok=()=>toastInfo('✓ Copiado'); if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(ok).catch(()=>fallbackCopy(t)); } else fallbackCopy(t); }
function fallbackCopy(t){ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); try{ document.execCommand('copy'); toastInfo('✓ Copiado'); }catch(e){ alert('Copia manualmente:\n'+t); } ta.remove(); }
function copiarMontoSim(){ const fs=simSelectedFacturas(); const total=fs.reduce((a,f)=>a+(f.monto||0),0); copiarTexto(String(total)); }
function copiarDetalleSim(){ const fs=simSelectedFacturas(); const total=fs.reduce((a,f)=>a+(f.monto||0),0); const txt=fs.map(f=>'Factura N° '+(f.numero||'')+' · '+(f.proveedor||'')+' · '+fmt(f.monto||0)).join('\n')+'\nTOTAL: '+fmt(total); copiarTexto(txt); }

      <button onclick="copiarMontoSim()" class="bg-clay-700 hover:bg-clay-800 text-white text-sm font-semibold px-4 py-2 rounded-xl whitespace-nowrap">📋 Copiar monto</button>

          <div id="pagoComprobanteSlot">
            ${m?`<div class="flex items-center justify-between gap-2"><span class="text-sm text-clay-700 truncate flex items-center gap-1.5">📎 ${m.name||'archivo'}</span><button type="button" onclick="quitarPagoComprobante()" class="text-xs text-red-500 hover:underline px-1">Quitar</button></div>`
              :`<button type="button" onclick="subirPagoComprobante()" class="w-full text-sm font-medium text-clay-700 bg-white hover:bg-clay-50 border border-dashed border-clay-300 px-3 py-2.5 rounded-lg flex items-center justify-center gap-2">⬆️ Subir comprobante</button>`}

function togglePagoSel(id, checked){ if(checked) PAGO.sel[id]=true; else delete PAGO.sel[id]; actualizarPagoTotal(); }
function actualizarPagoTotal(){
  const ids=Object.keys(PAGO.sel);
  const tot=ids.reduce((a,id)=>{const f=DB.invoices.find(x=>x.id===id);return a+(f?f.monto||0:0);},0);
  const t=document.getElementById('pagoTotal'); if(t) t.textContent=fmt(tot);
  const c=document.getElementById('pagoCount'); if(c) c.textContent=ids.length;
  const b=document.getElementById('pagoConfirm'); if(b) b.disabled=ids.length===0;
}
function subirPagoComprobante(){
  if(!window.FB||!FB.saveBlob){ alert('Se requiere conexión con la base de datos.'); return; }
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/pdf,image/*';
  inp.onchange=async ()=>{ const file=inp.files&&inp.files[0]; if(!file) return;
    const slot=document.getElementById('pagoComprobanteSlot'); if(slot) slot.innerHTML='<div class="text-sm text-clay-400 py-2 text-center">Guardando… ⏳</div>';
    try{
      let dataUrl, mime=file.type||'application/octet-stream';
      if(file.type && file.type.startsWith('image/')){ dataUrl=await compressImage(file,1500,0.7); mime='image/jpeg'; }
      else { dataUrl=await fileToDataURL(file); }
      const approxBytes=Math.round((dataUrl.length-(dataUrl.indexOf(',')+1))*0.75);
      if(approxBytes>850*1024){ alert('El archivo pesa demasiado ('+Math.round(approxBytes/1024)+' KB). Máximo ~850 KB.'); renderPagoMultiple(); return; }
      const fileId=uid('file');
      await FB.saveBlob(fileId,{data:dataUrl,name:file.name,mime,ts:Date.now()});
      PAGO.pdfPago={fileId,name:file.name,mime};
      renderPagoMultiple();
    }catch(e){ alert('No se pudo guardar el comprobante.\n'+((e&&e.message)||'')); renderPagoMultiple(); }
  };
  inp.click();
}
function quitarPagoComprobante(){ if(PAGO.pdfPago&&PAGO.pdfPago.fileId&&window.FB&&FB.deleteBlob) FB.deleteBlob(PAGO.pdfPago.fileId); PAGO.pdfPago=null; renderPagoMultiple(); }
function confirmarPagoMultiple(){
  const ids=Object.keys(PAGO.sel);
  if(ids.length===0){ alert('Selecciona al menos una factura.'); return; }
  const fechaEl=document.getElementById('pagoFecha'); const fecha=(fechaEl&&fechaEl.value)||todayISO();
  const tot=ids.reduce((a,id)=>{const f=DB.invoices.find(x=>x.id===id);return a+(f?f.monto||0:0);},0);
  if(!confirm('¿Registrar el pago de '+ids.length+' factura(s) por un total de '+fmt(tot)+' con fecha '+fecha+'?')) return;
  const pagoId=uid('pago');
  ids.forEach(id=>{ const f=DB.invoices.find(x=>x.id===id); if(!f) return; f.estado='pagado'; f.fechaPago=fecha; f.pagoId=pagoId; if(PAGO.pdfPago) f.pdfPago={fileId:PAGO.pdfPago.fileId,name:PAGO.pdfPago.name,mime:PAGO.pdfPago.mime}; });
  save(); closeModal(); if(CURRENT==='facturas') renderFacturas();
  toastInfo('✓ '+ids.length+' factura(s) pagadas · '+fmt(tot)+' · '+fecha);
}

function saveTask(){

  t.proveedor=g('t_prov')?g('t_prov').value.trim():'';

/* ===================== OFERTAS (recomendador de liquidación) ===================== */
let OFERTAS={view:'reco', preset:'sem', weeks:2, from:'', to:'', floor:0.20, override:{}, selected:{}, ofTitulo:'', ofValidez:'', ofCondiciones:'', _eff:{}, sort:{venta:{key:'vendidas',dir:'asc'}, stock:{key:'stock',dir:'desc'}}};
function setOfertasView(view){ OFERTAS.view=view; renderOfertas(); }
function toggleOfertaSel(pid){ if(OFERTAS.selected[pid]) delete OFERTAS.selected[pid]; else OFERTAS.selected[pid]=true; renderOfertas(); }
function limpiarSeleccionOfertas(){ OFERTAS.selected={}; renderOfertas(); }
/* ----- Campañas: una campaña guarda un set de productos en oferta y proyecta sus ventas ----- */
let CAMP_TAB='sim';
function abrirCampana(id){ CAMP_TAB='sim'; openCampana(id); }
function campProj(c){
  let unidades=0, ventas=0, costo=0, ventasNormal=0;
  (c.items||[]).forEach(it=>{ const q=Math.max(0,+it.cantProyectada||0); unidades+=q; ventas+=(it.precioOferta||0)*q; costo+=(it.costo||0)*q; ventasNormal+=(it.precio||0)*q; });
  return {unidades, ventas, costo, margen:ventas-costo, ventasNormal, descuento:ventasNormal-ventas, margenPct: ventas?(ventas-costo)/ventas:0, nProductos:(c.items||[]).length};
}
function campEstadoPill(e){ return e==='activa'?pill('Activa','green'):e==='cerrada'?pill('Cerrada','gray'):pill('Planificada','amber'); }
function guardarCampanaDesdeSeleccion(){
  const sel=Object.keys(OFERTAS.selected).filter(k=>OFERTAS.selected[k]);
  if(!sel.length){ toastInfo('Selecciona al menos un producto'); return; }
  const nombre=(OFERTAS.ofTitulo||'').trim();
  if(nombre){ _crearCampDesdeSel(nombre, sel); }
  else { promptModal({titulo:'Guardar como campaña', mensaje:'Ponle un nombre a la campaña.', placeholder:'Ej: Oferta junio', valor:'Campaña '+new Date().toLocaleDateString('es-CL'), confirmar:'Crear', onConfirm:(n)=>_crearCampDesdeSel((n||'').trim()||'Campaña sin nombre', sel)}); }
}
function _crearCampDesdeSel(nombre, sel){
  if(!DB.campaigns) DB.campaigns=[];
  const items=sel.map(pid=>{const p=productById(pid); if(!p) return null; const e=OFERTAS._eff[pid]||{precio:p.precioRef||0,discPct:0,precioOferta:p.precioRef||0}; const stk=stockOf(pid); return {productId:pid, precio:e.precio, descPct:e.discPct, precioOferta:e.precioOferta, costo:p.costo||0, cantProyectada: stk>0?stk:0};}).filter(Boolean);
  const c={ id:uid('camp'), nombre, estado:'planificada', fechaInicio:todayISO(), fechaFin:OFERTAS.ofValidez||'', condiciones:OFERTAS.ofCondiciones||'', items, createdAt:Date.now() };
  DB.campaigns.push(c); save();
  OFERTAS.selected={}; OFERTAS.view='campanas';
  toastInfo('✓ Campaña creada'); renderOfertas();
  setTimeout(()=>abrirCampana(c.id),120);
}
function setCampItemCant(campId,pid,val){ const c=(DB.campaigns||[]).find(x=>x.id===campId); if(!c) return; const it=c.items.find(i=>i.productId===pid); if(!it) return; it.cantProyectada=Math.max(0,Math.round(+val||0)); save(); openCampana(campId); }
function setCampItemDisc(campId,pid,val){ const c=(DB.campaigns||[]).find(x=>x.id===campId); if(!c) return; const it=c.items.find(i=>i.productId===pid); if(!it) return; const d=Math.max(0,Math.min(95,Math.round(+val||0))); it.descPct=d; it.precioOferta=Math.round((it.precio||0)*(1-d/100)); save(); openCampana(campId); }
function setCampItemPrecio(campId,pid,val){ const c=(DB.campaigns||[]).find(x=>x.id===campId); if(!c) return; const it=c.items.find(i=>i.productId===pid); if(!it) return; const pre=Math.max(0,milesParse(val)); it.precioOferta=pre; const precio=it.precio||0; it.descPct = precio? Math.max(0,Math.round((1-pre/precio)*100)) : 0; save(); openCampana(campId); }
function quitarCampItem(campId,pid){ const c=(DB.campaigns||[]).find(x=>x.id===campId); if(!c) return; c.items=c.items.filter(i=>i.productId!==pid); save(); openCampana(campId); }
function nuevaCampana(){
  if(!DB.campaigns) DB.campaigns=[];
  promptModal({titulo:'Nueva campaña', mensaje:'Ponle un nombre a la campaña.', placeholder:'Ej: Oferta junio', valor:'Campaña '+new Date().toLocaleDateString('es-CL'), confirmar:'Crear', onConfirm:(nombre)=>{
    const c={id:uid('camp'), nombre:(nombre||'').trim()||'Campaña sin nombre', estado:'planificada', fechaInicio:todayISO(), fechaFin:'', condiciones:'', items:[], createdAt:Date.now()};

  }});
}

function filterAddProd(){ const q=(document.getElementById('addProdQ')?.value||'').toLowerCase(); document.querySelectorAll('.addprow').forEach(el=>{ el.style.display=(!q||(el.dataset.text||'').includes(q))?'':'none'; }); }
function agregarProductoCampana(campId,pid){
  const c=(DB.campaigns||[]).find(x=>x.id===campId); if(!c) return;

function setCampEstado(campId,val){ const c=(DB.campaigns||[]).find(x=>x.id===campId); if(!c) return; c.estado=val; save(); if(isModalOpen())openCampana(campId); if(OFERTAS.view==='campanas')renderOfertas(); }

function deleteCampana(campId){ confirmModal({titulo:'Eliminar campaña',mensaje:'Se eliminará la campaña y su proyección. No se puede deshacer.',confirmar:'Eliminar',danger:true,icon:'🗑️',onConfirm:()=>{ DB.campaigns=(DB.campaigns||[]).filter(x=>x.id!==campId); save(); renderOfertas(); }}); }
function setCampTab(id,t){ CAMP_TAB=t; openCampana(id); }
function confirmarCampana(id){ const c=(DB.campaigns||[]).find(x=>x.id===id); if(!c) return; if(!(c.items||[]).length){ alert('Agrega al menos un producto antes de confirmar.'); return; } c.estado='activa'; save(); toastInfo('✓ Campaña confirmada'); CAMP_TAB='resumen'; openCampana(id); if(OFERTAS.view==='campanas')renderOfertas(); }

  const c=(DB.campaigns||[]).find(x=>x.id===id); if(!c) return;
  const pr=campProj(c);
  const mini=(t,v,col)=>`<div class="bg-clay-50 rounded-xl p-3 text-center"><div class="text-[11px] text-clay-500">${t}</div><div class="text-base font-bold ${col||''}">${v}</div></div>`;

  const tabBar=`<div class="flex gap-2">
    <button onclick="setCampTab('${id}','sim')" class="px-3 py-1.5 rounded-lg text-sm font-medium ${CAMP_TAB!=='resumen'?'bg-clay-700 text-white':'bg-white border border-clay-200 text-clay-600 hover:bg-clay-50'}">🧪 Simulación</button>
    <button onclick="setCampTab('${id}','resumen')" class="px-3 py-1.5 rounded-lg text-sm font-medium ${CAMP_TAB==='resumen'?'bg-clay-700 text-white':'bg-white border border-clay-200 text-clay-600 hover:bg-clay-50'}">📋 Resumen</button>
    <span class="ml-auto self-center">${campEstadoPill(c.estado)}</span>

function ofertaRec(p,u,floor){
  const precio=p.precioRef||0, costo=p.costo||0, stock=stockOf(p.id);
  if(!precio||!costo||stock<=0) return null;             // sin precio, sin costo o sin stock no se considera
  const minPrice=costo/(1-floor);                        // precio al que el margen sería exactamente el piso
  const maxDisc=1-minPrice/precio;                       // descuento máximo sin romper el piso
  if(maxDisc<0.05) return null;                          // casi no hay margen, no conviene ofertar
  let frac; if(u===0) frac=0.80; else if(u<=2) frac=0.55; else if(u<=5) frac=0.35; else frac=0.15; // si rota bien, igual una oferta suave si hay stock
  const over=(p.stockMin&&stock>=2*p.stockMin)||stock>=20; // empujar más fuerte si hay sobre-stock
  if(over) frac=Math.min(0.9,frac+0.15);
  let discPct=Math.round((maxDisc*frac*100)/5)*5;        // redondea a múltiplos de 5%
  discPct=Math.max(5,Math.min(Math.floor(maxDisc*100),discPct));
  return {discSug:discPct, maxDiscPct:Math.floor(maxDisc*100), stock, u, precio, costo, margenActPct:(precio-costo)/precio, slow:u<=5};
}
function ofertaEff(r){
  const ov=OFERTAS.override[r.p.id];
  const discPct=(ov!=null)?ov:r.discSug;
  const precioOferta=Math.round(r.precio*(1-discPct/100));
  const margenOfPct=precioOferta>0?(precioOferta-r.costo)/precioOferta:0;
  return {discPct, precioOferta, margenOfPct, margenOfDinero:precioOferta-r.costo, custom:ov!=null};
}
function ofertaSortVal(r,key){
  const e=ofertaEff(r);
  switch(key){
    case 'producto': return productName(r.p).toLowerCase();
    case 'vendidas': return r.u;
    case 'stock': return r.stock;
    case 'precio': return r.precio;
    case 'costo': return r.costo;
    case 'margenact': return r.margenActPct;
    case 'descuento': return e.discPct;
    case 'preciooferta': return e.precioOferta;
    case 'margenoferta': return e.margenOfPct;
    case 'stockval': return r.stock*r.costo;
    default: return 0;
  }
}
function sortRecs(list,st){ const dir=st.dir==='asc'?1:-1; return [...list].sort((a,b)=>{const va=ofertaSortVal(a,st.key),vb=ofertaSortVal(b,st.key); return (typeof va==='string')?va.localeCompare(vb)*dir:(va-vb)*dir;}); }

function renderTareas(){

  const all=[...DB.tasks];
  const abiertas=all.filter(t=>t.estado!=='completada');
  const enProg=all.filter(t=>t.estado==='en_progreso').length;
  const atrasadas=abiertas.filter(t=>t.fecha && t.fecha<todayISO()).length;
  const completadas=all.filter(t=>t.estado==='completada').length;
  // orden: abiertas por fecha (atrasadas/pronto primero), completadas por reciente
  const sortAb=(a,b)=>{const fa=a.fecha||'9999-99-99',fb=b.fecha||'9999-99-99';return fa.localeCompare(fb);};
  let lista;
  if(TASK_FILTER==='completada') lista=all.filter(t=>t.estado==='completada').sort((a,b)=>(b.completadaAt||0)-(a.completadaAt||0));
  else if(TASK_FILTER==='todas') lista=[...all].sort((a,b)=>{const pa=a.estado==='completada'?1:0,pb=b.estado==='completada'?1:0;return pa-pb||sortAb(a,b);});
  else if(TASK_FILTER==='en_progreso') lista=all.filter(t=>t.estado==='en_progreso').sort(sortAb);
  else if(TASK_FILTER==='atrasadas') lista=abiertas.filter(t=>t.fecha&&t.fecha<todayISO()).sort(sortAb);
  else lista=abiertas.sort(sortAb);
  // Tarjeta-botón que filtra, igual que en Presupuestos/Cobranzas. 'extra' agrega clases (ej: barra roja en Atrasadas).
  const fcard=(f,label,value,sub,color,ring,extra)=>`<button onclick="setTaskFilter('${f}')" class="card p-3 sm:p-5 text-left transition ${TASK_FILTER===f?'ring-2 '+ring:'hover:border-clay-300'} ${extra||''}"><div class="text-[11px] sm:text-sm text-clay-500 leading-tight">${label}</div><div class="text-lg sm:text-2xl font-bold mt-0.5 sm:mt-1 ${color||''}">${value}</div>${sub?`<div class="text-[10px] sm:text-xs text-clay-400 mt-0.5 sm:mt-1 leading-tight">${sub}</div>`:''}</button>`;
  const filtroLbl={abiertas:'pendientes',en_progreso:'en progreso',atrasadas:'atrasadas',completada:'completadas',todas:'todas'}[TASK_FILTER]||'';

    ${fcard('completada','Completadas',completadas,'',completadas?'text-sage-600':'text-clay-400','ring-sage-500')}
  </div>
  <div class="mb-4 flex flex-wrap items-center gap-3 text-sm text-clay-500 ${TASK_FILTER==='abiertas'?'hidden':''}">
    <span>Mostrando <b>${lista.length}</b> ${filtroLbl}</span>

// Movimientos de un producto en la bodega Casa Augusta: transferencias (+), ventas (−) y devoluciones (+).
function caStockMovements(productId){
  const moves=[];
  (DB.transfers||[]).forEach(t=>{ if(t.estado==='anulada') return; (t.items||[]).forEach(i=>{ if(i.productId===productId){ if(t.sentido==='aCentral') moves.push({fecha:t.fecha, orden:0, tipo:'Transferencia', detalle:'Enviado a central (Requínoa)', cantidad:-i.cantidad}); else moves.push({fecha:t.fecha, orden:0, tipo:'Transferencia', detalle:'Recibido desde central', cantidad:i.cantidad}); } }); });
  DB.purchases.forEach(c=>(c.items||[]).forEach(i=>{ if(i.productId===productId && i.bodega==='CA') moves.push({fecha:c.fecha, orden:0, tipo:'Compra', detalle:(c.proveedor||'Proveedor')+' · recepción directa', cantidad:i.cantidad}); }));
  DB.sales.forEach(s=>{ if(s.bodega!=='CA'||s.perdido) return; s.items.forEach(i=>{ if(i.productId===productId){ const c=clientById(s.clienteId); moves.push({fecha:s.fecha, orden:1, tipo:'Venta', detalle:(c?c.nombre:(s.clienteNombre||'Cliente')), cantidad:-i.cantidad}); }}); });
  (DB.caReturns||[]).forEach(r=>{ (r.items||[]).forEach(i=>{ if(i.productId===productId) moves.push({fecha:r.fecha, orden:1, tipo:'Devolución', detalle:r.clienteNombre||r.motivo||'Devolución', cantidad:i.cantidad}); }); });
  (DB.adjustmentsCA||[]).forEach(a=>{ if(a.productId===productId) moves.push({fecha:a.fecha, orden:2, tipo:'Ajuste', detalle:a.motivo||'Ajuste manual', cantidad:a.cantidad}); });
  moves.sort((a,b)=> (a.fecha||'').localeCompare(b.fecha||'') || a.orden-b.orden);
  let bal=0; moves.forEach(m=>{ bal+=m.cantidad; m.saldo=bal; });
  return moves;
}
// Trazabilidad de un producto en Casa Augusta (sin costos ni márgenes: pensada para la persona externa).

      </div>
      ${moves.length? `<div class="overflow-x-auto border border-clay-100 rounded-xl">

          ${moves.map(m=>`<tr class="border-t border-clay-100">

            <td class="px-4 py-2.5 text-right font-medium">${m.saldo}</td>
          </tr>`).join('')}

// Ajuste manual de inventario en Casa Augusta (conteo, merma, regalo, rotura...).
function openCAAdjust(pid){
  const p=productById(pid); if(!p) return;
  const actual=stockCA(pid);
  modal(`<div class="p-5 border-b border-clay-100 flex items-center justify-between"><div><h3 class="text-lg font-bold">Ajustar inventario</h3><div class="text-xs text-clay-400">Casa Augusta</div></div><button onclick="closeModal()" class="text-clay-400 hover:text-clay-700 text-xl">✕</button></div>
  <div class="p-5 space-y-3">

    <div class="bg-clay-50 rounded-xl px-3 py-2.5 flex items-center justify-between"><span class="text-sm text-clay-500">Stock actual en el sistema</span><span class="text-lg font-bold text-clay-800">${actual}</span></div>
    <div><label class="text-sm font-medium">Inventario real <span class="text-clay-400 font-normal">(lo que realmente hay)</span></label><input id="adjca_real" type="number" min="0" value="${actual}" oninput="caAdjPreview(${actual})" class="w-full border border-clay-200 rounded-xl px-3 py-2 mt-1"></div>
    <div id="adjca_diff" class="text-sm text-clay-400">La plataforma calculará el ajuste automáticamente.</div>
    <div><label class="text-sm font-medium">Motivo</label><input id="adjca_m" placeholder="Conteo, merma, rotura, regalo..." class="w-full border border-clay-200 rounded-xl px-3 py-2 mt-1"></div>
    <div class="text-[11px] text-clay-400">💡 Escribe cuántas unidades hay realmente en Casa Augusta y el sistema corrige el stock por ti. Queda registrado en la trazabilidad del producto.</div>
  </div>
  <div class="p-5 border-t border-clay-100 flex justify-end gap-2"><button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-clay-200">Cancelar</button><button onclick="saveCAAdjust('${pid}',${actual})" class="bg-clay-700 hover:bg-clay-800 text-white font-semibold px-5 py-2 rounded-xl">Aplicar</button></div>`);
  caAdjPreview(actual);
}
function caAdjPreview(actual){
  const el=document.getElementById('adjca_diff'); if(!el) return;
  const raw=(document.getElementById('adjca_real')||{}).value;
  const real=+raw;
  if(raw===''||!isFinite(real)){ el.className='text-sm text-clay-400'; el.textContent='La plataforma calculará el ajuste automáticamente.'; return; }
  const d=Math.round(real)-actual;
  if(d===0){ el.className='text-sm text-clay-400'; el.textContent='Sin cambios: el inventario ya coincide.'; }
  else if(d>0){ el.className='text-sm text-sage-700 font-medium'; el.innerHTML=`Ajuste: <b>+${d}</b> (entran ${d} unidad${d===1?'':'es'}).`; }
  else { el.className='text-sm text-red-600 font-medium'; el.innerHTML=`Ajuste: <b>−${Math.abs(d)}</b> (salen ${Math.abs(d)} unidad${Math.abs(d)===1?'':'es'}).`; }
}
function saveCAAdjust(pid,actual){
  const raw=(document.getElementById('adjca_real')||{}).value;
  const real=+raw;
  if(raw===''||!isFinite(real)||real<0){ alert('Escribe el inventario real (número válido)'); return; }
  const q=Math.round(real)-actual;
  if(!q){ closeModal(); return; }
  const motivo=((document.getElementById('adjca_m')||{}).value||'').trim();
  DB.adjustmentsCA.push({id:uid('aca'),productId:pid,cantidad:q,motivo:motivo,fecha:todayISO(),creadoPor:(SESSION.nombre||SESSION.email)});
  save(); closeModal(); go('ca_stock');
  toastInfo('✅ Inventario ajustado a '+Math.round(real)+' ('+(q>0?'+':'')+q+')');
}

function caTransferRow(it,ix){
  return `<div class="border border-clay-100 rounded-xl p-2.5 bg-clay-50/40"><div class="grid grid-cols-12 gap-2 items-center">
    <select onchange="onCATransferProd(${ix},this.value)" class="col-span-8 border border-clay-200 rounded-lg px-2 py-2 text-sm bg-white">${caTransferProdOpt(it.productId)}</select>

  </div></div>`;

function syncCATransfer(){ const f=document.getElementById('t_fecha'); if(f)EDITT.fecha=f.value; const n=document.getElementById('t_notas'); if(n)EDITT.notas=n.value; }
function onCATransferProd(ix,v){ EDITT.items[ix].productId=v; }
function onCATransferQty(ix,v){ EDITT.items[ix].cantidad=Math.max(1,+v||1); }
function addCATransferItem(){ syncCATransfer(); EDITT.items.push({productId:DB.products[0].id,cantidad:1}); document.getElementById('t_items').innerHTML=EDITT.items.map((it,ix)=>caTransferRow(it,ix)).join(''); }
function removeCATransferItem(ix){ if(EDITT.items.length<=1)return; syncCATransfer(); EDITT.items.splice(ix,1); document.getElementById('t_items').innerHTML=EDITT.items.map((it,ix)=>caTransferRow(it,ix)).join(''); }
function saveCATransfer(){
  syncCATransfer();
  const rev=!!EDITT.reverse;
  const items=EDITT.items.filter(i=>i.productId&&i.cantidad>0);
  if(!items.length){ alert('Agrega al menos un producto'); return; }
  if(rev){
    // Validar que Casa Augusta tenga stock suficiente para enviar a central
    const acc={}; items.forEach(i=>{ acc[i.productId]=(acc[i.productId]||0)+(+i.cantidad); });
    for(const pid in acc){ const disp=stockCA(pid); if(acc[pid]>disp){ const p=productById(pid); alert('Stock insuficiente en Casa Augusta para "'+(p?productNameCliente(p):pid)+'". Disponible: '+disp+', intentas enviar: '+acc[pid]+'.'); return; } }
  }

function stockCABaseVenta(productId){
  let base=stockCA(productId);
  if(EDITCA&&EDITCA.id){ const orig=DB.sales.find(x=>x.id===EDITCA.id); if(orig&&orig.bodega==='CA'&&!orig.perdido) orig.items.forEach(i=>{ if(i.productId===productId) base+=(i.cantidad||0); }); }
  return base;
}
function openCASale(id){
  const p0=DB.products[0];
  const s = id?DB.sales.find(x=>x.id===id):{id:null,fecha:todayISO(),clienteNombre:'',clienteTel:'',items:[{productId:p0.id,cantidad:1,precio:p0.precioRef}],pagado:false,docTipo:'pendiente',docNumero:'',bodega:'CA',caMetodo:'retiro_cliente',caCurrier:'',caEstado:'pendiente',notas:''};
  EDITCA=JSON.parse(JSON.stringify(s));
  if(!EDITCA.caMetodo) EDITCA.caMetodo='retiro_cliente';
  if(!EDITCA.caEstado) EDITCA.caEstado='pendiente';
  renderCASaleModal();
}
function caSaleProdOpt(sel){ return DB.products.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${productNameCliente(p)} · ${fmt(p.precioRef)} · CA ${stockCA(p.id)}</option>`).join(''); }
function caStockWarn(it){
  if(!it||!EDITCA) return '';
  const base=stockCABaseVenta(it.productId);
  const req=EDITCA.items.filter(x=>x.productId===it.productId).reduce((a,x)=>a+(+x.cantidad||0),0);
  if(req>base) return `<div class="text-[11px] text-red-600 font-medium mt-1.5 bg-red-50 border border-red-200 rounded-lg px-2 py-1">⚠️ Sin stock suficiente en Casa Augusta · disponible <b>${base}</b>, pedido <b>${req}</b>. Puedes registrar igualmente.</div>`;
  return '';
}
function refreshCAWarns(){ if(!EDITCA)return; EDITCA.items.forEach((it,ix)=>{ const el=document.getElementById('ca_warn_'+ix); if(el) el.innerHTML=caStockWarn(it); }); }
function caLineSubHtml(it){
  const desc=it.descuento||0; const sub=lineTotal(it);

    ? `<span class="text-sage-700">Subtotal: <span class="line-through text-clay-300">${fmt(it.cantidad*it.precio)}</span> → <b>${fmt(sub)}</b> · ${desc}% dcto</span>`

function syncCASale(){
  const g=id=>document.getElementById(id);
  if(g('ca_cli')) EDITCA.clienteNombre=g('ca_cli').value.trim();
  if(g('ca_tel')) EDITCA.clienteTel=g('ca_tel').value.trim();
  if(g('ca_fecha')) EDITCA.fecha=g('ca_fecha').value;
  if(g('ca_dir')) EDITCA.direccion=g('ca_dir').value.trim();
  if(g('ca_ciudad')) EDITCA.ciudad=g('ca_ciudad').value.trim();
  if(g('ca_comuna')) EDITCA.comuna=g('ca_comuna').value.trim();
  if(g('ca_pagado')) EDITCA.pagado=g('ca_pagado').value==='true';
  if(g('ca_doc')) EDITCA.docTipo=g('ca_doc').value;
  if(g('ca_docnum')) EDITCA.docNumero=g('ca_docnum').value;
  if(g('ca_pedidonum')) EDITCA.pedidoNum=g('ca_pedidonum').value.trim();
  if(g('ca_metodo')) EDITCA.caMetodo=g('ca_metodo').value;
  if(g('ca_currier')) EDITCA.caCurrier=g('ca_currier').value.trim();
  if(g('ca_seguimiento')) EDITCA.caSeguimiento=g('ca_seguimiento').value.trim();
  if(g('ca_estado')) EDITCA.caEstado=g('ca_estado').value;
  if(g('ca_notas')) EDITCA.notas=g('ca_notas').value;
}
function onCAMetodo(v){ const esC=v==='currier'; const w=document.getElementById('ca_currier_wrap'); if(w) w.classList.toggle('hidden', !esC); const sw=document.getElementById('ca_seguimiento_wrap'); if(sw) sw.classList.toggle('hidden', !esC); }
function onCASaleProd(ix,pid){ const p=productById(pid); EDITCA.items[ix].productId=pid; EDITCA.items[ix].precio=p.precioRef; refreshCASaleItems(); }
function onCASaleQty(ix,v){ EDITCA.items[ix].cantidad=Math.max(1,+v||1); updateCASaleLineSub(ix); updateCASaleTotal(); refreshCAWarns(); }
function onCASalePrice(ix,v){ EDITCA.items[ix].precio=+v||0; updateCASaleLineSub(ix); updateCASaleTotal(); }
function onCASaleDesc(ix,v){ let d=+v||0; d=Math.max(0,Math.min(100,d)); EDITCA.items[ix].descuento=d; updateCASaleLineSub(ix); updateCASaleTotal(); }
function updateCASaleLineSub(ix){ const el=document.getElementById('ca_sub_'+ix); if(el) el.innerHTML=caLineSubHtml(EDITCA.items[ix]); }
function addCASaleItem(){ syncCASale(); const p=DB.products[0]; EDITCA.items.push({productId:p.id,cantidad:1,precio:p.precioRef,descuento:0}); refreshCASaleItems(); }
function removeCASaleItem(ix){ if(EDITCA.items.length<=1)return; syncCASale(); EDITCA.items.splice(ix,1); refreshCASaleItems(); }
function refreshCASaleItems(){ const el=document.getElementById('ca_items'); if(el) el.innerHTML=EDITCA.items.map((it,ix)=>caSaleItemRow(it,ix)).join(''); updateCASaleTotal(); }
function updateCASaleTotal(){ const el=document.getElementById('ca_total'); if(el) el.textContent=fmt(EDITCA.items.reduce((a,i)=>a+lineTotal(i),0)); }
function saveCASale(){
  syncCASale();
  if(!EDITCA.clienteNombre){ alert('Escribe el nombre del cliente'); return; }
  const items=EDITCA.items.filter(i=>i.productId&&i.cantidad>0);
  if(!items.length){ alert('Agrega al menos un producto'); return; }
  EDITCA.ciudad=(EDITCA.ciudad||'').trim()||'Santiago';
  EDITCA.comuna=(EDITCA.comuna||'').trim();
  EDITCA.direccion=(EDITCA.direccion||'').trim();
  const cli=resolveClient(EDITCA.clienteNombre,EDITCA.ciudad,EDITCA.comuna,EDITCA.direccion, EDITCA.clienteTel,'');
  EDITCA.clienteId = cli?cli.id:'';
  EDITCA.origen='CA';      // Venta GENERADA en Casa Augusta (aparece en el módulo Casa Augusta)
  EDITCA.bodega='CA';      // El stock se descuenta de la bodega de Casa Augusta
  EDITCA.tipoDespacho='CA';
  EDITCA.cuenta=EDITCA.cuenta||ACCOUNTS[0];
  EDITCA.costoEnvio=EDITCA.costoEnvio||0;
  EDITCA.fechaEntrega=EDITCA.fechaEntrega||EDITCA.fecha;
  EDITCA.estadoDespacho = EDITCA.caEstado==='entregado'?'entregado':'pendiente';
  EDITCA.courier = EDITCA.caMetodo==='currier'?(EDITCA.caCurrier||'Currier'):'';
  if(EDITCA.caMetodo!=='currier'){ delete EDITCA.caSeguimiento; }
  EDITCA.items = items.map(i=>({productId:i.productId,cantidad:+i.cantidad,precio:+i.precio,descuento:+i.descuento||0,descripcion:productNameCliente(productById(i.productId))}));
  if(EDITCA.caEstado==='entregado'){ if(!EDITCA.entregadoAt) EDITCA.entregadoAt=Date.now(); EDITCA.items.forEach(i=>{ i.entregadoQty=i.cantidad; }); }
  else { delete EDITCA.entregadoAt; EDITCA.items.forEach(i=>{ delete i.entregadoQty; }); }
  let esNueva=false;
  if(EDITCA.id){ const ix=DB.sales.findIndex(x=>x.id===EDITCA.id); DB.sales[ix]=EDITCA; }
  else{
    esNueva=true;
    EDITCA.id=uid('s');
    if(EDITCA.docTipo==='boleta'&&!EDITCA.docNumero){DB.counter.boleta++;EDITCA.docNumero=String(DB.counter.boleta);}
    if(EDITCA.docTipo==='factura'&&!EDITCA.docNumero){DB.counter.factura++;EDITCA.docNumero=String(DB.counter.factura);}
    DB.sales.push(EDITCA);
  }
  const nuevoId=EDITCA.id;
  save(); closeModal(); go('ca_ventas');
  toastInfo('✅ Venta registrada en Casa Augusta');
  // Al registrar una venta nueva, ofrece de inmediato el comprobante para descargar/compartir.
  if(esNueva){ openConfirmacion(nuevoId); }
}
function deleteCASale(id){
  const s=DB.sales.find(x=>x.id===id); if(!s) return;
  if(!confirm('¿Eliminar esta venta de Casa Augusta?')) return;
  DB.sales=DB.sales.filter(x=>x.id!==id); save(); closeModal(); go('ca_ventas');
  toastInfo('Venta eliminada');
}

      </div>
      <div class="bg-clay-50 rounded-xl p-4 space-y-3">

        <div id="ca_ent_preview" class="text-sm text-clay-500">${tieneResp?'✓ Ya hay un respaldo guardado. Puedes reemplazarlo abajo.':'Aún no has agregado un respaldo.'}</div>
        <button onclick="caEntregaPickFile()" class="w-full border border-clay-300 border-dashed bg-white hover:bg-clay-50 text-clay-700 font-medium py-2.5 rounded-xl text-sm">📎 Subir imagen o archivo (PDF)</button>
        <div class="text-[11px] text-clay-400">Se acepta foto de la boleta, comprobante del currier o PDF.</div>
      </div>
    </div>
    <div class="p-5 border-t border-clay-100 flex items-center justify-between gap-2 sticky bottom-0 bg-white">
      <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-clay-200">Cancelar</button>
      <button onclick="confirmarCAEntrega('${s.id}')" class="bg-sage-600 hover:bg-sage-700 text-white font-semibold px-5 py-2.5 rounded-xl">${yaEntregado?'Guardar':'✓ Confirmar entrega'}</button>
    </div>`);
}
function caEntregaPickFile(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*,application/pdf';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return;
    const prev=document.getElementById('ca_ent_preview');
    const setPrev=t=>{ if(prev) prev.textContent=t; };
    if(f.type==='application/pdf'){
      const r=new FileReader();
      r.onload=()=>{ CA_ENT_UP={data:r.result, mime:'application/pdf', name:f.name||'respaldo.pdf'}; setPrev('✓ Archivo listo: '+CA_ENT_UP.name); };
      r.onerror=()=>alert('No se pudo leer el archivo.');
      r.readAsDataURL(f);
    } else {
      compressImage(f,1200,0.6).then(dataUrl=>{ CA_ENT_UP={data:dataUrl, mime:'image/jpeg', name:'respaldo.jpg'}; setPrev('✓ Imagen lista para guardar.'); })
        .catch(()=>alert('No se pudo procesar la imagen. Intenta con otra foto o un PDF.'));
    }
  };
  inp.click();
}
async function confirmarCAEntrega(id){
  const s=DB.sales.find(x=>x.id===id); if(!s)return;
  const gc=document.getElementById('ca_ent_courier');
  const gs=document.getElementById('ca_ent_seg');
  const courier=gc?gc.value.trim():'';
  const seg=gs?gs.value.trim():'';
  if(courier){ s.courier=courier; s.caCurrier=courier; }
  if(seg) s.caSeguimiento=seg; else if('caSeguimiento' in s) delete s.caSeguimiento;
  if(CA_ENT_UP){
    if(!window.FB||!FB.saveBlob){ alert('Se requiere conexión con la base de datos para guardar el respaldo.'); return; }
    try{ const fileId=uid('foto');
      await FB.saveBlob(fileId, {data:CA_ENT_UP.data, name:CA_ENT_UP.name, mime:CA_ENT_UP.mime, ts:Date.now()});
      if(s.fotoEntregaId && FB.deleteBlob) FB.deleteBlob(s.fotoEntregaId);
      s.fotoEntregaId=fileId; delete s.fotoEntrega;
      s.fotoEntregaMime=CA_ENT_UP.mime;
      if(!s.fotoEntregaFecha) s.fotoEntregaFecha=todayISO();
    }catch(e){ alert('No se pudo guardar el respaldo.\n'+((e&&e.message)||'')); return; }
  }
  s.caEstado='entregado'; s.estadoDespacho='entregado';
  if(!s.entregadoAt)s.entregadoAt=Date.now();
  (s.items||[]).forEach(i=>{ i.entregadoQty=i.cantidad; });
  CA_ENT_UP=null;
  save(); closeModal(); go('ca_entregas'); toastInfo('✅ Entrega registrada');
}
async function verRespaldoCA(id){
  const s=DB.sales.find(x=>x.id===id); if(!s)return;
  if(!tieneFotoEntrega(s)){ openCAEntregaModal(id); return; }
  let data=s.fotoEntrega||null, mime=s.fotoEntregaMime||'image/jpeg';
  if(!data && s.fotoEntregaId && window.FB && FB.loadBlob){
    modal('<div class="p-10 text-center text-clay-400 text-sm">Cargando respaldo… ⏳</div>');
    try{ const rec=await FB.loadBlob(s.fotoEntregaId); data=rec&&rec.data; if(rec&&rec.mime) mime=rec.mime; }catch(e){}
  }
  const esPdf=(mime==='application/pdf')||(typeof data==='string' && data.indexOf('application/pdf')>-1);
  const visor=!data?'<div class="p-10 text-center text-clay-400 text-sm">No se pudo cargar el respaldo.</div>'
    : (esPdf?`<iframe src="${data}" class="w-full" style="height:60vh;border:0;border-radius:12px;"></iframe>`
            :`<img src="${data}" class="w-full rounded-xl" style="max-height:60vh;object-fit:contain;">`);

function caDevRow(it,ix){
  return `<div class="border border-clay-100 rounded-xl p-2.5 bg-clay-50/40"><div class="grid grid-cols-12 gap-2 items-center">

    <input type="number" min="1" value="${it.cantidad}" oninput="onCADevQty(${ix},this.value)" class="col-span-3 border border-clay-200 rounded-lg px-2 py-2 text-sm text-center bg-white" title="Cantidad">

function saveCADevolucion(){

  DB.caReturns.push({id:uid('dev'), fecha:EDITCR.fecha||todayISO(), clienteNombre:EDITCR.clienteNombre||'', items:items.map(i=>({productId:i.productId,cantidad:+i.cantidad})), motivo:EDITCR.motivo||'', creadoPor:(SESSION.nombre||SESSION.email)});
  save(); closeModal(); go('ca_devoluciones');

function saveProspecto(){
  const g=id=>document.getElementById(id);
  EDITPR.fecha=g('pr_fecha')?g('pr_fecha').value:EDITPR.fecha;
  EDITPR.estado=g('pr_estado')?g('pr_estado').value:'nuevo';
  EDITPR.nombre=g('pr_nombre')?g('pr_nombre').value.trim():'';
  EDITPR.telefono=g('pr_tel')?g('pr_tel').value.trim():'';
  EDITPR.email=g('pr_email')?g('pr_email').value.trim():'';
  EDITPR.interes=g('pr_interes')?g('pr_interes').value.trim():'';
  EDITPR.notas=g('pr_notas')?g('pr_notas').value.trim():'';
  if(!EDITPR.nombre && !EDITPR.telefono && !EDITPR.email){ alert('Anota al menos el nombre o un dato de contacto'); return; }
  if(EDITPR.id){ const ix=DB.prospectos.findIndex(x=>x.id===EDITPR.id); if(ix>=0) DB.prospectos[ix]=EDITPR; }
  else { EDITPR.id=uid('pr'); EDITPR.creadoPor=(SESSION.nombre||SESSION.email); DB.prospectos.push(EDITPR); }
  save(); closeModal(); go('ca_prospectos');
  toastInfo('✅ Potencial cliente guardado');
}
function deleteProspecto(id){
  const p=(DB.prospectos||[]).find(x=>x.id===id); if(!p) return;
  if(!confirm('¿Eliminar este potencial cliente?')) return;
  DB.prospectos=DB.prospectos.filter(x=>x.id!==id); save(); closeModal(); go('ca_prospectos');
  toastInfo('Potencial cliente eliminado');
}
